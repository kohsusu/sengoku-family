// 大名問罪/侵攻
// 主家援軍:臣從中被他勢圍攻時,主家可能來救
function reliefChance(){
  if(!S.allegiance || !S.lords[S.allegiance] || S.lords[S.allegiance].alive === false) return 0;
  const L = S.lords[S.allegiance];
  return clamp(0.15 + L.favor*0.006 + (S.ando?0.15:0) + (lordMarr(S.allegiance)?0.30:0), 0, 0.92);
}
function punitiveWar(lordKey){
  const L = S.lords[lordKey], M = LORD_META[lordKey];
  if(!L || !M || S.gameOver || !S.retainers.length) return;
  const hero = topBu();
  const support = myVassals().reduce((a,x)=>a + rSol(x)*0.5, 0);
  const pp = (S.soldiers + support) * (1 + hero.bu/100) * 1.6 * (1 + (S.fort||0)*0.08);   // 籠城之利+城砦+與力
  const ep = lordPower(lordKey) * 6 * (1 - (S.lords[lordKey].wounds || 0));
  const winP = clamp(pp/(pp+ep), 0.03, 0.9);
  queueModal({
    title:`${M.name}家來攻!`,
    body:`${M.name}家遣軍壓境,問罪於${S.famName}家!\n敵勢約 ${ri(ep/2)} 之眾,我方可戰之兵 ${S.soldiers}${support?`(從屬眾與力 ${ri(support)})`:''}。\n${S.fort?`城砦 ${S.fort} 級,`:''}籠城死守,勝算約 ${(winP*100).toFixed(0)}%。`,
    choices:[
      {label:'籠城死守', sub:'五陣攻防——勝則名震東海;敗則割地臣從', fn:()=>{
        armySync();
        const foeN = Math.max(20, ri(ep/2));
        const fa = {ashigaru:ri(foeN*0.5), yumi:ri(foeN*0.2), kiba:ri(foeN*0.2), teppo:0};
        fa.teppo = Math.max(0, foeN - fa.ashigaru - fa.yumi - fa.kiba);
        startBattle({
          title:`${M.name}家來攻——籠城戰`, intro:`${M.name}勢大舉壓境,${S.famName}家閉城迎擊!`,
          defendSiege:true, sent:{...S.army}, terrain:'plain',
          foe:{name:`${M.name}勢`, army:fa, morale:88, general:{bu:62, chi:55}},
          onEnd:(res)=>{
            S.soldiers = armyTotal(S.army);
            if(res.win){
              gainPrestige(10); L.favor = 0;
              res.taisho.merit = (res.taisho.merit||0) + 20;
              log(`奇蹟!${S.famName}家擊退${M.name}勢!名震東海(威望 +10),${res.taisho.name} 立下不世之功。`,'good');
            }else{
              // 城破——三種下場任選
              queueModal({title:`落城——${S.famName}家の處遇`,
                body:`城已破,${M.name}勢湧入曲輪。\n最後的抉擇,決定家名的形狀。`,
                choices:[
                  {label:'開城降伏,臣從其下', sub:`割地 15%、民心 -8;保全家名與大半領地`, fn:()=>{
                    const dmg = ri(S.kokudaka*0.15);
                    S.kokudaka -= dmg; S.minshin = clamp(S.minshin-8,0,100);
                    S.allegiance = lordKey; L.favor = 10;
                    log(`城破請和……割地 ${dmg} 石、民心 -8,臣從${M.name}家。`,'bad');
                  }},
                  {label:'獻上人質與重金求和', sub:`錢 20%、送子為質;保住全部領地、不臣從`, fn:()=>{
                    const gold = ri(S.money*0.2);
                    S.money -= gold;
                    const boys = S.children.filter(c=>c.sex==='m').sort((a,b)=>b.age-a.age);
                    if(boys.length && !S.hostage){
                      const b = boys[0];
                      S.children.splice(S.children.indexOf(b),1);
                      S.hostage = {name:b.name, age:b.age, lord:lordKey, eduBu:b.eduBu, eduNai:b.eduNai, eduChi:b.eduChi};
                      linFate(b.name, `人質於${M.name}家`);
                      log(`獻金 ${gold} 貫、送 ${b.name} 為質——保住了祖地,代價是骨肉分離。`,'bad');
                    }else{
                      S.kokudaka = ri(S.kokudaka*0.92);
                      log(`獻金 ${gold} 貫求和(無子可質,另割地補之)。`,'bad');
                    }
                    L.favor = 15;
                  }},
                  {label:'一族逃散,他日再起', sub:'石高 -35%、兵盡失、威望 -8;但完全自由之身', fn:()=>{
                    S.kokudaka = ri(S.kokudaka*0.65);
                    S.soldiers = 0; armySync();
                    S.prestige = Math.max(0, S.prestige-8);
                    S.minshin = clamp(S.minshin-10,0,100);
                    L.favor = -20;
                    log(`棄城而走,一族散入山野……失地大半,但${S.famName}家未曾低頭。`,'bad');
                  }}
                ]});
            }
            save(); render();
          }
        });
      }},
      {label:'開城請和,俯首臣從', sub:`石高 -8%、威望 -4,即刻臣從${M.name}家${hasKakun('buyu')?';⚠ 違背家訓':''}`, fn:()=>{
        if(hasKakun('buyu')) violateKakun('不戰而開城');

        S.kokudaka -= dmg;
        S.allegiance = lordKey; L.favor = 20;
        S.prestige = Math.max(0, S.prestige-4);
        log(`開城請和,獻田 ${dmg} 石,臣從${M.name}家(威望 -4)。`,'bad');
      }}
    ]
  });
  pumpModal();
}

   }

const DAIMYO_MON = {

// ---------- 家族系譜(世代記錄) ----------
function linRec(){
  if(!S.lineage || !S.lineage.length){
    S.lineage = [{name:S.retainers[0].name, from:S.year, wife:S.wife?[S.wife.name]:[],
      kids:(S.children||[]).map(c=>({name:c.name, sex:c.sex, fate:null}))}];
  }
  return S.lineage[S.lineage.length-1];
}
function linKid(name, sex){ const r = linRec(); if(!r.kids.find(k=>k.name===name)) r.kids.push({name, sex, fate:null}); }
function linFate(name, fate){
  if(!S.lineage) return;
  for(let i=S.lineage.length-1; i>=0; i--){
    const k = S.lineage[i].kids.find(k=>k.name===name);
    if(k){ k.fate = fate; return; }
  }
}
function linWife(name){ const r = linRec(); if(!r.wife.includes(name)) r.wife.push(name); }
function linClose(cause){ const r = linRec(); r.to = S.year; r.fate = cause || '病歿'; }
function linOpen(){ S.lineage.push({name:S.retainers[0].name, from:S.year, wife:S.wife?[S.wife.name]:[], kids:[]}); }

    const isCurrent = i === S.lineage.length - 1;
    const facePerson = (isCurrent && S.retainers[0] && S.retainers[0].name === r.name)
      ? S.retainers[0] : {name:r.name, age:46};
    const img = faceCanvas(facePerson, 42).toDataURL();
    h += `<div class="gl"><img src="${img}"><div class="glt"><b>${GEN_NAMES[i]||(i+1)+'代'}　${r.name}</b>`+
      `<small>${r.from}${r.to?`–${r.to} <i>${r.fate}</i>`:'–現今(在任)'}${r.wife && r.wife.length?`　⚭ ${r.wife.join('、')}`:''}</small></div></div>`;
    if(r.kids && r.kids.length){
      h += '<div class="gkids">' + r.kids.map(k=>
        `<span class="gk">${k.sex==='m'?'<b class="gm">男</b>':'<b class="gf">女</b>'}${k.name}${k.fate?`<i>${k.fate}</i>`:''}</span>`).join('') + '</div>';
    }
    if(i < S.lineage.length - 1) h += '<div class="gline"></div>';
  });
  h += '</div>';
  queueModal({title:`${S.famName}家系譜`, hud:h, body:`自${S.lineage[0].from}年立家,傳承 ${S.lineage.length} 代。`,
    choices:[{label:'閉卷', fn:()=>{}}]});
  pumpModal();
}

// ---------- 生老病死 ----------
function deathChance(age){
  // 戰國「人間五十年」:成年者平均壽命約50歲(疫病/勞苦),少數人得享高壽
  let p = 0.008;
  if(age >= 30) p += (age-30)*0.001;
  if(age >= 45) p += (age-45)*0.0035;
  if(age >= 60) p += (age-60)*0.008;
  return Math.min(p, 0.35);
}

// ---------- 季結算 ----------
function resolveTasks(){
  for(const r of activeR()){
    let t = r.task || 'rest';
    if(S.daimyoMode && t.indexOf('bugyo_') === 0) t = bugyoResolve(t);
    const st = r.stamina ?? 100;
    // 臥病中:強制靜養
    if((r.sick||0) > 0){
      r.sick -= 1;
      r.task = 'rest';
      r.stamina = clamp(st + 20, 0, 100);
      log(`🤒 ${r.name} 臥病靜養中${r.sick>0?`(尚需 ${r.sick} 季)`:',已見好轉'}。`);
      continue;
    }
    // 過勞病倒判定:傷身損能力
    if(t !== 'rest' && st < 15 && Math.random() < 0.25){
      r.task = 'rest';
      r.sick = 1;
      const key = ['bu','nai','chi'][Math.floor(Math.random()*3)];
      r[key] = Math.max(10, r[key] - 1);
      r.stamina = clamp(st + 15, 0, 100);
      log(`🤒 ${r.name} 積勞成疾病倒了!${STAT_LABEL[key]} -1,臥病靜養。`,'bad');
      continue;
    }
    // 疲勞影響成效(特性加成一併計入)
    const kakunMult = (hasKakun('shobai') && ['trade','kaisen','rakuichi'].includes(t)) ? 1.2 : 1;
    // 忠誠影響用命程度:離心者怠工,同心者奮發
    const loy = r === S.retainers[0] ? 100 : (r.loyalty ?? 70);
    const loyMult = loy >= 85 ? 1.1 : loy < 40 ? 0.85 : loy < 55 ? 0.95 : 1;
    const eff = (st >= 50 ? 1 : st >= 25 ? 0.8 : 0.55) * traitMult(r, t) * kakunMult * loyMult;
    const tired = (st >= 50 ? '' : st >= 25 ? '(疲勞)' : '(過勞!成效大減)')
      + (loyMult < 1 ? '(離心怠工)' : loyMult > 1 ? '(同心奮發)' : '');
    if(t !== 'rest') r.stamina = clamp(st - Math.max(2, (TASKS[t].tire || 12) - (r.trait==='kenkyaku'?4:0)), 0, 100);
    switch(t){
      case 'tonden': {
        if(S.money < 5){ log(`${r.name}:資金不足,屯田未能進行。`,'bad'); break; }
        S.money -= 5;
        const gain = ri(r.nai * 0.5 * Math.sqrt(1400 / Math.max(700, S.kokudaka)) * (1 + (S.suiri||0)*0.06) * eff);
        S.kokudaka += gain;
        r.merit = (r.merit||0) + 2;
        log(`${r.name} 督導屯田,石高 +${gain}(現 ${S.kokudaka} 石)。${tired}${grow(r,'nai')}`);
        if(Math.floor(S.kokudaka/250) > Math.floor((S.kokudaka-gain)/250)){
          S.prestige += 3; r.merit += 3;
          log(`領地墾拓有成,家名遠播!威望 +3,${r.name} 記功。`,'good');
        }
        break;
      }
      case 'farm': {
        const sf = S.season===3 ? 0 : (S.season===2 ? 0.5 : 1);
        if(sf === 0){ log(`${r.name}:冬季田事已歇,農務無所施展。`,'bad'); break; }
        const gain = r.nai * 0.1 * sf * eff;
        S.farmWork += gain;
        r.merit = (r.merit||0) + 2;
        log(`${r.name} 勤於農務,今年收成預估 +${gain.toFixed(1)}%。${tired}${grow(r,'nai')}`);
        break;
      }
      case 'toritsugi': {
        const vs = myVassals();
        if(!vs.length){ log(`${r.name}:並無從屬之家,取次無從施行。`); break; }
        const paid = S.money >= 4;
        if(paid) S.money -= 4;
        // 巡訪關係與信心最薄的一家(雪中送炭勝於錦上添花)
        const f = vs.reduce((a,b)=> (a.rel + (a.ltrust ?? 60)) <= (b.rel + (b.ltrust ?? 60)) ? a : b);
        const gain = Math.max(1, ri((2 + r.nai*0.05 + r.chi*0.03) * (paid ? 1 : 0.5) * eff));
        f.rel = clamp(f.rel + gain, -100, 100);
        f.ltrust = clamp((f.ltrust ?? 60) + 3, 0, 100);
        r.merit = (r.merit||0) + 1;
        let extra = '';
        if(paid && Math.random() < 0.2){
          const gift = ri(8 + f.koku * 0.02);
          S.rice += gift; extra = `;其家回贈土產米 ${gift} 石`;
        }
        log(`${r.name} 取次巡訪${fname(f)},饋贈慰勉(關係 +${gain}、信心 +3${paid ? '' : ';囊中羞澀空手上門,誠意折半'}${extra})。${tired}${grow(r,'nai')}`);
        break;
      }
      case 'hunt': {
        const mult = S.season===3 ? 2 : 1;
        const gain = ri((6 + r.bu * 0.25) * mult * eff);
        S.rice += gain;
        r.merit = (r.merit||0) + 2;
        log(`${r.name} 率眾入山狩獵,獵獲折米 ${gain} 石。${mult>1?'(冬獵豐碩)':''}${tired}${grow(r,'bu')}`);
        break;
      }
      case 'drill': {
        const ut = S.drillType || 'ashigaru', U = UNITS[ut];
        const disc = (ut==='teppo' && S.histDone && S.histDone.includes('nagashino')) ? 0.75 : 1;  // 長篠後鐵砲普及
        const cM = ri(U.money*disc), cR = U.rice;
        if(S.money < cM || S.rice < cR){
          // 兵農未分離:錢糧不足改集農兵——莊稼漢持竹槍列陣,不費錢糧但成軍緩慢(僅足輕)
          armySync(); ensureApt(r);
          const g2 = Math.min(ri((2 + r.bu * 0.06) * eff), solCap() - S.soldiers);
          if(g2 > 0){
            S.army.ashigaru = (S.army.ashigaru||0) + g2; S.soldiers += g2;
            r.merit = (r.merit||0) + 1;
            log(`${r.name}:錢糧不足以操練${U.name},改集農兵——足輕 +${g2}(總兵力 ${S.soldiers})。${tired}`);
          }else log(`${r.name}:錢糧不足,無法操練${U.name}(需 ${cM} 貫 ${cR} 石)。`,'bad');
          break;
        }
        const cap = solCap();
        if(S.soldiers >= cap){ log(`${r.name}:領內丁壯已盡(兵力上限 ${cap}),無人可募。`,'bad'); break; }
        S.money -= cM; S.rice -= cR;
        armySync(); ensureApt(r);
        const aptB = r.apt === ut ? 1.35 : r.apt2 === ut ? 1.15 : r.wapt === ut ? 0.8 : 1;   // 專精者練得快
        const gain = Math.min(ri((4 + r.bu * 0.12) * eff * U.num * aptB), cap - S.soldiers);
        if(gain <= 0){ log(`${r.name}:募集未有所獲。`,'bad'); break; }
        S.army[ut] = (S.army[ut]||0) + gain;
        S.soldiers += gain;
        r.merit = (r.merit||0) + 2;
        // 操練也是歷練,但遠不及實戰(實戰一場 36~72,平時一季 9)
        addAptExp(r, {ashigaru:0, yumi:0, kiba:0, teppo:0, [ut]:1}, 9 * eff)
          .forEach(l => log(`⚔ ${l}`, 'good'));
        log(`${r.name} 操練${U.name}${aptB>1?`(${APT_NAME[ut]}${r.apt===ut?'專精':'兼修'})`:aptB<1?'(非其所長)':''},${U.name} +${gain}(總兵力 ${S.soldiers}:${armyLabel()})。${tired}${grow(r,'bu')}`);
        break;
      }
      case 'trade': {
        const gain = ri((10 + (r.chi*0.34 + r.nai*0.16)) * (1 + S.tradeLv*0.2) * (1 + S.kokudaka/4000) * eff);
        S.money += gain;
        r.merit = (r.merit||0) + 2;
        log(`${r.name} 販運經商,獲利 ${gain} 貫。${tired}${grow(r,'chi')}`);
        if(Math.random() < Math.max(0.02, 0.10 + r.chi*0.001 - S.tradeLv*0.03)){
          S.tradeLv += 1; r.merit += 4;
          log(`${r.name} 打通了新商路!商路等級 ${S.tradeLv}(經商收入提升),記大功。`,'good');
        }
        break;
      }
      case 'fushin': {
        if(S.suiri >= 5){ log(`${r.name}:領內水利已臻完善(上限 5 級),無須再修。`); break; }
        if(S.money < 15){ log(`${r.name}:資金不足,普請未能動工。`,'bad'); break; }
        S.money -= 15;
        r._fushin = (r._fushin || 0) + r.nai * eff;
        r.merit = (r.merit||0) + 2;
        if(r._fushin >= 100){
          r._fushin -= 100;
          S.suiri += 1; r.merit += 5;
          log(`${r.name} 主持的水利普請竣工!水利 ${S.suiri} 級(收穫 +${S.suiri*5}%),記大功。`,'good');
        }else{
          log(`${r.name} 督造水利,工程進度 ${ri(r._fushin)}%。${tired}${grow(r,'nai')}`);
        }
        break;
      }
      case 'kaiden': {
        if(S.money < 40){ log(`${r.name}:資金不足,買田未成。`,'bad'); break; }
        S.money -= 40;
        const gain = ri((28 + r.nai*0.15) * Math.sqrt(500/S.kokudaka) * eff);
        S.kokudaka += gain;
        r.merit = (r.merit||0) + 2;
        log(`${r.name} 出錢買田置地,石高 +${gain}(現 ${S.kokudaka} 石)。${tired}${grow(r,'nai')}`);
        if(Math.floor(S.kokudaka/250) > Math.floor((S.kokudaka-gain)/250)){
          S.prestige += 3; r.merit += 3;
          log(`田連阡陌,家名遠播!威望 +3,${r.name} 記功。`,'good');
        }
        break;
      }
      case 'spy': {
        const targets = S.rivals ? S.rivals.filter(f=>f.alive && !f.marr) : [];
        if(!targets.length){ log(`${r.name}:國內已無可下手的目標。`); break; }
        const tgt = targets.reduce((a,b)=>score(a)>=score(b)?a:b);
        r.merit = (r.merit||0) + 2;
        const pSucc = clamp(0.25 + r.chi*0.006 + (hasKakun('bouryaku')?0.15:0), 0, 0.85);
        if(Math.random() < pSucc){
          if(Math.random() < 0.5){
            const steal = 10 + ri(Math.random()*15 + r.chi*0.2);
            S.money += steal;
            log(`${r.name} 潛入${fname(tgt)}帳房,竊得 ${steal} 貫。${grow(r,'chi')}`,'good');
          }else{
            const dmg = Math.max(5, ri(tgt.koku*0.03));
            tgt.koku -= dmg;
            log(`${r.name} 夜毀${fname(tgt)}水路穀倉,其石高 -${dmg}。${grow(r,'chi')}`,'good');
          }
        }else if(Math.random() < 0.25){
          tgt.rel = clamp(tgt.rel-15,-100,100);
          log(`${r.name} 行蹤敗露!${fname(tgt)}震怒(關係 -15)。`,'bad');
        }else{
          log(`${r.name} 潛探${fname(tgt)},無功而返。`);
        }
        break;
      }
      case 'sekkyo': {
        const up = 2 + ri(r.chi*0.03);
        S.minshin = clamp(S.minshin + up, 0, 100);
        S.pop += 3 + ri(r.chi*0.05);
        r.merit = (r.merit||0) + 2;
        log(`${r.name} 開壇說法,門徒雲集(民心 +${up}、人口+)。${tired}${grow(r,'chi')}`);
        break;
      }
      case 'kaisen': {
        if(Math.random() < (r.trait==='fukubukuro' ? 0.05 : 0.10)){
          const lost = ri(10 + Math.random()*20);
          S.money = Math.max(0, S.money - lost);
          log(`${r.name} 的船隊遭遇風浪!貨物盡失(錢 -${lost})。`,'bad');
        }else{
          const gain = ri((14 + r.chi*0.28) * (1 + S.tradeLv*0.2) * (1 + (S.ships||0)*0.15) * eff);
          S.money += gain;
          r.merit = (r.merit||0) + 2;
          log(`${r.name} 廻船歸港,滿載而歸(錢 +${gain})。${tired}${grow(r,'chi')}`);
          if(Math.random() < Math.max(0.02, 0.10 - S.tradeLv*0.02)){
            S.tradeLv += 1; r.merit += 4;
            log(`${r.name} 開闢新航路!商路 ${S.tradeLv} 級。`,'good');
          }
        }
        break;
      }
      case 'shiro': {
        if(S.fort >= 5){ log(`${r.name}:城砦已固若金湯(上限 5 級)。`); break; }
        if(S.money < 15){ log(`${r.name}:資金不足,普請未能動工。`,'bad'); break; }
        S.money -= 15;
        r._fort = (r._fort||0) + r.nai * eff;
        r.merit = (r.merit||0) + 2;
        if(r._fort >= 100){
          r._fort -= 100; S.fort += 1; S.prestige += 1; r.merit += 5;
          log(`${r.name} 督造的城砦竣工!城砦 ${S.fort} 級(籠城守勢 +${S.fort*8}%,威望 +1),記大功。`,'good');
        }else log(`${r.name} 督造城砦,工程進度 ${ri(r._fort)}%。${tired}${grow(r,'nai')}`);
        break;
      }
      case 'rakuichi': {
        if(S.rakuichi >= 3){ log(`${r.name}:樂市已極繁盛(上限 3 級)。`); break; }
        if(S.money < 30){ log(`${r.name}:資金不足,樂市未能開張。`,'bad'); break; }
        S.money -= 30;
        r._raku = (r._raku||0) + r.chi * eff;
        r.merit = (r.merit||0) + 2;
        if(r._raku >= 100){
          r._raku -= 100; S.rakuichi += 1; S.prestige += 1; r.merit += 5;
          log(`${r.name} 開設的樂市開張!樂市 ${S.rakuichi} 級(每季 +${S.rakuichi*3} 貫、人口上限 +${S.rakuichi*30}),記大功。`,'good');
        }else log(`${r.name} 籌辦樂市,進度 ${ri(r._raku)}%。${tired}${grow(r,'chi')}`);
        break;
      }
      case 'zousen': {
        if(S.ships >= 3){ log(`${r.name}:船團已然壯盛(上限 3 級)。`); break; }
        if(S.money < 40){ log(`${r.name}:資金不足,造船未能開工。`,'bad'); break; }
        S.money -= 40;
        r._ship = (r._ship||0) + r.nai * eff;
        r.merit = (r.merit||0) + 2;
        if(r._ship >= 100){
          r._ship -= 100; S.ships += 1; r.merit += 5;
          log(`${r.name} 監造的大船下水!船團 ${S.ships} 級(廻船獲利 +${S.ships*15}%),記大功。`,'good');
        }else log(`${r.name} 監造大船,進度 ${ri(r._ship)}%。${tired}${grow(r,'nai')}`);
        break;
      }
      case 'ryuugen': {
        const targets = S.rivals ? S.rivals.filter(f=>f.alive && !f.marr && !f.pact && f.prestige > 0) : [];
        if(!targets.length){ log(`${r.name}:已無可中傷的對象。`); break; }
        const tgt = targets.reduce((a,b)=>score(a)>=score(b)?a:b);
        r.merit = (r.merit||0) + 2;
        if(Math.random() < 0.30 + r.chi*0.005 + (hasKakun('bouryaku')?0.15:0)){
          const dmg = 1 + ri(r.chi*0.02);
          tgt.prestige = Math.max(0, tgt.prestige - dmg);
          log(`${r.name} 散布的流言傳遍鄉里,${fname(tgt)}威望 -${dmg}(番付動搖)。${grow(r,'chi')}`,'good');
        }else if(Math.random() < 0.20){
          tgt.rel = clamp(tgt.rel-10,-100,100);
          log(`流言源頭敗露!${fname(tgt)}對${S.famName}家懷恨在心(關係 -10)。`,'bad');
        }else log(`${r.name} 的流言無人當真。`);
        break;
      }
      case 'kitou': {
        let healed = 0;
        for(const x of S.retainers){
          if(x === r) continue;
          x.stamina = clamp((x.stamina??100) + 6, 0, 100);
          if((x.sick||0) > 0 && Math.random() < 0.5){ x.sick -= 1; healed++; }
        }
        r.merit = (r.merit||0) + 2;
        log(`${r.name} 焚香祈禱,家中上下身心得安(全員體力 +6${healed?`,${healed} 人病勢好轉`:''})。${grow(r,'chi')}`);
        break;
      }
      case 'bugyo_minsei': {
        S.minshin = clamp(S.minshin + 1, 0, 100);
        S.pop += 2 + ri(r.chi * 0.04);
        r.merit = (r.merit||0) + 2;
        log(`${r.name}(民政奉行)巡撫領內,民心 +1、流民來歸。${tired}${grow(r,'nai')}`);
        break;
      }
      case 'educate': {
        // 受教者:未元服的子女,以及「未元服卻已在家中」的一門(幼主・姫當主)
        const kids = S.children.filter(c=>c.age>=5 && c.age<15);
        const wards = S.retainers.filter(x=>x !== r && x.kind==='一門' && x.age < 15);
        const all = kids.concat(wards);
        if(!all.length){
          r.stamina = clamp(st + 35, 0, 100); // 沒事做,等同休養
          log(`${r.name}:家中無適齡子弟,改為休養(體力恢復至 ${r.stamina})。`);
          break;
        }
        for(const k of all){
          k.eduBu = (k.eduBu||0) + r.bu*0.03*eff;
          k.eduNai = (k.eduNai||0) + r.nai*0.03*eff;
          k.eduChi = (k.eduChi||0) + r.chi*0.03*eff;
        }
        r.merit = (r.merit||0) + 2;
        log(`${r.name} 教導子弟文武之道(${all.map(k=>k.name).join('、')})`+
          `${wards.length?`——${wards.map(w=>w.name).join('、')}雖已襲家督/列一門,尚在髫齡,傅役不可廢`:''}。${tired}${grow(r,'chi')}`);
        break;
      }
      default: {
        const rec = r.age >= 60 ? 25 : 35;
        r.stamina = clamp(st + rec, 0, 100);
        log(`${r.name} 休養一季,體力恢復(現 ${r.stamina})。`);
      }
    }
  }
}

function autumnHarvest(){
  const roll = Math.random();
  S.weather = roll < 0.20 ? {f:1.3, name:'豐作'} : roll < 0.75 ? {f:1.0, name:'平年'} : {f:0.6, name:'凶作'};
  const laborNeed = S.kokudaka / 2;                       // 每人約耕二石
  const away = (S.warLabor || 0) * 3;                     // 動員一兵,連帶輜重人夫三人離田
  const laborF = clamp((S.pop - away) / laborNeed, 0, 1);
  const total = ri(S.kokudaka * S.weather.f * (1 + S.farmWork/100) * (1 + S.suiri*0.05) * laborF);
  const taken = ri(total * S.taxRate);
  S.rice += taken;
  const w = S.weather;
  log(`【秋收】${w.name}!總收穫 ${total} 石,年貢(${ri(S.taxRate*10)}公)入倉 ${taken} 石。`, w.f>1?'good':(w.f<1?'bad':''));
  if(laborF < 1) log(`⚠ 勞力不足(${S.kokudaka} 石田需約 ${ri(laborNeed)} 人耕作,現有 ${S.pop} 人${away?`、其中 ${away} 人因軍役離田`:''}),部分田地拋荒,收穫僅 ${ri(laborF*100)}%。`,'bad');
  S.warLabor = 0;
  if(w.f < 0.9){
    queueModal({
      title:'凶作',
      body:`今年天候不順,田裡收成大減。\n領民面有饑色,已有人變賣家當…\n是否開倉救濟?(約需 ${ri(S.pop*0.1)} 石)`,
      choices:[
        {label:'開倉救濟', sub:`米 -${ri(S.pop*0.1)},民心 +8`, fn:()=>{
          const need = ri(S.pop*0.1);
          if(S.rice >= need){ S.rice -= need; S.minshin = clamp(S.minshin+8,0,100); log('開倉放糧,領民感念家中恩義。民心 +8。','good'); }
          else { log('倉中存米不足,救濟未能施行。民心 -10。','bad'); S.minshin = clamp(S.minshin-10,0,100); }
        }},
        {label:'讓領民自行想辦法', sub:`民心 -10${hasKakun('minpon')?';⚠ 違背家訓':''}`, fn:()=>{
          S.minshin = clamp(S.minshin-10,0,100);
          log('饑民流離,對家中怨聲漸起。民心 -10。','bad');
          if(hasKakun('minpon')) violateKakun('見饑不救');
        }}
      ]
    });
  }
}

function winterSettle(){
  // 兵糧:兵農未分離——足輕與弓自耕自食,冬季折半;騎馬(馬料)・鐵砲(硝石)為常備,所費三倍
  armySync();
  const nofu = (S.army.ashigaru||0) + (S.army.yumi||0);
  const jobi = Math.max(0, S.soldiers - nofu);
  const upkeep = ri(nofu * 1.4 + jobi * 3.4);
  S.rice -= upkeep;
  let lines = [`兵糧消耗:${upkeep} 石(農兵 ${nofu}×1.4・常備 ${jobi}×3.4)`];
  if(S.rice < 0){
    const lost = Math.min(S.soldiers, Math.ceil(-S.rice / 2.0));
    S.soldiers -= lost; S.rice = 0;
    lines.push(`⚠ 存糧見底!${lost} 名士卒逃散。`);
  }
  // ⛏ 礦山(信濃山金):歲末出金,偶有山崩
  if(S.mine){
    if(Math.random() < 0.08){
      S.minshin = clamp(S.minshin - 3, 0, 100);
      lines.push(`⛏ 山崩!礦洞埋没,今歲顆粒無收——礦夫家小哭聲不絕(民心 -3)。`);
    }else{
      const gold = ri(S.mine * (18 + Math.random() * 22));
      S.money += gold;
      lines.push(`⛏ 山金掘り出金 ${gold} 貫(礦山 ${S.mine} 級)。`);
    }
  }
  // 📜 德政請願:連年凶作,領民乞求蠲免(戰國的一揆多為德政一揆)
  S.leanRun = (S.weather && S.weather.f < 0.85) ? (S.leanRun||0) + 1 : 0;
  if(S.tokuseiCd) S.tokuseiCd -= 1;
  if(S.leanRun >= 2 && !S.tokuseiCd && !S.gameOver && Math.random() < 0.6){
    S.tokuseiCd = 4;
    const waive = ri(S.kokudaka * 0.18);
    queueModal({ title:'領民請願——德政!',
      body:`連年凶作,村村戶戶已無隔宿之糧。莊屋長老列於門前,叩首泣訴:\n\n「懇請大人德政——蠲免積欠,免今歲之貢!否則領民唯有逃散一途……」`,
      choices:[
        {label:`允德政(免貢折米 ${waive} 石)`, sub:'民心 +12、威望 +4——仁政之名遠播', fn:()=>{
          S.rice = Math.max(0, S.rice - waive);
          S.minshin = clamp(S.minshin + 12, 0, 100);
          gainPrestige(4);
          log(`📜 德政令下:蠲免積欠、免今歲之貢(折米 ${waive} 石)——領民感泣,${S.famName}家仁政之名遠播(民心 +12、威望 +4)。`,'good');
        }},
        {label:'拒之', sub:'民心 -10;三成機率德政一揆蜂起', fn:()=>{
          S.minshin = clamp(S.minshin - 10, 0, 100);
          if(Math.random() < 0.3){
            const dmg = ri(S.kokudaka * 0.06);
            S.kokudaka = Math.max(100, S.kokudaka - dmg);
            log(`🔥 德政一揆蜂起!饑民焚毀帳冊、搗毀陣屋——田畝荒廢 ${dmg} 石(民心 -10)。`,'bad');
          }else log('嚴詞拒了德政之請……領民含恨而退(民心 -10)。','bad');
        }}
      ]});
    pumpModal();
  }
  // 家中經費:屋敷修繕・祭祀・進物・道具——按「實際經營得起的規模」計(荒田不課)
  const workable = Math.min(S.kokudaka, S.pop * 2);
  const upkRice = ri(workable * 0.04);
  const upkHouse = ri(workable * 0.009 + S.soldiers * 0.10);
  const upkMen   = ri(activeR().length * (6 + S.kokudaka/400));       // 家臣的屋敷・扶持・裝束
  const upkFort  = ri((S.fort||0) * 25);                              // 城砦的修繕與番役
  const upkGun   = ri((S.army && S.army.teppo || 0) * 0.55);          // 鐵砲隊的火藥鉛彈
  const upkMoney = upkHouse + upkMen + upkFort + upkGun;
  S.rice = Math.max(0, S.rice - upkRice);
  S.money = Math.max(0, S.money - upkMoney);
  lines.push(`家中經費:米 ${upkRice} 石、錢 ${upkMoney} 貫`+
    `(屋敷祭祀 ${upkHouse}・家臣 ${activeR().length} 人 ${upkMen}`+
    `${upkFort?`・城砦 ${upkFort}`:''}${upkGun?`・鐵砲 ${upkGun}`:''})。`);
  // 年俸(知行)支付
  const vassals = activeR().slice(1);
  const payroll = vassals.reduce((a,r)=>a+(r.salary||0), 0);
  if(payroll > 0){
    if(S.rice >= payroll){
      S.rice -= payroll;
      vassals.forEach(r=>{ if((r.loyalty||70) < 85) r.loyalty = (r.loyalty||70) + 1; });
      lines.push(`發放家臣年俸 ${payroll} 石。`);
    }else{
      S.rice = 0;
      vassals.forEach(r=>{ r.loyalty = clamp((r.loyalty||70) - 10, 0, 100); });
      lines.push(`⚠ 存米不足以發放年俸(需 ${payroll} 石)!家臣忠誠大減。`);
    }
  }
  // 民心:向「治績基準線」回歸(不再是只進不退的一次性衝頂)
  let base = 50
    + (S.taxRate <= 0.3 ? 15 : S.taxRate >= 0.5 ? -15 : 0)
    + Math.min(10, (S.suiri||0) * 2)
    + (S.clanType === 'temple' ? 10 : 0)
    + (hasKakun('minpon') ? 8 : 0)
    + Math.min(6, (S.rakuichi||0) * 3)
    - (S.pop > popCap() * 0.95 ? 10 : 0);
  if(S.weather && S.weather.f < 0.9) base -= S.taxRate >= 0.5 ? 12 : 5;
  base = clamp(base, 5, 95);
  const drift = ri((base - S.minshin) * 0.25);
  if(drift !== 0){
    S.minshin = clamp(S.minshin + drift, 0, 100);
    lines.push(`民心向治績基準 ${base} 回歸(${drift>0?'+':''}${drift},現 ${S.minshin})——${S.taxRate>=0.5?'苛稅傷民':S.taxRate<=0.3?'寬仁得眾':'賦役如常'}。`);
  }
  // 人口(上限與石高相繫:約一石養一人)
  let growth = 0;
  if(S.minshin >= 60) growth = ri(S.pop * 0.02);
  else if(S.minshin >= 35) growth = ri(S.pop * 0.005);
  else growth = -ri(S.pop * 0.02);
  if(growth > 0 && hasKakun('minpon')) growth = ri(growth * 1.5);
  const pcap = popCap();
  if(growth > 0 && S.pop + growth > pcap){
    growth = Math.max(0, pcap - S.pop);
    lines.push(`⚠ 田地已難養活更多人(人口上限 ${pcap},繫於石高)——欲增人丁,先拓石高。`);
  }
  if(S.pop > pcap){
    const flee = ri((S.pop - pcap) * 0.3);
    if(flee > 0){
      growth -= flee;
      lines.push(`⚠ 地狹民饑,${flee} 人流散他鄉(人口上限 ${pcap})。`);
    }
  }
  S.pop = Math.max(50, S.pop + growth);
  lines.push(`人口 ${growth>=0?'+':''}${growth}(現 ${S.pop}/${pcap} 人,民心 ${S.minshin})`);
  // ── 家族與家臣的一年 ──
  for(const r of S.retainers) r.age += 1;
  if(S.wife) S.wife.age += 1;
  (S.consorts||[]).forEach(cs=>{ cs.age += 1; });
  for(const c of S.children) c.age += 1;
  lines.push(`一族與家臣皆長一歲。`);
  // 誕生(正室・側室皆可能得子;女當主由自身生育)
  {
    const mothers = [];
    if(S.wife && motherAge() <= 42) mothers.push({n: lordIsFemale() ? '女當主' : `奧方${S.wife.name}`, p:0.22});
    if(!lordIsFemale()) (S.consorts||[]).forEach(cs=>{ if(cs.age <= 42) mothers.push({n:`側室${cs.name}`, p:0.14}); });
    const pAll = Math.min(0.6, mothers.reduce((a,m)=>a+m.p, 0));
    if(mothers.length && Math.random() < pAll){
      const m = mothers[Math.floor(Math.random()*mothers.length)];
      const sex = Math.random() < 0.5 ? 'm' : 'f';
      const name = pickChildName(sex);
      S.children.push({name, sex, age:0, eduBu:0, eduNai:0, eduChi:0});
      linKid(name, sex);
      lines.push(`🎉 ${m.n}產下一${sex==='m'?'子':'女'},取名「${name}」!`);
    }
  }
  // 元服
  for(const c of S.children.filter(c=>c.sex==='m' && c.age>=15)){
    const adult = genpuku(c);
    lines.push(`⚔ ${c.name} 元服,改名「${adult.name}」,列席一門眾(武${adult.bu} 政${adult.nai} 智${adult.chi})。`);
  }
  S.children = S.children.filter(c=>!(c.sex==='m' && c.age>=15));
  // 幼主親政
  { const l = S.retainers[0];
    if(l && (l.role==='當主(幼)' || l.role==='姫當主(幼)') && l.age>=15){
      const fem = l.role==='姫當主(幼)';
      l.role = fem ? '女當主' : '當主';
      // 攝政期間的傅育在此結算——教得越勤,親政時越見其成
      const gB = ri((l.eduBu ||0)*0.45), gN = ri((l.eduNai||0)*0.45), gC = ri((l.eduChi||0)*0.45);
      l.bu  = clamp(l.bu  + 5 + gB, 10, 90);
      l.nai = clamp(l.nai + 5 + gN, 10, 90);
      l.chi = clamp(l.chi + 5 + gC, 10, 90);
      l.eduBu = l.eduNai = l.eduChi = 0;
      S.prestige += 5;
      const taught = gB + gN + gC;
      lines.push(`👑 ${l.name} 元服親政,家中上下一新!威望 +5。`+
        (taught > 0
          ? `　攝政期間的傅育今日見功——武勇 +${5+gB}・內政 +${5+gN}・智謀 +${5+gC}(現 武${l.bu} 政${l.nai} 智${l.chi})。`
          : `　⚠ 幼主在位期間未曾延師傅育,親政時僅得虛長(武${l.bu} 政${l.nai} 智${l.chi})——「教育子弟」本可教到當主身上。`));
    }
  }
  // 病歿判定
  const dead = S.retainers.filter(r => Math.random() < deathChance(r.age));
  for(const r of dead){
    if(r === S.retainers[0]) succession(lines);
    else if(S.retainers.indexOf(r) >= 0){
      S.retainers.splice(S.retainers.indexOf(r), 1);
      lines.push(`🕯 ${r.name}(${r.role}・${r.age}歲)病歿。`);
      if(S.wife && S.wife.muko && S.wife.name === r.name) S.wife = null;  // 婿養子歿
    }
  }
  // 家名已絕:此後諸事(猜忌・問罪・國戰・外交)一概無從談起
  if(S.gameOver){ lines.forEach(l=>log(l, /☠|🕯/.test(l) ? 'bad' : '')); return; }
  if(S.wife && !S.wife.muko && Math.random() < deathChance(S.wife.age)){
    lines.push(`🕯 奧方 ${S.wife.name}(${S.wife.age}歲)病歿…`);

  }
  if(S.consorts && S.consorts.length){
    for(const cs of [...S.consorts]){
      if(Math.random() < deathChance(cs.age)){

        lines.push(`🕯 側室 ${cs.name}(${cs.age}歲)病歿…`);

    }
  }
  // 大病:躲過死劫仍可能病一場,元氣大傷(年紀越大越容易;病弱者尤甚)
  for(const r of S.retainers){
    if(Math.random() < deathChance(r.age) * 0.9 * (r.trait==='byoujaku' ? 1.6 : 1)){
      const loss = [];
      for(const key of ['bu','nai','chi']){
        const d = 1 + ((r.age >= 50 && Math.random() < 0.5) ? 1 : 0);
        r[key] = Math.max(10, r[key] - d);
        loss.push(`${STAT_LABEL[key]} -${d}`);
      }
      r.sick = 2;
      r.stamina = Math.min(r.stamina ?? 100, 20);
      r.task = 'rest';
      lines.push(`🤒 ${r.name}(${r.age}歲)大病一場,元氣大傷(${loss.join('、')}),需臥床兩季。`);
    }
  }
  // 功高祿薄與出奔
  const unhappy = activeR().slice(1).filter(r=>(r.merit||0) > (r.salary||0)*4);
  if(unhappy.length){
    unhappy.forEach(r=>{ r.loyalty = clamp((r.loyalty||70) - (r.trait==='yashin' ? 6 : 3), 0, 100); });
    lines.push(`⚠ ${unhappy.map(r=>r.name).join('、')} 功高祿薄,心懷不滿(忠誠下降)。點擊家臣名可加增知行。`);
  }
  // 名望即人望:主家有名,家中自安;名望墜落則人心動搖
  const mb = meiboLoyal(), pDrop = (S.lastPrestige ?? S.prestige) - S.prestige;
  if(mb >= 0.5 || pDrop >= 12){
    activeR().slice(1).forEach(r=>{ r.loyalty = clamp((r.loyalty??70) + ri(mb) - (pDrop >= 12 ? 2 : 0), 0, 100); });
    if(pDrop >= 12) lines.push(`⚠ 家名蒙塵(威望驟落 ${pDrop})——家中議論紛紛,忠誠 -2。`);
    else if(ri(mb) > 0) lines.push(`${meiboTier().name}——${meiboTier().desc}(家臣忠誠 +${ri(mb)})。`);
  }
  S.lastPrestige = S.prestige;
  // 忠義者忠誠有底線
  S.retainers.forEach(r=>{ if(r.trait==='chuugi' && (r.loyalty??70) < 60) r.loyalty = 60; });
  for(const r of activeR().slice(1).filter(r=>r.kind!=='一門' && r.trait!=='chuugi' && (r.loyalty??70) < 40)){
    if(Math.random() < (40 - r.loyalty) * 0.02){
      S.retainers.splice(S.retainers.indexOf(r), 1);
      S.prestige = Math.max(0, S.prestige - 3);
      lines.push(`💨 ${r.name} 不堪冷遇,出奔他國!威望 -3。`);
    }
  }
  // 出缺遞補:部屋住列席
  rosterPromote(lines);
  // ── 【家督之憂】無妻室/無繼嗣的明示警告(全遊戲最容易被忽略、代價最大的一件事) ──
  if(!S.gameOver && S.retainers.length){
    const lord = S.retainers[0];
    const maleIchimon = S.retainers.filter((r,i)=> i>0 && r.kind==='一門' && r.sex!=='f').length;
    const femIchimon  = S.retainers.filter((r,i)=> i>0 && r.kind==='一門' && r.sex==='f').length;
    const boys = S.children.filter(c=>c.sex==='m').length;
    const girls = S.children.filter(c=>c.sex==='f').length;
    const heirs = maleIchimon + boys + (S.hostage ? 1 : 0);
    const fem = lordIsFemale();
    const canBear = fem ? !!(S.wife && S.wife.muko) : (!!S.wife || (S.consorts||[]).length > 0);
    if(heirs === 0 && femIchimon === 0 && girls === 0){
      lines.push(`⚠⚠【家督之憂】${S.famName}家目前無任何繼嗣——當主 ${lord.name}(${lord.age}歲)一旦有事,家名即斷!`+
        (canBear ? '　速求子嗣為要。' : fem ? '　請速「招婿養子」(一門面板)。' : '　請速「迎娶正室」或「納側室」(一門面板)。'));
    }else if(heirs === 0){
      lines.push(`⚠【家督之憂】無男嗣。`+
        (femIchimon ? `萬一之際尚可由 ${femIchimon} 名一門女子繼為女當主。` :
         girls ? `女兒滿 15 歲可「出仕」列席一門——那是絕嗣時的最後保險。` : '')+
        (canBear ? '' : fem ? '　另請速招婿養子。' : '　另請速迎正室/納側室以求子。'));
    }else if(!canBear && !fem && lord.age < 55 && S.year % 3 === 0){
      lines.push(`【家督之憂】當主 ${lord.name} 尚無妻室,家中無由添丁——一門面板可「迎娶正室」(20貫)。`);
    }
  }
  // 名浪人的去向(錯過之才,成為天下風聞)
  if(!S.flags) S.flags = {};
  if(!S.flags.hronin) S.flags.hronin = {};
  for(const h of HIST_RONIN){
    if(S.year > h.y1 && !S.flags.hronin[h.id]){
      S.flags.hronin[h.id] = 'gone';
      let takers = (S.rivals||[]).filter(x=>x.alive && x.men && x.men.length < manCap(x) + 1);
      // 有淵源之國者,多半出仕同國之家(戶隱的忍者不會跑去田原)
      if(h.reg && REGIONS[h.reg]){
        const R = REGIONS[h.reg];
        const near = takers.filter(x=>Math.hypot((x.x||0)-R.px, (x.y||0)-R.py) <= 160);
        if(near.length) takers = near;
      }
      const taker = takers.length && Math.random() < 0.4
        ? (takers.find(x=>x.clanKind === h.aff) || pick1(takers)) : null;
      if(taker){
        const hage = h.age0 + (S.year - h.y0);
        const hm = {name:h.name, age:hage, bu:h.bu, nai:h.nai, chi:h.chi, fame:true, trait:h.trait};
        ensureApt(hm); taker.men.push(hm);
        lines.push(`⚡【天下風聞】名浪人 ${h.name} 出仕${fname(taker)}!——險些登門的名將,如今在鄰家帳下為將。`);
      }else{
        lines.push(`【天下風聞】${h.gone}`);
      }
    }
  }
  // 繼嗣警示(亂世人命如朝露,當主過45而無後備,家名危矣)
  if(!S.gameOver){
    const lord = S.retainers[0];
    const hasAdultHeir = S.retainers.slice(1).some(r=>r.kind==='一門');
    const hasBoy = S.children.some(c=>c.sex==='m');
    if(lord.age >= 45 && !hasAdultHeir && !hasBoy){
      lines.push(`⚠ 當主已${lord.age}歲,膝下猶無男嗣——亂世人命如朝露,家名斷絕只在旦夕之間!`);
    }
  }
  // 姻親
  if(S.allies.length){
    S.prestige += S.allies.length;
    lines.push(`姻親之家(${S.allies.map(a=>a+'家').join('、')})互通聲息,威望 +${S.allies.length}。`);
  }
  // 攻守同盟
  if(S.rivals){
    const pacts = S.rivals.filter(f=>f.alive && (f.pact || f.marr));
    if(pacts.length){
      S.prestige += pacts.length;
      lines.push(`姻親・盟約之家(${pacts.map(f=>fname(f)).join('、')})守望相助,威望 +${pacts.length}。`);
    }
  }
  if(S.enkyoCd > 0) S.enkyoCd -= 1;
  if(S.intel > 0) S.intel -= 1;
  // 放貸回收(玩家為債主)
  if(S.loan && S.year >= S.loan.due){
    const db = (S.rivals||[]).find(f=>f.id===S.loan.from);
    if(db && db.alive && Math.random() < 0.78){
      S.money += S.loan.amt;
      db.rel = clamp(db.rel+10,-100,100);
      lines.push(`💰 ${fname(db)}如期償還借銀 ${S.loan.amt} 貫(關係 +10)。`);
    }else{
      const seize = db && db.alive ? Math.max(10, ri(db.koku*0.06)) : 0;
      if(seize){ db.koku -= seize; S.kokudaka += seize; db.rel = clamp(db.rel-25,-100,100); }
      lines.push(`⚠ ${db&&db.alive?fname(db):'債家'}倒帳!${seize?`依契強收其田 ${seize} 石抵債(關係 -25)`:'血本無歸'}。`);
    }
    S.loan = null;
  }
  // 借銀償還期
  if(S.debt && S.year >= S.debt.due){
    const cr = (S.rivals||[]).find(f=>f.id===S.debt.to);
    if(S.money >= S.debt.amt){
      S.money -= S.debt.amt;
      if(cr){ cr.rel = clamp(cr.rel+15,-100,100); }
      gainPrestige(3);
      lines.push(`📜 如期償還${cr?fname(cr):'債主'}借銀 ${S.debt.amt} 貫——信義為商家之本(關係 +15、威望 +3)。`);
      S.debt = null;
    }else{
      const seize = ri(S.kokudaka*0.08);
      S.kokudaka -= seize;
      if(cr){ cr.rel = clamp(cr.rel-35,-100,100); cr.koku += seize; }
      S.prestige = Math.max(0, S.prestige-8);
      S.retainers.forEach(r=>{ r.loyalty = clamp((r.loyalty??70)-6,0,100); });
      lines.push(`🔥 償不出${cr?fname(cr):'債主'}的借銀!田地被抵押強收 ${seize} 石(關係 -35、威望 -8、家臣離心)。`);
      S.debt = null;
    }
  }
  S.boshu = 0;   // 招民成本每年重置
  S.warLabor = 0;
  // 米倉容量:陳米生蟲、鼠雀為患——囤積無度者自受其咎
  const granary = Math.max(500, S.kokudaka * 2.2);
  if(S.rice > granary){
    const rot = ri((S.rice - granary) * 0.38);
    S.rice -= rot;
    lines.push(`⚠ 倉廩已溢(容量約 ${granary} 石),陳米生蟲鼠雀為患,損失 ${rot} 石。宜賣米換錢或擴充領地。`);
  }
  // 威望消長:世人健忘,舊日聲名終歸塵土
  if(S.prestige > 30){
    const fade = ri(S.prestige * 0.05);
    S.prestige -= fade;
    lines.push(`世人健忘,舊日聲名漸為人淡忘(威望 -${fade},現 ${S.prestige})。`);
  }
  // 家訓效果
  if(S.kakun === 'minpon'){
    S.minshin = clamp(S.minshin + 2, 0, 100);
    lines.push(`家訓「民安為本」——輕徭薄賦,領民感戴(民心 +2)。`);
  }
  if(S.kakun === 'chusetsu' && S.allegiance){
    S.prestige += 3;
    if(S.lords[S.allegiance]) addFavor(S.lords[S.allegiance], (3));
    lines.push(`家訓「忠節無二」——事主唯謹,內外稱道(威望 +3、主家好感 +3)。`);
  }
  // 大名的戰創漸癒 + 好感夾限(此前 clamp 藏在條件分支且只蓋今川織田——P2 兩家時代的遺跡)
  if(S.lords) for(const k in S.lords){
    const Lk = S.lords[k]; if(!Lk) continue;
    if(typeof Lk.favor === 'number') Lk.favor = clamp(Lk.favor, -100, 100);
    if(Lk.wounds){
      // 徵募補充是要時間的:每年僅復原 6%+傷勢的12%——國戰重創(0.55)須四五年方能滿編
      Lk.wounds = Math.max(0, Lk.wounds - (0.06 + Lk.wounds*0.12));
      if(Lk.wounds < 0.03) delete Lk.wounds;
    }
  }
  // 大名昇格檢查
  checkDaimyo(lines);
  // 國人眾動態
  if(S.rivals) simRivals(lines);
  // AI:眾的家業經營與評定、彼此之間的政治、對玩家的反應
  if(S.rivals){
    resolveRumors(lines);          // 去年放出風聲的兵事,今年見真章
    simRivalActions(lines);        // 收支・依方針投資
    simRivalPolitics(lines);       // 同盟・聯姻・併吞之議
    if((S.aggression||0) > 0){ S.aggression = Math.max(0, S.aggression - 3); }   // 侵略之名漸淡
    simCoalition(lines);
    simRivalPredation(lines);      // 趁我之虛
    simRivalOffers();
  }
  // 大名重臣的作為(國力自然成長・調略)
  if(S.lords) simLords(lines);
  if(S.lords) simLordKiritori(lines);    // 大名切り取り(風聞→翌年兵臨城下)
  if(S.lords) simLordFeuds(lines);       // 境目相論(動態點火/和睦)
  if(S.lords) simVassalDefections(lines);
  // 自家從屬眾:年貢・威望・寝返り
  if(S.rivals){
    const mine = myVassals();
    if(mine.length){
      // 役は家業に應じて——從屬眾依其類型上納不同的役
      let trib = 0, gold = 0, teppo = 0, intelN = 0, mind = 0;
      const detail = [];
      for(const f of mine){
        const base = f.koku * 0.03;
        switch(f.clanKind){
          case 'merchant': gold += ri(base*1.6); detail.push(`${fname(f)}(御用金)`); break;
          case 'suigun':   trib += ri(base*0.6); gold += ri(base*0.5);
                           if(Math.random()<0.35) teppo += 2;
                           detail.push(`${fname(f)}(船役)`); break;
          case 'shinobi':  intelN++; gold += ri(base*0.3); detail.push(`${fname(f)}(諜報役)`); break;
          case 'temple':   trib += ri(base*0.7); mind += 2; detail.push(`${fname(f)}(祈禱役)`); break;
          default:         trib += ri(base*1.2); detail.push(`${fname(f)}(軍役米)`); break;
        }
      }
      S.rice += trib; S.money += gold;
      if(teppo){ armySync(); S.army.teppo += teppo; S.soldiers += teppo; }
      if(mind) S.minshin = clamp(S.minshin + mind, 0, 100);
      if(intelN) S.intel = Math.max(S.intel||0, 2);
      S.prestige += mine.length;
      lines.push(`從屬眾之役(${detail.join('、')}):米 ${trib} 石・錢 ${gold} 貫`+
        (teppo?`・鐵砲 ${teppo} 挺`:'')+(mind?`・民心 +${mind}`:'')+(intelN?`・諸國情報(料敵先機)`:'')+
        `,威望 +${mine.length}。`);
      for(const f of mine){
        if(f.marr || f.pact) continue;
        // 名望繫人心:主家有名,從屬眾不輕言去
        if(playerScore() < score(f)*1.1 && Math.random() < Math.max(0.02, 0.10 - meiboHold()*0.12)){
          f.lord = null;
          f.rel = clamp(f.rel-10,-100,100);
          lines.push(`⚡ ${fname(f)}見${S.famName}家勢衰,脫離從屬自立!`);
        }
      }
    }
  }
  // 大名關係歲末結算
  if(S.lords){
    if(S.isDaimyo){
      gainPrestige(2);
      const subs = aiLords().filter(k=>S.lords[k].submitted);
      if(subs.length){
        let tr = 0;
        subs.forEach(k=>{ tr += ri((S.lords[k].demesne||3000)*0.02); });
        S.rice += tr;
        lines.push(`臣服大名(${subs.map(k=>LORD_META[k].name+'家').join('、')})歲貢 ${tr} 石。`);
      }
      lines.push(`大名${S.famName}家(${kaniLabel()})——國力 ${playerPower()}、從屬 ${myVassals().length} 家(威望 +2)。`);
      const remain = aiLords().filter(k=>!S.lords[k].submitted);
      if(remain.length && !(S.flags && S.flags.unified)){
        lines.push(`【天下統一之路】尚有 ${remain.length} 家大名未服:${remain.map(k=>`${LORD_META[k].name}家(國力 ${lordPower(k)})`).join('、')}`);
      }
      checkUnification();
    }
    // 主家滅亡:去就之秋(歷史事件未特別處理者,一律走此通用流程)
    if(S.allegiance && S.lords[S.allegiance] && S.lords[S.allegiance].alive === false){
      const dead = S.allegiance, DM = LORD_META[dead];
      S.allegiance = null;
      lines.push(`⚠ 主家${DM.name}家覆滅——${S.famName}家頓成無主之身。`);
      if(S.hostage && S.hostage.lord === dead){
        const h = S.hostage; S.hostage = null;
        S.children.push({name:h.name, sex:'m', age:h.age, eduBu:h.eduBu, eduNai:h.eduNai, eduChi:h.eduChi});
        lines.push(`　為質的 ${h.name} 於亂中脫身歸家。`);
      }
      const others = aiLords();
      const choices = [{label:'暫且自立,靜觀其變', sub:'威望 +3', fn:()=>{ gainPrestige(3); log(`${S.famName}家重舉獨立之旗,靜待塵埃落定。`); }}];
      for(const k of others.slice(0,2)){
        choices.push({label:`速投${LORD_META[k].name}家`, sub:`好感 20,即刻臣從(免遭池魚之殃)`, fn:()=>{
          S.allegiance = k; S.lords[k].favor = Math.max(S.lords[k].favor, 20);
          log(`${S.famName}家轉投${LORD_META[k].name}家麾下——亂世之中,先求存續。`);
        }});
      }
      queueModal({title:`主家滅亡——${DM.name}家終焉`,
        body:`${DM.capital}陷落,${DM.name}家滅亡。\n舊主既亡,誓紙成廢紙——${S.famName}家該何去何從?\n\n(舊主的舊臣正四散奔逃,晚一步,好位置就沒了)`,
        choices});
    }
    if(S.allegiance){
      const L = S.lords[S.allegiance], M = LORD_META[S.allegiance];
      const tribute = ri(Math.min(S.kokudaka, S.pop*2) * 0.08);
      if(S.rice >= tribute){
        S.rice -= tribute; addFavor(L, (2));
        lines.push(`上繳${M.name}家年貢 ${tribute} 石(好感 +2)。`);
      }else{
        S.rice = 0; addFavor(L, -(10));
        lines.push(`⚠ 繳不出${M.name}家年貢(需 ${tribute} 石)!好感 -10。`);
      }
      S.prestige += 2;
      lines.push(`仰${M.name}家之庇,家格安穩(威望 +2,好感 ${L.favor})。`);
      // 密謀事泄
      if(S.plotting && Math.random() < 0.22){
        lines.push(`🔥 密約敗露!${M.name}家截獲了往${LORD_META[S.plotting.lord].capital}的密使——問罪之師即刻南下!`);
        S.plotting = null; L.favor = -60;
        punitiveWar(S.allegiance);
      }
      // 敵勢來襲——庇護的真正意義:主家可能派援軍解圍
      else if(S.warPair && S.warPair.includes(S.allegiance) && Math.random() < 0.12){
        const foe = S.warPair.find(k=>k!==S.allegiance);
        if(foe && S.lords[foe] && S.lords[foe].alive !== false){
          const relief = Math.random() < reliefChance();
          const raid = ri(lordPower(foe)*1.2);
          lines.push(`⚔ ${LORD_META[foe].name}勢越境侵掠${S.famName}家領內(約 ${raid} 之眾)!`);
          queueModal({title:`⚔ ${LORD_META[foe].name}勢來襲`,
            body:`敵軍越境,直撲${S.famName}家領內。\n我軍 ${S.soldiers} 兵${S.fort?`、城砦 ${S.fort} 級`:''}。\n\n`+
              (relief
                ? `📯 ——${M.name}家的援軍旗幟已現於地平線!\n(主家好感 ${L.favor}${S.ando?'・持有所領安堵狀':''},庇護見效)`
                : `📯 ——遣使求援,但${M.capital}遲遲沒有動靜……\n(好感不足,主家見死不救)`),
            choices:[
              {label:'迎擊', sub: relief ? '有援軍在側,勝算大增' : '孤軍奮戰', fn:()=>{
                armySync();
                const foeN = Math.max(15, ri(raid * (relief ? 0.5 : 1)));
                const fa = {ashigaru:ri(foeN*0.55), yumi:ri(foeN*0.2), kiba:ri(foeN*0.2), teppo:0};
                fa.teppo = Math.max(0, foeN - fa.ashigaru - fa.yumi - fa.kiba);

                  onEnd:(res)=>{
                    S.soldiers = armyTotal(S.army);
                    if(res.win){ gainPrestige(6); addFavor(L, (8)); res.taisho.merit=(res.taisho.merit||0)+12;
                      log(`擊退${LORD_META[foe].name}勢!${relief?'主家援軍之力不可沒。':'孤軍卻敵,聲名大噪。'}(威望 +6、好感 +8)`,'good'); }
                    else { const dmg = ri(S.kokudaka*0.06); S.kokudaka -= dmg;
                      S.minshin = clamp(S.minshin-6,0,100);
                      log(`領內遭敵蹂躪……石高 -${dmg}、民心 -6。`,'bad'); }
                    save(); render();
                  }});
              }},
              {label:'堅壁清野', sub:'避戰:石高 -4%、民心 -3,但保全兵力', fn:()=>{
                const dmg = ri(S.kokudaka*0.04);
                S.kokudaka -= dmg; S.minshin = clamp(S.minshin-3,0,100);
                log(`收糧入城、任敵掠野——石高 -${dmg}、民心 -3,兵力得全。`);
              }}
            ]});
        }

      // 隱田敗露
      else if((S.hiddenFields||0) > 0 && Math.random() < 0.18){
        const hid = S.hiddenFields; S.hiddenFields = 0;
        const fine = ri(hid * 1.5);

        S.rice = Math.max(0, S.rice - fine);

      }
      if(L.favor < -10){
        lines.push(`🔥 ${M.name}家對${S.famName}家的不臣早已按捺不住——問罪之師將至!`);
        punitiveWar(S.allegiance);
      }
    }else if(S.isDaimyo){
      // 大名同士:他家可能來攻(臣服者不犯)
      const rivalsL = aiLords().filter(k=>lordPower(k) > 20 && !S.lords[k].submitted);

        const foe = rivalsL.reduce((a,b)=>S.lords[a].favor<=S.lords[b].favor?a:b);

        const p = hostile ? 0.35 : (lordPower(foe) > playerPower()*1.8 ? 0.18 : 0.07);

          lines.push(`⚔ ${LORD_META[foe].name}家對${S.famName}家領國虎視眈眈——大軍已然動員!`);

        }
      }

            }},

              addFavor(Ls, -(12));
              log(`婉拒${Ms.name}家的勧告——自由誠可貴,但${Ms.name}家的耐心有限(好感 ${Ls.favor})。`);
            }}
          ]
        });
      }
    }
    // 人質
    if(S.hostage){
      S.hostage.age += 1;
      { // 質子在大名家中亦有傅役——教得如何,端看該家重臣的斤兩
        const h = S.hostage, ros = lordRoster(h.lord);
        // 傅役取「全體平均與最出色者之間」——雪齋親授竹千代,不是隨便派個人
        const tut = k => { if(!ros.length) return 45;
          const av = ros.reduce((a,v)=>a+v[k],0)/ros.length, mx = Math.max(...ros.map(v=>v[k]));
          return (av + mx)/2; };
        h.eduBu  = (h.eduBu ||0) + tut('bu')*0.055;
        h.eduNai = (h.eduNai||0) + tut('nai')*0.055;
        h.eduChi = (h.eduChi||0) + tut('chi')*0.055;
        h.taught = (h.taught||0) + 1;
      }
      if(S.hostage.age >= 15){
        const h = S.hostage; S.hostage = null;
        const adult = {
          name: adultName(), role:'部屋住', kind:'一門', age:h.age,

        };
        rosterAdd(adult);
        if(S.lords[h.lord]) addFavor(S.lords[h.lord], (5));
        linFate(h.name, `人質歸還・元服「${adult.name}」`);
        const tutor = lordRoster(h.lord).slice().sort((a,b)=>b.chi-a.chi)[0];
        lines.push(`🎉 人質期滿!${h.name} 自${LORD_META[h.lord].capital}歸家,元服改名「${adult.name}」列席一門(武${adult.bu} 政${adult.nai} 智${adult.chi})。`+
          (h.taught && tutor ? `　質中 ${h.taught} 年,受${LORD_META[h.lord].name}家 ${tutor.n} 之教——他鄉的歲月並未虛擲。` : ''));
      }
    }
  }
  // 一揆
  if(S.clanType === 'temple'){
    if(S.minshin < 25) lines.push(`⚠ 香火冷落,門徒漸散——寺社雖無一揆之虞,但民心即財源兵源,不可不慎。`);

    lines.push(`⚠ 民怨沸騰,一揆一觸即發!(民心低於 15 將爆發)`);
  }
  queueModal({
    title:`${eraName(S.year)}(${S.year})歲末`,
    body: lines.join('\n'),
    choices:[{label:'新的一年', fn:()=>{}}]
  });

      choices:[{label:'重新開始', fn:()=>{ localStorage.removeItem(SLOT_KEY(curSlot)); location.reload(); }}]
    });
  }

}

function maybeEvent(){
  // 事件節奏:基礎 34%,連續無事件則保底逼近必中(消除中期空窗)
  S.dry = S.dry || 0;
  const p = 0.34 + Math.min(0.5, S.dry * 0.12);
  if(Math.random() > p){ S.dry++; return; }
  // 加權抽籤;抽中者條件不符(make 回傳 null)則剔除後改抽,避免整季落空
  let pool = EVENTS.filter(e => e.id !== S.lastEvent && (!e.clan || e.clan === S.clanType));
  while(pool.length){
    const totW = pool.reduce((a,e)=>a+e.w,0);
    let roll = Math.random()*totW, chosen = pool[pool.length-1];
    for(const e of pool){ roll -= e.w; if(roll <= 0){ chosen = e; break; } }
    let m = null;
    try{ m = chosen.make(); }catch(err){ m = null; }
    if(m){ S.lastEvent = chosen.id; S.dry = 0; queueModal(m); return; }
    pool = pool.filter(e => e !== chosen);
  }
  S.dry++;   // 全數不適用(罕見):累積保底
}

function endSeason(){
  if(S.gameOver) return;
  logYear();
  histCheck();   // 歷史事件(固定軌道)
  resolveTasks();
  // 類型被動收入
  if(S.clanType === 'temple'){
    const fuse = ri(S.minshin * 0.15);
    if(fuse > 0){ S.money += fuse; log(`門徒布施 ${fuse} 貫(民心 ${S.minshin})。`); }
  } else if(S.clanType === 'suigun'){
    const toll = 5 + S.tradeLv*2;
    S.money += toll;
    log(`湊之關錢入帳 ${toll} 貫。`);
  }
  if((S.rakuichi||0) > 0){
    S.money += S.rakuichi*3;
    log(`樂市市租入帳 ${S.rakuichi*3} 貫。`);
  }
  if(S.warBoom > 0) S.warBoom -= 1;
  // 陣觸れ到期:出陣
  if(S.jinbure){
    const jb = S.jinbure; S.jinbure = null;
    if(S.allegiance === jb.lord && S.lords[jb.lord] && S.lords[jb.lord].alive !== false){
      startCampaign(jb.lord, jb.enemy, jb.warName, undefined, jb.target);
    }
  }
  if(S.siege) processSiege();
  if(S.season === 2) autumnHarvest();
  if(S.rivals) simRivalSeason();   // 眾也一季一務
  maybeEvent();
  maybeWar();
  if(S.rivals) rumorNotice();     // 鄰家兵事的風聲(歲末放出,開春見真章)
  if(S.season === 3) winterSettle();
  // 進到下一季
  S.season += 1;
  if(S.season > 3){ S.season = 0; S.year += 1; }
  save();
  render();
  pumpModal();
}

// ---------- 事件視窗 ----------
function queueModal(m){ modalQueue.push(m); }
function pumpModal(){
  if(!$('modalBack').classList.contains('hidden')) return;
  const m = modalQueue.shift();
  if(!m) return;
  $('modalTitle').textContent = m.title;
  const fb = $('modalFace');
  fb.innerHTML = '';
  if(m.face){ fb.appendChild(faceCanvas(m.face, 84)); }
  $('modalHud').innerHTML = m.hud || '';
  // 視窗分級:戰事朱頂、史實金頂
  $('modalCard').dataset.kind = m.title.includes('【史】') ? 'hist'
    : /⚔|合戰|の陣|籠城|攻|【勝】|【敗】|侵攻|討伐|謀反/.test(m.title) ? 'war' : '';
  $('modalBody').textContent = m.body;
  { const sc = $('modalScroll'); if(sc) sc.scrollTop = 0; }
  const box = $('modalChoices');
  box.innerHTML = '';
  for(const c of m.choices){
    const b = document.createElement('button');
    b.innerHTML = c.label + (c.sub ? `<small>${c.sub}</small>` : '');
    b.onclick = () => {
      $('modalBack').classList.add('hidden');
      c.fn();
      save();
      render();
      pumpModal();
    };
    box.appendChild(b);
  }
  $('modalBack').classList.remove('hidden');
}

// ---------- 家臣詳情(功勳/知行/忠誠) ----------
function openRetainer(i){
  const r = S.retainers[i];
  if(!r) return;
  const isLord = i === 0;
  ensureApt(r);
  const sta = r.stamina ?? 100;
  armySync();
  let body = `${r.kind}・${r.role}・${r.age}歲${(r.sick||0)>0?`\n🤒 臥病中(尚需 ${r.sick} 季靜養)`:''}\n武勇 ${r.bu}　內政 ${r.nai}　智謀 ${r.chi}\n功勳 ${r.merit||0}　體力 ${sta}${sta<25?'(過勞!)':sta<50?'(疲勞)':''}`+
    `\n兵種適性:${APT_NAME[r.apt]}專精${r.apt2?`・兼${APT_NAME[r.apt2]}`:''}${r.wapt?`・不擅${APT_NAME[r.wapt]}`:''}` +
    `\n　└ 若由其領現有軍勢(${armyLabel()}),戰力 ×${aptMul(r, S.army).toFixed(2)}` +
    `\n陣立ち経験(◎專精 ○副 △不擅)\n　${expLabel(r)}` +
    (r.age < 15 && r.kind==='一門'
      ? `
📖 尚在髫齡(${r.age}歲)——可由「教育子弟」傅育;已積 武${ri(r.eduBu||0)}・政${ri(r.eduNai||0)}・智${ri(r.eduChi||0)}`+
        `
　└ 十五歲親政/元服時各以四成半計入(現約 +${ri((r.eduBu||0)*0.45)}/+${ri((r.eduNai||0)*0.45)}/+${ri((r.eduChi||0)*0.45)})` : '') +
    (S.taishoId === r.name ? '\n◆ 現任出陣大將' : '') +
    (r.trait ? `\n特性:${TRAITS[r.trait].name}——${TRAITS[r.trait].desc}` : '');
  if(!isLord){
    body += `\n知行(年俸)${r.salary||0} 石/年\n忠誠 ${r.loyalty||70}`;
    if((r.merit||0) > (r.salary||0)*4) body += `\n\n⚠ 功高祿薄——功勳遠超俸祿,心懷不滿(每年忠誠下降,過低恐出奔)。`;
    const rk = r.rank||0;
    if(rk < 4) body += `\n昇任「${RANKS[rk+1]}」需功勳 ${PROMO[rk]}(現 ${r.merit||0})。`;
  }
  const choices = [];
  if(!S.gameOver && (r.sick||0)===0 && S.taishoId !== r.name){
    choices.push({label:'◆ 任命為出陣大將', sub:`此後由 ${r.name}(${APT_NAME[r.apt]}專精)領兵出陣`, fn:()=>{
      S.taishoId = r.name;
      log(`任 ${r.name} 為出陣大將——${APT_NAME[r.apt]}之長,當使我軍如虎添翼。`,'good');
    }});
  }
  if(S.taishoId === r.name && !S.gameOver){
    choices.push({label:'解除大將之任', sub:'改由武勇最高者自動領兵', fn:()=>{ S.taishoId = null; log(`${r.name} 卸下大將之任。`); }});
  }
  // 席次調度:讓玩家自己決定這 12 個位子給誰(名將登門時才有空席可讓)
  if(!isLord && !S.gameOver){
    if(r.spare){
      choices.push({label:'召其列席任事', sub: activeR().length >= ROSTER_MAX
          ? `⚠ 席次已滿(${ROSTER_MAX} 人),須先將他人列為部屋住` : '自部屋住起用,支知行、可派遣',
        fn:()=>{
          if(activeR().length >= ROSTER_MAX){ log(`家中席次已滿(${ROSTER_MAX} 人)——須先令他人退為部屋住。`,'bad'); return; }
          r.spare = false; r.task = 'rest';
          log(`${r.name} 自部屋住列席家中,受命任事。`,'good');
        }});
    }else{
      choices.push({label:'令其退為部屋住', sub:'不佔席次、不支知行、不任事;仍為一門可繼家督', fn:()=>{
        if(S.taishoId === r.name) S.taishoId = null;
        r.spare = true; r.task = 'rest';
        log(`${r.name} 退居部屋住——家中騰出一席。`);
      }});
    }
  }
  if(!isLord && !S.gameOver){
    choices.push({label:'加增知行 +10 石/年', sub:'忠誠 +8;年俸永久增加,歲末以米支付', fn:()=>{
      r.salary = (r.salary||0) + 10;
      r.loyalty = clamp((r.loyalty||70) + 8, 0, 100);
      log(`${r.name} 蒙加增知行十石,感激涕零(忠誠 +8)。`,'good');
    }});
    choices.push({label:'賞賜 10 貫', sub:'忠誠 +5', fn:()=>{
      if(S.money < 10){ log('資金不足,無以為賞。','bad'); return; }
      S.money -= 10;
      r.loyalty = clamp((r.loyalty||70) + 5, 0, 100);
      log(`賞賜 ${r.name} 十貫(忠誠 +5)。`);
    }});
    const rk = r.rank||0;
    if(rk < 4 && (r.merit||0) >= PROMO[rk]){
      choices.push({label:`授職「${RANKS[rk+1]}」`, sub:'錢 -20;忠誠 +10、威望 +1、年俸 +8 石', fn:()=>{
        if(S.money < 20){ log('資金不足,授職儀式辦不起來。','bad'); return; }
        S.money -= 20;
        r.rank = rk + 1;
        if(r.role !== '當主') r.role = RANKS[r.rank];
        r.salary = (r.salary||0) + 8;
        r.loyalty = clamp((r.loyalty||70) + 10, 0, 100);
        S.prestige += 1;
        log(`${r.name} 昇任「${r.role}」!家中士氣大振(忠誠 +10、威望 +1)。`,'good');
      }});
    }
  }
  choices.push({label:'關閉', fn:()=>{}});
  queueModal({title:`${r.name}`, body, choices, face:r});
  pumpModal();
}

// ---------- 招攬流民(主動增加人口) ----------
function boshuCost(){
  const n = S.boshu || 0;                       // 本年已招募次數 → 成本遞增
  const f = 1 + n * 0.6;
  return {   // 領地越大,招徠安置的開銷越重
    money: ri((40 + S.pop*0.05) * f * (S.clanType==='merchant' ? 0.75 : 1)),
    rice:  ri((60 + S.pop*0.08) * f)
  };
}
function boshuGain(){
  const base = 25 + S.minshin*0.25 + Math.min(S.prestige, 60)*0.2;
  return base * (S.clanType==='temple' ? 1.3 : 1) * (1 + (S.kani||0)*0.1);   // 名分招徠
}
function doBoshu(){
  const c = boshuCost();
  const room = popCap() - S.pop;
  if(room <= 0){ log('領內已無餘裕安置新丁(人口已達上限)——先拓石高吧。','bad'); return; }
  if(S.money < c.money || S.rice < c.rice){ log('錢糧不足,招募未能施行。','bad'); return; }
  S.money -= c.money; S.rice -= c.rice;
  S.boshu = (S.boshu || 0) + 1;
  let gain = ri(boshuGain() * (0.85 + Math.random()*0.3));
  if(S.minshin < 30){
    gain = ri(gain * 0.5);
    log('領內風評不佳,應募者寥寥……(民心過低)','bad');
  }
  const actual = Math.min(gain, room);
  S.pop += actual;
  log(`張榜招民,墾荒授田——流民 ${actual} 人來投(人口 ${S.pop}/${popCap()})。`+
      (actual < gain ? '(土地容納已滿,餘者他去)' : ''), 'good');
  save(); render();
}

      : f.lord ? `臣從${LORD_META[f.lord].name}家(動其一髮,牽其主家)` : '未依附任何大名'}`+
    `
與${S.famName}家關係:${relLabel(f)}(${f.rel})
家格對比:你是對方的 ${ratio} 倍`+
    (nb ? '' : strike ? `

⚔ 兵鋒可及——取道從屬 ${strikeVia(f).join('、')} 之境,兵馬糧道可通。` : `

⚠ 非我鄰境——中間隔著他家領地,兵馬不通,無從用兵。`+
      `
　欲取其地,須先取道 ${myNeighbors().filter(x=>rdist(x,f)<=NEIGHBOR_R).map(x=>fname(x)).join('、')||'沿途諸家'}(納為從屬亦可假道)。`+
      `
　(贈禮、取引、縁談、勧誘等文事不受此限)`);
  const choices = [];
  if(!S.gameOver){
    choices.push({label:'贈禮修好(10貫)', sub:'關係 +10', fn:()=>{
      if(S.money < 10){ log('資金不足。','bad'); return; }
      S.money -= 10;
      f.rel = clamp(f.rel+10,-100,100); addOn(f, 8);
      log(`遣使向${fname(f)}贈禮,兩家關係改善。`);
    }});
    if(f.intel && (f.intel.n||0) >= 2) choices.push({label:'放流言惑其物見(25貫)', sub:'散布「我家新購鐵砲百挺」——使其誤判我軍虛實,備錯了戰', fn:()=>{
      if(S.money < 25){ log('資金不足。','bad'); return; }
      S.money -= 25;
      f.intel = {n:3, teppoP:0.55, kibaP:0.05, fake:true};
      log(`流言放出:「${S.famName}家新購鐵砲百挺」——${fname(f)}信以為真,自此操練竹束、專候雨天,而我軍實情早非其所知。`,'good');
    }});
    // 類型專屬互動(每年每家一次)
    const bizOK = f._biz !== S.year;
    if(S.clanType==='kokujin' && !f.marr && !f.pact){
      choices.push({label:'攻守同盟', sub:`需關係 ≥40(現 ${f.rel}):結為盟友,互不相犯,歲末威望 +1`, fn:()=>{
        if(f.rel < 40){ log(`${fname(f)}未允——交情尚淺(關係需 40,現 ${f.rel})。`,'bad'); return; }
        f.pact = true; f.rel = clamp(f.rel+15,-100,100);
        log(`與${fname(f)}歃血為盟,結為攻守同盟!(關係 +15,歲末威望 +1)`,'good');
      }});
    }
    if(S.clanType==='merchant'){
      choices.push({label:'商談(本錢 20 貫)', sub:`互通有無賺取價差(依當主智謀)${f.clanKind==='merchant'?';同為商人,獲利加倍':''};每年一次`, fn:()=>{
        if(!bizOK){ log(`今年已與${fname(f)}做過買賣。`); return; }
        if(S.money < 20){ log('本錢不足。','bad'); return; }
        S.money -= 20; f._biz = S.year;
        const gain = 20 + ri(Math.random()*15 + S.retainers[0].chi*0.15) + (f.clanKind==='merchant'?15:0);
        S.money += gain; f.rel = clamp(f.rel+8,-100,100);
        log(`與${fname(f)}商談互市,獲利 ${gain} 貫(關係 +8)。`,'good');
      }});
    }
    if(S.clanType==='shinobi' && !f.marr && !f.pact){
      choices.push({label:'潛入此家(15 貫)', sub:'指定目標的諜報:竊財或毀田;敗露結怨;每年一次', fn:()=>{
        if(!bizOK){ log(`${fname(f)}近來戒備森嚴,今年不宜再動。`); return; }
        if(S.money < 15){ log('僱不起下忍。','bad'); return; }
        S.money -= 15; f._biz = S.year;
        const agent = S.retainers.reduce((a,b)=>a.chi>=b.chi?a:b);
        if(Math.random() < clamp(0.25 + agent.chi*0.006, 0, 0.85)){
          if(Math.random() < 0.5){
            const steal = 10 + ri(Math.random()*15 + agent.chi*0.2);
            S.money += steal;
            log(`潛入${fname(f)}帳房,竊得 ${steal} 貫。`,'good');
          }else{
            const dmg = Math.max(5, ri(f.koku*0.03));
            f.koku -= dmg;
            log(`夜毀${fname(f)}水路穀倉,其石高 -${dmg}。`,'good');
          }
        }else if(Math.random() < 0.3){
          f.rel = clamp(f.rel-15,-100,100);
          log(`行蹤敗露!${fname(f)}震怒(關係 -15)。`,'bad');
        }else log(`潛探${fname(f)},無功而返。`);
      }});
    }
    if(S.clanType==='temple'){
      choices.push({label:'布教', sub:'派僧眾傳法:收其領內布施、關係 +8、民心 +1;每年一次', fn:()=>{
        if(!bizOK){ log(`今年已在${fname(f)}領內傳過法。`); return; }
        f._biz = S.year;
        const fuse = Math.max(5, ri(f.koku*0.015));
        S.money += fuse; f.rel = clamp(f.rel+8,-100,100); S.minshin = clamp(S.minshin+1,0,100);
        log(`僧眾赴${fname(f)}領內傳法,信眾布施 ${fuse} 貫(關係 +8,民心 +1)。`,'good');
      }});
    }
    if(S.clanType==='suigun'){
      choices.push({label:'海運契約(10 貫)', sub:`替其承運貨物獲利${f.clanKind==='merchant'?'(商人眾貨多,加倍)':''};每年一次`, fn:()=>{
        if(!bizOK){ log(`今年已為${fname(f)}跑過船。`); return; }
        if(S.money < 10){ log('整備費不足。','bad'); return; }
        S.money -= 10; f._biz = S.year;
        const gain = 15 + ri(Math.random()*15) + (S.ships||0)*5 + (f.clanKind==='merchant'?15:0);
        S.money += gain; f.rel = clamp(f.rel+8,-100,100);
        log(`為${fname(f)}承運貨物,獲利 ${gain} 貫(關係 +8)。`,'good');
      }});
    }
    // 勧誘:招為自家從屬眾(所領安堵の誓紙)
    if(f.lord !== 'player' && f.persona !== '門徒'){
      const ratio = playerScore() / score(f);
      const p = clamp(0.20 + (f.rel-30)/160 + (ratio-1.5)*0.22 + (f.marr?0.2:0) + (f.pact?0.12:0)
        + (S.kani||0)*0.08 + (S.isDaimyo?0.15:0) + meiboHold() + playerAppeal(f) - (f.lord?0.25:0), 0.05, 0.9);   // 名分・名望・性向與大名之威
      const ok = ratio >= 1.5 && f.rel >= 30;
      choices.push({label:'勧誘(50貫・所領安堵の誓紙)',
        sub: ok ? `招其為${S.famName}家從屬(成算約 ${(p*100).toFixed(0)}%;${(DIPLO[f.persona]||{}).tag||'持平'}之家 ${playerAppeal(f)>=0?'+':''}${ri(playerAppeal(f)*100)}%)${f.lord?`;必觸怒${LORD_META[f.lord].name}家`:''}`
                : `需家格 ≥1.5倍(現 ${ratio.toFixed(2)})且關係 ≥30(現 ${f.rel})`,
        fn:()=>{
          if(!ok){ log('條件未足,勧誘之議難以啟齒。','bad'); return; }
          if(S.money < 50){ log('資金不足,備不起誓紙禮金。','bad'); return; }
          S.money -= 50;
          if(Math.random() < p){
            const old = f.lord;
            f.lord = 'player'; f.rel = clamp(f.rel+10,-100,100);
            S.prestige += 3;
            log(`🤝 ${fname(f)}獻上誓紙,臣從於${S.famName}家!(威望 +3)`,'good');
            if(old && S.lords[old]){
              addFavor(S.lords[old], -(25));
              log(`⚠ 奪${LORD_META[old].name}家之臣——${LORD_META[old].name}家震怒(好感 -25)!`,'bad');
            }
          }else{
            f.rel = clamp(f.rel-5,-100,100);
            log(`${fname(f)}婉拒了誓紙:「本家世居此地,尚能自守。」`,'bad');
          }
        }});
    }
    // 從屬眾管理
    if(f.lord === 'player'){
      choices.push({label:'所領安堵(20貫)', sub:'重申保障其所領:關係 +12', fn:()=>{
        if(S.money < 20){ log('資金不足。','bad'); return; }
        S.money -= 20; f.rel = clamp(f.rel+12,-100,100);
        log(`重申${fname(f)}所領安堵,其心大安。`,'good');
      }});
      choices.push({label:'課役(徵調錢糧)', sub:`米 +${ri(f.koku*0.05)}、錢 +${ri(f.koku*0.02)};關係 -12${hasKakun('minpon')?';⚠ 違背家訓':''}`, fn:()=>{
        S.rice += ri(f.koku*0.05); S.money += ri(f.koku*0.02);
        f.rel = clamp(f.rel-12,-100,100);
        log(`向${fname(f)}課以額外軍役錢糧——怨言難免(關係 -12)。`);
        if(hasKakun('minpon')) violateKakun('橫徵暴斂於從屬');
      }});
      choices.push({label:'放歸自立', sub:'解除從屬關係,關係 +5', fn:()=>{
        f.lord = null; f.rel = clamp(f.rel+5,-100,100);
        log(`${fname(f)}獲准脫離從屬,感念寬仁。`);
      }});
    }
    choices.push({label:`🤝 取引(${KIND_LABEL[f.clanKind]||'國人'}眾之長)`, sub:'借銀・鐵砲調達・情報・祈願・兵糧与力——依其家業而定', fn:()=>{ openTrade(f); }});
    if(f.lord !== 'player' && !f.marr && !f.pact && S.soldiers >= 15 && !S.siege && strike){
      choices.push({label:'⚔ 出兵討伐', sub:`野戰/力攻/圍城/調略四擇一;勝則奪地,殘存不足 200 石即併吞其家`, fn:()=>{ conquestWar(f); }});
    }
    if(f.lord !== 'player' && !f.marr && !f.pact && playerScore() >= score(f)*1.4 && strike){
      choices.push({label:'壓迫割地', sub:`恃強凌弱,迫其割讓田地——對方可能屈服,也可能翻臉私鬥;國人眾將對你警戒${f.lord?`;其主家${LORD_META[f.lord].name}家必然震怒`:''}`, fn:()=>{
        const p = clamp(0.3 + (playerScore()/score(f) - 1.4)*0.5 + (S.soldiers - rSol(f))*0.002, 0.15, 0.85);
        addAggression(14);
        S.rivals.filter(x=>x.alive && x!==f).forEach(x=>{ x.rel = clamp(x.rel-6,-100,100); });
        if(Math.random() < p){
          const take = Math.max(20, ri(f.koku*0.08));
          f.koku -= take; S.kokudaka += take;
          f.rel = clamp(f.rel-35,-100,100);
          S.prestige += 2;
          if(f.lord && f.lord !== 'player' && S.lords && S.lords[f.lord]){
            const hit = S.allegiance === f.lord ? 25 : 15;
            addFavor(S.lords[f.lord], -(hit));
            log(`⚠ ${LORD_META[f.lord].name}家對此番恃強凌弱大為不滿(好感 -${hit})。`,'bad');
          }
          log(`${fname(f)}懾於${S.famName}家聲勢,忍痛割讓 ${take} 石(石高 ${S.kokudaka})。威望 +2,國人眾對你側目。`,'good');
        }else{
          log(`${fname(f)}嚴詞拒絕:「欺人太甚!」兵刃相見!`,'bad');
          privateFight(f);
        }
      }});
    }
  }
  choices.push({label:'關閉', fn:()=>{}});
  queueModal({title:`${fname(f)}(三河國人)`, body, choices});
  pumpModal();
}

// ---------- 一門面板 ----------
const eligibleDaughter = () => S.children.find(c=>c.sex==='f' && c.age>=15);
function renderFamily(){
  const payroll = S.retainers.slice(1).reduce((a,r)=>a+(r.salary||0), 0);
  const fem = lordIsFemale();
  let h = `<div class="cardTitle">一門 <span class="dim" style="font-weight:normal;font-size:12px">(家紋:${KAMON[S.kamon||0].name}・年俸總計 ${payroll} 石/年)</span></div>`;
  if(S.kakun) h += `<div class="famRow">家訓:<b style="color:var(--accent2)">${KAKUN[S.kakun].name}</b> <span class="dim">${KAKUN[S.kakun].motto}——${KAKUN[S.kakun].buff}</span></div>`;
  { const badges = [];
    if(S.kanjo) badges.push(`感狀 ${S.kanjo} 通`);
    if(S.ando) badges.push('所領安堵狀');
    if(S.henki) badges.push(`偏諱(${LORD_META[S.henki]?LORD_META[S.henki].name:''}家)`);
    if(S.castleLord && CASTLES[S.castleLord]) badges.push(`城主:${CASTLES[S.castleLord].name}`);
    if(S.yoriBoss){ const b = (S.rivals||[]).find(f=>f.id===S.yoriBoss && f.alive); if(b) badges.push(`寄親:${fname(b)}`); }
    if(S.hiddenFields) badges.push(`<span class="loyLow">隱田 ${S.hiddenFields} 石</span>`);
    if(badges.length) h += `<div class="famRow dim">${badges.join('　|　')}</div>`;
  }
  if(S.plotting) h += `<div class="famRow"><b class="loyLow">🗡 密約:${LORD_META[S.plotting.lord].name}家(${S.year - S.plotting.since} 年)</b> <span class="dim">事泄則滅門</span></div>`;
  h += `<div class="famRow">${fem?'婿養子':'正室'}:${S.wife ? `<span data-face="${S.wife.name}" data-sex="${S.wife.muko?'m':'f'}" data-age="${S.wife.age}"></span>${S.wife.name}(${S.wife.age}歲)` : '<span class="dim">無</span>'} `;
  if(!S.wife && !S.gameOver){
    h += fem
      ? `<button id="btnMarry" class="ghost mini" ${S.money<30?'disabled':''}>招婿養子(30貫)</button>`
      : `<button id="btnMarry" class="ghost mini" ${S.money<20?'disabled':''}>迎娶正室(20貫)</button>`;
  }
  h += `</div>`;
  if(!fem){
    h += `<div class="famRow">側室:${(S.consorts||[]).length ? S.consorts.map(cs=>`${cs.name}(${cs.age}歲)`).join('、') : '<span class="dim">無</span>'} `;
    if(!S.gameOver && (S.consorts||[]).length < 3){
      h += `<button id="btnSoku" class="ghost mini" ${(S.money<40||S.prestige<25)?'disabled':''} title="需威望 25、錢 40 貫(至多三人)">納側室(40貫)</button>`;
    }
    h += `</div>`;
  }
  if(S.children.length){
    S.children.forEach((c,i)=>{
      const edu = (c.age>=5 && c.age<15) ? ` <span class="dim">教養 ${ri(c.eduBu+c.eduNai+c.eduChi)}</span>` : '';
      const serveBtn = (c.sex==='f' && c.age>=15 && !S.gameOver)
        ? ` <b>(適齡)</b> <button class="ghost mini" data-serve="${i}">出仕</button>` : '';
      h += `<div class="famRow"><span data-face="${c.name}" data-sex="${c.sex}" data-age="${c.age}"></span>${c.name}(${c.sex==='m'?'男':'女'}・${c.age}歲)${serveBtn}${edu}</div>`;
    });
  } else {
    h += `<div class="famRow dim">尚無子嗣</div>`;
  }
  if(S.hostage){
    const H = S.hostage;
    h += `<div class="famRow">・${H.name}(男・${H.age}歲)<span class="loyLow">【人質・在${LORD_META[H.lord].capital}】</span>`+
      (H.taught ? `<br><span class="dim" style="font-size:11px">　質中已 ${H.taught} 年,受${LORD_META[H.lord].name}家傅育:武${ri(H.eduBu||0)}・政${ri(H.eduNai||0)}・智${ri(H.eduChi||0)}</span>` : '')+
      `</div>`;
  }
  if(S.allies.length) h += `<div class="famRow">姻親:${S.allies.map(a=>a+'家').join('、')}</div>`;
  h += `<div class="famRow" style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">`+
       `<button id="btnKeizu" class="ghost mini">📜 系譜</button>`+
       `<button id="btnEnndan" class="ghost mini" ${(eligibleDaughter() && S.enkyoCd===0)?'':'disabled'}>安排縁談</button>`+
       `<button id="btnRonin" class="ghost mini" ${(activeR().length<ROSTER_MAX && S.money>=30)?'':'disabled'}>招募浪人(30貫)</button>`+
       `<button id="btnInkyo" class="ghost mini" ${(S.retainers[0] && S.retainers[0].age>=50 && S.retainers.some(r=>r!==S.retainers[0]&&r.kind==='一門'&&r.sex!=='f'&&(r.sick||0)===0&&r.age>=15) && !S.gameOver)?'':'disabled'} title="當主≥50歲且有元服男子一門時,可主動交棒——先代列大御所輔佐">隱居讓位</button>`+
       `</div>`;
  $('familyBox').innerHTML = h;
  // 一門面孔(妻・子女・人質)
  document.querySelectorAll('#familyBox [data-face]').forEach(el=>{
    const d = el.dataset;
    el.appendChild(faceCanvas({name:d.face, sex:d.sex, age:parseInt(d.age,10)}, 26));
  });
  const bm = $('btnMarry');
  if(bm) bm.onclick = lordIsFemale() ? doMuko : doMarry;
  const bsk = $('btnSoku');
  if(bsk) bsk.onclick = ()=>{
    if(S.money < 40 || S.prestige < 25 || (S.consorts||[]).length >= 3) return;
    S.money -= 40;
    if(!S.consorts) S.consorts = [];
    const cs = {name: genGirlName(), age: 17 + Math.floor(Math.random()*8)};
    S.consorts.push(cs);
    linWife(cs.name + '(側)');
    log(`納 ${cs.name}(${cs.age}歲)為側室——家門開枝散葉,又多一分指望。`,'good');
    save(); render();
  };
  document.querySelectorAll('[data-serve]').forEach(el=>{
    el.onclick = () => doServe(parseInt(el.dataset.serve, 10));
  });
  $('btnKeizu').onclick = openGenealogy;
  { const bi = $('btnInkyo'); if(bi) bi.onclick = inkyo; }
  $('btnEnndan').onclick = doEnndan;
  $('btnRonin').onclick = doRonin;
}
function doMarry(){
  if(S.money < 20 || S.wife) return;
  S.money -= 20;
  S.wife = {name: genGirlName(), age: 18 + Math.floor(Math.random()*7)};
  linWife(S.wife.name);
  log(`迎娶 ${S.wife.name}(${S.wife.age}歲)為正室,家中喜氣洋洋。`,'good');
  save(); render();
}
// 女當主招婿養子:入贅之夫兼一門眾,可任事、可繼家督、可續香火
function doMuko(){
  if(S.money < 30 || S.wife || !lordIsFemale()) return;
  const cand = {
    name: S.famName + genAdultGiven(), role:'婿養子', kind:'一門',
    age: Math.max(18, S.retainers[0].age + ri(Math.random()*8-4)), muko:true,
    bu: 25+Math.floor(Math.random()*40), nai: 25+Math.floor(Math.random()*40), chi: 25+Math.floor(Math.random()*40),
    task:'rest', merit:0, salary:10, loyalty:85, rank:0, stamina:100, trait:genTrait()
  };
  queueModal({
    title:'招婿養子',
    body:`媒人引來入贅之選:\n${cand.name}(${cand.age}歲)\n武勇 ${cand.bu}・內政 ${cand.nai}・智謀 ${cand.chi}`+
      (cand.trait?`\n特性:${TRAITS[cand.trait].name}——${TRAITS[cand.trait].desc}`:'')+
      `\n\n入贅後冠本家之姓,列一門眾任事,並可繼承家督、延續香火。`,
    choices:[
      {label:'成婚(30貫)', fn:()=>{
        if(S.money < 30){ log('資金不足,婚事作罷。','bad'); return; }
        S.money -= 30;
        rosterAdd(cand);
        S.wife = {name:cand.name, age:cand.age, muko:true};
        linWife(cand.name + '(婿)');
        log(`${cand.name} 入贅${S.famName}家為婿養子——家名有後了。`,'good');
      }},
      {label:'再議', fn:()=>{ log('婚事暫且擱下。'); }}
    ]
  });
  pumpModal();
}
// 女子出仕
function doServe(idx){
  const c = S.children[idx];
  if(!c || c.sex!=='f' || c.age < 15) return;
  const est = {
    bu:  ri(20 + (c.eduBu||0) *0.40),
    nai: ri(35 + (c.eduNai||0)*0.65),
    chi: ri(32 + (c.eduChi||0)*0.60)
  };
  queueModal({
    title:`${c.name}の出仕`,
