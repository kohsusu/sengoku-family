// ---------- 地圖 ----------
// ══════════ 地圖:勢力範圍 ══════════
// 武田不可與玩家朱紅同色系(曾用#b04a3a,信濃的武田方色塊看起來像自家從屬)
const LORDC = {imagawa:'#6a3f88', oda:'#a8842a', tokugawa:'#4a6a9a', takeda:'#7e2a49',
               toyotomi:'#3a7a6a', saito:'#8aa878', nagao:'#31485e', player:'#a63c2e'};
// 七國當代的實際領有者(此前色塊是寫死的地理色,只有標籤會隨史實變)
function provOwners(){
  const done = id => S.histDone && S.histDone.includes(id);
  if(S.flags && S.flags.ifLine) return {
    mino: done('if_kyoto') ? 'imagawa' : 'saito',
    owari: done('if_owari') ? 'imagawa' : 'oda',
    mikawa:'imagawa', totomi:'imagawa', suruga:'imagawa', kai:'takeda', shinano:'none'};
  const oda = done('honnoji') ? 'toyotomi' : 'oda';
  return {
    mino:   done('saito_fall') ? oda : 'saito',
    owari:  oda,
    mikawa: done('okehazama') ? 'tokugawa' : 'imagawa',
    totomi: done('imagawa_fall') ? 'tokugawa' : 'imagawa',
    suruga: done('honnoji') ? 'tokugawa' : done('imagawa_fall') ? 'takeda' : 'imagawa',
    kai:    done('honnoji') ? 'tokugawa' : 'takeda',
    shinano: done('kawanaka_end') ? 'takeda' : 'none'};
}
// 加權 Voronoi:每格歸於「√石高 ÷ (距離+45)」最大者——石高越大,influence 所及越廣。
// 繪法:先算勝者網格 → 縮圖平滑放大(淡彩暈染) → 再描墨線界線(眾細、陣營粗)。
// 省級領有:劇本只知史實,不知你親手改寫的部分——滅亡與臣服疊加其上
function provStatus(){
  const base = provOwners();
  const famN = S.famName + '家';
  // 劇本語境下的顯示文字(松平諸家/今川治下等風味保留)
  const done = id => S.histDone && S.histDone.includes(id);
  const legacy = {};
  if(S.flags && S.flags.ifLine){
    legacy.mino = done('if_kyoto') ? '今川家' : '齋藤家';
    legacy.owari = done('if_owari') ? '今川家' : '織田家';
    legacy.mikawa = '今川治下'; legacy.totomi = '今川家'; legacy.suruga = '今川家';
    legacy.kai = '武田家'; legacy.shinano = '諸豪族';
  }else{
    const tokuName = LORD_META.tokugawa.name;
    const odaName = done('honnoji') ? LORD_META.toyotomi.name : '織田';
    legacy.mino = done('saito_fall') ? odaName+'家' : '齋藤家';
    legacy.owari = odaName+'家';
    legacy.mikawa = done('okehazama') ? tokuName+'家' : '松平諸家';
    legacy.totomi = done('imagawa_fall') ? tokuName+'家' : '今川家';
    legacy.suruga = done('honnoji') ? tokuName+'家' : done('imagawa_fall') ? '武田家' : '今川家';
    legacy.kai = done('honnoji') ? tokuName+'家' : '武田家';
    legacy.shinano = done('kawanaka_end') ? '武田家' : '諸豪族';
  }
  const out = {};
  for(const pk in base){
    let k = base[pk], txt = legacy[pk] || '', subm = false;
    if(k !== 'none'){                        // 齋藤自 v23 起亦為真大名,同受存亡與臣服疊加
      const L = S.lords ? S.lords[k] : null;
      if(L && L.alive === false){ k = 'player'; txt = famN; }          // 為你所滅——其地入你之手
      else if(L && L.submitted){ subm = true; txt = (LORD_META[k] ? LORD_META[k].name : '') + '家(臣服)'; }
    }
    const col = k==='saito' ? '#8aa878' : k==='none' ? '#b0aca0'
              : subm ? LORDC.player : (LORDC[k] || '#a49878');
    out[pk] = {owner: subm ? 'player' : k, col, txt};
  }
  return out;
}
function drawInfluence(c){
  if(!S.rivals) return;
  // 全圖劃分:每一寸土地依「居城位置×石高」歸於某家——大名直轄亦為源點,無主之境盡屬最近之家
  const CELL = 5, X0 = 20, X1 = 880, Y0 = 26, Y1 = 560, CUT = 0.02;
  const NEUTRAL = '#5f6b4f';                      // 無主:與陸地底色(#d8cfa8)明顯區隔
  const act = S.rivals.filter(f=>f.alive).map(f=>({
    x:f.x, y:f.y, w:Math.sqrt(Math.max(1, f.koku)),
    camp: f.lord || 'none',
    col: f.lord === 'player' ? '#a63c2e' : (LORDC[f.lord] || NEUTRAL)
  }));
  { // 玩家:本據 + 歷來併吞的居館,各分一份石高——重心隨擴張而移
    const pp = playerPos();
    const hs = (S.holds || []).filter(h=>h && isFinite(h.x));
    const tw = 1.6 + hs.reduce((a,h)=>a+(h.w||1), 0);        // 本據佔 1.6 份
    const put = (x,y,share)=> act.push({x, y,
      w: Math.sqrt(Math.max(1, S.kokudaka * share/tw)) * 1.05, camp:'player', col:'#a63c2e'});
    put(pp.x, pp.y, 1.6);
    hs.forEach(h=> put(h.x, h.y, h.w||1));
  }
  { // 大名親領:居城為源點,直轄石高定其幅員(臣服者著玩家之色;上杉據春日山,兵鋒自北而下)
    const LORD_CAP = {oda:'kiyosu', toyotomi:'kiyosu', imagawa:'sunpu', saito:'inabayama',
                      takeda:'tsutsujiga', tokugawa:'okazaki'};
    if(S.lords) for(const key in S.lords){
      const L = S.lords[key];
      if(!L || key === 'player' || L.alive === false) continue;
      let x, y;
      if(key === 'nagao'){ x = 470; y = -30; }
      else{
        const cc = CASTLES[LORD_CAP[key]];
        if(!cc) continue;
        x = cc.x; y = cc.y;
      }
      act.push({x, y, w: Math.sqrt(Math.max(1, L.demesne||3000)) * 1.1,
        camp: L.submitted ? 'player' : key,
        col: L.submitted ? '#a63c2e' : (LORDC[key] || NEUTRAL)});
    }
  }
  const NX = Math.ceil((X1-X0)/CELL), NY = Math.ceil((Y1-Y0)/CELL);
  const win = new Int16Array(NX*NY).fill(-1);
  for(let ix=0; ix<NX; ix++){
    const cx = X0 + ix*CELL + CELL/2;
    for(let iy=0; iy<NY; iy++){
      const cy = Y0 + iy*CELL + CELL/2;
      let bi = -1, bw = CUT;
      for(let k=0; k<act.length; k++){
        const a = act[k];
        const v = a.w / (Math.hypot(a.x-cx, a.y-cy) + 45);
        if(v > bw){ bw = v; bi = k; }
      }
      win[ix*NY+iy] = bi;
    }
  }
  // ── 淡彩:縮圖 → 平滑放大,得到暈染的邊緣而非階梯 ──
  const off = document.createElement('canvas');
  off.width = NX; off.height = NY;
  const oc = off.getContext('2d');
  const img = oc.createImageData(NX, NY);
  const rgb = {};
  for(let ix=0; ix<NX; ix++) for(let iy=0; iy<NY; iy++){
    const k = win[ix*NY+iy], o = (iy*NX + ix)*4;
    if(k < 0){ img.data[o+3] = 0; continue; }
    let v = rgb[act[k].col];
    if(!v){ const h = act[k].col;
      v = rgb[h] = [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
    img.data[o] = v[0]; img.data[o+1] = v[1]; img.data[o+2] = v[2]; img.data[o+3] = 255;
  }
  oc.putImageData(img, 0, 0);
  // 放大並柔化——主畫布上有 clip 時 ctx.filter 不生效,故先在離屏做完再貼
  const W2 = NX*CELL, H2 = NY*CELL;
  const soft = document.createElement('canvas');
  soft.width = W2; soft.height = H2;
  const sc = soft.getContext('2d');
  sc.imageSmoothingEnabled = true;
  if(sc.imageSmoothingQuality) sc.imageSmoothingQuality = 'high';
  try{ sc.filter = 'blur(7px)'; }catch(e){}   // 放大的同時柔化(自我 drawImage 不可靠)
  sc.drawImage(off, 0, 0, W2, H2);
  try{ sc.filter = 'none'; }catch(e){}
  c.save();
  c.globalAlpha = 0.34;                            // 全圖著色後稍降透明度,底圖山川仍可辨
  c.drawImage(soft, X0, Y0, W2, H2);
  c.restore();
  // ── 墨線:眾與眾之間細線,陣營與陣營之間粗線(大名的勢力輪廓才浮得出來) ──
  const seg = (thick)=>{
    c.beginPath();
    for(let ix=0; ix<NX; ix++) for(let iy=0; iy<NY; iy++){
      const k = win[ix*NY+iy];
      const r = ix+1 < NX ? win[(ix+1)*NY+iy] : -1;
      const d = iy+1 < NY ? win[ix*NY+iy+1] : -1;
      const campOf = i => i < 0 ? null : act[i].camp;
      const diffCamp = (a,b)=> campOf(a) !== campOf(b);
      if(k !== r && (diffCamp(k,r) === thick)){
        c.moveTo(X0+(ix+1)*CELL, Y0+iy*CELL); c.lineTo(X0+(ix+1)*CELL, Y0+(iy+1)*CELL); }
      if(k !== d && (diffCamp(k,d) === thick)){
        c.moveTo(X0+ix*CELL, Y0+(iy+1)*CELL); c.lineTo(X0+(ix+1)*CELL, Y0+(iy+1)*CELL); }
    }
    c.stroke();
  };
  c.save();
  c.lineJoin = 'round'; c.lineCap = 'round';
  c.strokeStyle = 'rgba(70,58,42,.30)'; c.lineWidth = 0.9; seg(false);   // 同陣營:眾的分界
  c.strokeStyle = 'rgba(48,38,26,.62)'; c.lineWidth = 2.0; seg(true);    // 跨陣營:大名的邊境
  c.restore();
}
function drawMap(){
  const cv = $('map'), c = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  // 海(青海波紋)
  c.fillStyle = '#729cb2';
  c.fillRect(0,0,W,H);
  c.strokeStyle = 'rgba(255,255,255,0.16)'; c.lineWidth = 1.2;
  for(let wy=310; wy<H+30; wy+=24){
    for(let wx=((wy/24)%2)*22-20; wx<W+40; wx+=44){
      c.beginPath(); c.arc(wx, wy, 15, Math.PI, 0); c.stroke();
      c.beginPath(); c.arc(wx, wy, 9, Math.PI, 0); c.stroke();
    }
  }
  // 陸地(擬真海岸線:伊勢灣・知多/渥美半島・三河灣・濱名湖口・駿河灣・伊豆半島)
  const landTrace = (ctx)=>{
    ctx.moveTo(0,0); ctx.lineTo(W,0);
    ctx.lineTo(W,392);                                            // 相模灘東端
    ctx.quadraticCurveTo(862,400,836,414);                        // 相模灣岸
    ctx.quadraticCurveTo(828,452,816,502);                        // 伊豆東岸
    ctx.quadraticCurveTo(806,536,790,544);                        // 伊豆突端(石廊崎)
    ctx.quadraticCurveTo(774,522,768,478);                        // 伊豆西岸
    ctx.quadraticCurveTo(760,436,748,408);
    ctx.quadraticCurveTo(734,392,716,394);                        // 駿河灣頭(江尻・駿府沖)
    ctx.quadraticCurveTo(686,404,662,436);                        // 駿河灣西岸(大井川口)
    ctx.quadraticCurveTo(626,458,588,466);                        // 遠州灘(天龍川口)
    ctx.quadraticCurveTo(548,472,510,470);                        // 濱名湖口外
    ctx.quadraticCurveTo(486,470,462,470);                        // 遠江西端
    ctx.quadraticCurveTo(430,494,372,506);                        // 渥美半島外岸(太平洋側)
    ctx.quadraticCurveTo(330,513,305,516);                        // 伊良湖岬
    ctx.quadraticCurveTo(332,494,382,479);                        // 渥美內岸(三河灣側)
    ctx.quadraticCurveTo(420,466,450,450);                        // 渥美根本(田原)
    ctx.quadraticCurveTo(447,442,438,438);                        // 吉田湊
    ctx.quadraticCurveTo(412,428,394,432);                        // 蒲郡
    ctx.quadraticCurveTo(354,446,314,437);                        // 三河灣北岸(大濱・西尾)
    ctx.quadraticCurveTo(296,432,284,428);                        // 境川口
    ctx.quadraticCurveTo(278,462,274,500);                        // 知多東岸
    ctx.quadraticCurveTo(268,518,258,521);                        // 師崎(知多突端)
    ctx.quadraticCurveTo(247,506,242,462);                        // 知多西岸
    ctx.quadraticCurveTo(236,428,222,412);                        // 知多根本
    ctx.quadraticCurveTo(208,404,190,408);                        // 伊勢灣頭(熱田沖)
    ctx.quadraticCurveTo(130,424,64,444);                         // 伊勢灣北岸
    ctx.lineTo(0,456);
    ctx.closePath();
  };
  c.fillStyle = '#d8cfa8';
  c.beginPath(); landTrace(c); c.fill();
  c.strokeStyle = '#9a8f6a'; c.lineWidth = 2; c.beginPath(); landTrace(c); c.stroke();
  // 以下勢力色塊・山岳・河川皆裁切於陸地內
  c.save();
  c.beginPath(); landTrace(c); c.clip();

  const poly = (pts, fill) => {
    // 全圖 Voronoi 劃分後,省級底色成了雜訊——只留國界虛線,顏色全交給勢力劃分層
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for(let i=1;i<pts.length;i++) c.lineTo(pts[i][0], pts[i][1]);
    c.closePath();
    c.strokeStyle = 'rgba(90,80,55,.35)'; c.lineWidth = 1; c.setLineDash([6,4]);
    c.stroke(); c.setLineDash([]);
  };
  // 勢力色塊——依「當代實際領有者」著色(此前是寫死的地理色,織田滅了尾張還是黃的)
  const PV = provStatus();
  poly([[0,60],[250,40],[262,160],[120,190],[0,170]], PV.mino.col);                      // 美濃
  poly([[0,170],[120,190],[262,160],[272,300],[290,560],[0,560],[0,430]], PV.owari.col); // 尾張(含知多)
  poly([[262,160],[430,140],[452,300],[468,560],[290,560],[272,300]], PV.mikawa.col);    // 三河(含渥美)
  poly([[430,140],[620,120],[646,300],[656,560],[468,560],[452,300]], PV.totomi.col);    // 遠江
  poly([[620,120],[780,140],[900,380],[900,560],[656,560],[646,300]], PV.suruga.col);    // 駿河・伊豆
  poly([[620,0],[900,0],[900,140],[780,140],[620,120]], PV.kai.col);                     // 甲斐
  poly([[250,0],[620,0],[620,120],[430,140],[262,160],[250,40]], PV.shinano.col);        // 信濃

  // ── 國人眾的勢力範圍(加權 Voronoi:石高越大,影響所及越廣) ──
  drawInfluence(c);

  // 大川(細淡,只畫下游,河口貼合海岸)
  c.strokeStyle = 'rgba(96,142,168,0.35)'; c.lineWidth = 1.6; c.lineCap = 'round';
  const river = (pts)=>{
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
    for(let i=1;i<pts.length;i++) c.quadraticCurveTo(
      (pts[i-1][0]+pts[i][0])/2 + (i%2?3:-3), (pts[i-1][1]+pts[i][1])/2, pts[i][0], pts[i][1]);
    c.stroke();
  };
  river([[178,240],[190,320],[200,402]]);             // 木曾川下游→伊勢灣
  river([[334,300],[322,370],[312,434]]);             // 矢作川→三河灣
  river([[436,360],[440,438]]);                       // 豐川→吉田
  river([[574,240],[580,350],[586,462]]);             // 天龍川下游
  river([[651,240],[649,340],[652,432]]);             // 大井川(遠駿國境)
  river([[732,250],[726,330],[718,392]]);             // 富士川→駿河灣

  // 山岳皴線(疏落幾筆即可)
  c.strokeStyle = 'rgba(80,70,48,0.32)'; c.lineWidth = 1.5; c.lineJoin = 'round';
  const mt = (x,y,s)=>{
    c.beginPath(); c.moveTo(x-s,y); c.lineTo(x,y-s*1.15); c.lineTo(x+s,y); c.stroke();
    c.beginPath(); c.moveTo(x, y-s*1.15); c.lineTo(x+s*0.35, y-s*0.45); c.stroke();
  };
  [[310,64],[478,72],[560,48],[690,58],[122,60],[832,86]].forEach(p=>mt(p[0],p[1],10));
  [[812,308],[798,362]].forEach(p=>mt(p[0],p[1],7));
  c.restore();   // 解除陸地裁切

  {
    const camps = new Set();
    S.rivals.filter(f=>f.alive && f.lord && f.lord!=='player' && LORDC[f.lord]).forEach(f=>camps.add(f.lord));

    for(const k of ['imagawa','oda','tokugawa','takeda','saito','nagao','toyotomi']){

    rows.push(['#5f6b4f', '無主之眾']);
    const bh = rows.length*13 + 40;
    const lx = 14, ly = H - bh - 8;
    c.fillStyle = 'rgba(246,239,221,0.90)';
    c.strokeStyle = 'rgba(122,111,84,.6)'; c.lineWidth = 1;

function startGame(state){
  S = state;
  if(S.isDaimyo){   // 讀檔還原玩家大名的名號
    LORD_META.player = {name: S.famName, capital: S.clanType==='temple' ? '御坊' : S.clanType==='suigun' ? '湊城' : '本城'};
    if(!S.lords.player) S.lords.player = {demesne:0, favor:100, alive:true};
  }
  $('titleScreen').classList.add('hidden');
  $('gameRoot').classList.remove('hidden');
  log(`${eraName(S.year)}(${S.year}),${S.famName}家立於三河・尾張之境。東有今川,西有織田——這個家,要在亂世裡活下去。`, 'y');
  saveNow();   // 進場落檔一次佔欄;此後不自動存檔,保存唯手動(💾)
  render();
  if(!S.kakun && !S.gameOver){ chooseKakun(false); pumpModal(); }
}

// 存檔欄清單
function renderSlots(){
  const list = $('slotList');
  list.innerHTML = '';
  for(let i=1; i<=SLOT_COUNT; i++){
    const info = slotInfo(i);
    const row = document.createElement('div');
    row.className = 'slotRow' + (i === curSlot ? ' sel' : '');
    const no = document.createElement('div');
    no.className = 'sNo'; no.textContent = ['一','二','三','四'][i-1];
    row.appendChild(no);
    if(info){
      const cv = document.createElement('canvas');
      cv.width = 30; cv.height = 30;
      KAMON[info.kamon].draw(cv.getContext('2d'), 15, 15, 12, '#3a2f24', '#faf4e6');
      row.appendChild(cv);
      const b = document.createElement('div');
      b.className = 'sBody';
      b.innerHTML = `<b>${info.famName}家</b>〔${info.clan}〕${info.daimyo?'<b style="color:var(--accent)">・大名</b>':''}${info.over?'<span class="loyLow">・家名斷絕</span>':''}`+
        `<small>${info.era}(${info.year})${info.season}・${info.koku} 石・當主 ${info.gen}${info.savedAt?`　${fmtWhen(info.savedAt)}`:''}</small>`;
      row.appendChild(b);
      const del = document.createElement('button');
      del.className = 'ghost'; del.textContent = '刪除';
      del.onclick = (e)=>{
        e.stopPropagation();
        if(!confirm(`確定刪除第${['一','二','三','四'][i-1]}欄的「${info.famName}家」?此舉不可復原。`)) return;
        localStorage.removeItem(SLOT_KEY(i));
        renderSlots(); syncTitleButtons();
      };
      row.appendChild(del);
    }else{
      const e = document.createElement('div');
      e.className = 'sEmpty'; e.textContent = '—— 空欄 ——';
      row.appendChild(e);
    }
    row.onclick = ()=>{ curSlot = i; renderSlots(); syncTitleButtons(); };
    list.appendChild(row);
  }
}
function syncTitleButtons(){
  const has = !!slotInfo(curSlot);
  const btn = $('btnContinue');
  btn.classList.toggle('hidden', !has);
  if(has){
    const info = slotInfo(curSlot);
    btn.textContent = info.over ? '查看(已斷絕)' : `續玩 ${info.famName}家`;
  }
  $('btnNew').textContent = has ? '新的家族(覆蓋此欄)' : '新的家族';
}

      {label:'西軍——大谷吉継(修羅)', sub:'600 兵的病將,預言了裏切り,也預備了死。目標:在松尾山翻臉前擊破東軍前鋒', fn:()=>{ kokusenSeki('west'); }},
      {label:'東軍——黑田長政(標準)', sub:'調略松尾山的正是你。與福島搶一番槍,等秀秋的旗變色', fn:()=>{ kokusenSeki('east'); }},
      {label:'返回', fn:()=>{ $('titleScreen').classList.remove('hidden'); }}
    ]});
  pumpModal();
};
$('btnEnd').onclick = endSeason;
$('btnSave').onclick = () => { save(); log(`已存入第${['一','二','三','四'][curSlot-1]}欄。`); render(); };
$('btnTitle').onclick = () => { save(); location.reload(); };
$('btnSaveAs').onclick = () => {
  const opts = [];
  for(let i=1;i<=SLOT_COUNT;i++){
    if(i === curSlot) continue;
    const info = slotInfo(i);
    opts.push({label:`第${['一','二','三','四'][i-1]}欄${info?`(覆蓋 ${info.famName}家・${info.era})`:'(空欄)'}`,
      fn:()=>{
        try{
          S.savedAt = Date.now();
          localStorage.setItem(SLOT_KEY(i), JSON.stringify(S));
          curSlot = i;
          localStorage.setItem('sengoku_family_lastslot', String(i));
          log(`已另存至第${['一','二','三','四'][i-1]}欄,並以該欄繼續遊玩。`,'good');
          render();
        }catch(e){ log('存檔失敗(儲存空間不足?)。','bad'); }
      }});
  }
  opts.push({label:'取消', fn:()=>{}});
  queueModal({title:'另存至他欄', body:'將目前進度複製到另一個存檔欄(之後以該欄繼續遊玩)。\n可用來在重大抉擇前留下分歧點。', choices:opts});
  pumpModal();
};
$('btnReset').onclick = () => {
  if(!confirm(`確定刪除第${['一','二','三','四'][curSlot-1]}欄的存檔並回到標題?此舉不可復原。`)) return;
  localStorage.removeItem(SLOT_KEY(curSlot));
  location.reload();
};
// 米市:數量自選(50/200/500/1000/全部)
function riceTradeModal(mode){
  const rate = riceRate();
  const cap = mode==='sell' ? Math.floor(S.rice) : Math.floor(S.money / (rate*1.25));
  const tiers = [50, 200, 500, 1000, cap];
  const seen = new Set(), ch = [];
  for(const q of tiers){
    const amt = Math.floor(q);
    if(amt < 50 || amt > cap || seen.has(amt)) continue;
    seen.add(amt);
    if(mode==='sell'){
      const gain = ri(amt * rate);
      ch.push({label:`賣 ${amt} 石`, sub:`得 ${gain} 貫${amt===cap?'(傾倉)':''}`, fn:()=>{
        if(S.rice < amt) return;
        S.rice -= amt; S.money += gain;
        log(`市場賣米 ${amt} 石,得 ${gain} 貫。`); save(); render();
      }});
    }else{
      const cost = ri(amt * rate * 1.25);
      ch.push({label:`買 ${amt} 石`, sub:`花 ${cost} 貫${amt===cap?'(傾囊)':''}`, fn:()=>{
        if(S.money < cost) return;
        S.money -= cost; S.rice += amt;
        log(`市場買米 ${amt} 石,花 ${cost} 貫。`); save(); render();
      }});
    }
  }
  ch.push({label:'作罷', fn:()=>{}});
  queueModal({title: mode==='sell' ? '市場賣米' : '市場買米',
    body:`時價 ${rate.toFixed(2)} 貫/石${mode==='buy'?'(買入加二成五牙錢)':''}${S.warBoom>0?'・戰時騰貴':''}。
倉中存米 ${ri(S.rice)} 石・手頭 ${ri(S.money)} 貫。`,
    choices: ch});
  pumpModal();
}
$('btnSell').onclick = () => { if(S.rice >= 50) riceTradeModal('sell'); };
// 獻上御用金:重複可為,價碼遞增——後期富餘之錢的正當去處
const kugeCost = () => ri(600 * (1 + (S.kuge||0) * 0.55));
$('btnMine').onclick = () => {
  if(S.region !== 'shinano' || (S.mine||0) >= 3) return;
  const mc = 200 * ((S.mine||0) + 1);
  if(S.money < mc) return;
  S.money -= mc;
  S.mine = (S.mine||0) + 1;
  log(`⛏ 徵發礦夫、鑿山開洞——山金掘り ${S.mine} 級開張!(歲末出金,偶有山崩之險)`,'good');
  save(); render();
};
$('btnKuge').onclick = () => {
  const c = kugeCost();
  if(S.gameOver || S.money < c) return;
  S.money -= c; S.kuge = (S.kuge||0) + 1;
  gainPrestige(6);
  log(`🎋 獻金 ${c} 貫於公家門跡——禁裏修繕、寫經造塔,${S.famName}家之名達於京洛(威望 +6)。`,'good');
  save(); render();
};
// 雇傭兵:錢直接換兵,不耗領民,但養兵費照算
const yatoiN = () => Math.max(8, ri(12 + S.kokudaka/260));
const yatoiCost = () => ri(yatoiN() * 13);
$('btnYatoi').onclick = () => {
  const n = yatoiN(), c = yatoiCost();
  if(S.gameOver || S.money < c) return;
  if(S.soldiers >= solCap()*1.35){ log('傭兵之數已逾家中所能節制,牢人不再應募。','bad'); return; }
  S.money -= c; armySync();
  S.army.ashigaru = (S.army.ashigaru||0) + n;
  S.soldiers += n;
  log(`召募牢人足輕 ${n} 名(${c} 貫)——不動領民一分,惟糧餉自此多一份(總兵力 ${S.soldiers})。`);
  save(); render();
};
$('btnBoshu').onclick = doBoshu;
$('btnKani').onclick = () => {
  const lv = (S.kani||0) + 1;
  if(lv > 2) return;
  const cost = kaniCost(lv);
  if(S.money < cost) return;
  S.money -= cost;
  grantKani(lv, '獻金於朝廷');
  save(); render();
};
$('btnBuy').onclick = () => { if(S.money >= ri(50 * riceRate() * 1.25)) riceTradeModal('buy'); };
document.querySelectorAll('.taxBtn').forEach(b=>{
  b.onclick = () => {
    const nt = parseFloat(b.dataset.tax);
    if(nt >= 0.5 && S.taxRate < 0.5 && hasKakun('minpon')) violateKakun('課以五公五民之苛稅');
    S.taxRate = nt; save(); render();
  };
});

// 存檔欄初始化:舊版單一存檔自動移入第一欄,並選中上次遊玩的欄位
migrateLegacy();
(function initSlots(){
  const last = parseInt(localStorage.getItem('sengoku_family_lastslot')||'0', 10);
  if(last >= 1 && last <= SLOT_COUNT && slotInfo(last)) curSlot = last;
  else { for(let i=1;i<=SLOT_COUNT;i++){ if(slotInfo(i)){ curSlot = i; break; } } }
  renderSlots();
  syncTitleButtons();
})();

// 測試掛鉤(headless 驗證用)
window.__game = {
  get S(){ return S; },
  endSeason,
  queueModal, pumpModal,
  choose(i){ const btns = $('modalChoices').querySelectorAll('button'); if(btns[i]) btns[i].click(); },
  victoryTerms, taisho, aptMul, startBattle, punitiveWar, daimyoWar, addAptExp, expOf,
  simRivalActions, simRivalPolitics, simRivalPredation, resolveRumors, rumorNotice,
  rivalPlan, playerWeakness, planLabel, winterSettle,
  meiboMor, meiboRonin, meiboLoyal, meiboHold, meiboKani, meiboEnvy, meiboTier, kaniCost, openMeibo,
  kokusen, lordRoster, get KS(){ return KS; },
  newState, startGame, render, log, TASKS, CLANS,
  // 模擬用:暫時關掉 canvas 與存檔以加速(回傳還原函式)
  fast(){
    const o = {drawMap, faceCanvas, battlefieldImg, save, inkanStamp};
    drawMap = ()=>{}; faceCanvas = ()=>document.createElement('canvas');
    battlefieldImg = ()=>''; save = ()=>{}; inkanStamp = ()=>'';
    return ()=>{ drawMap=o.drawMap; faceCanvas=o.faceCanvas; battlefieldImg=o.battlefieldImg;
                 save=o.save; inkanStamp=o.inkanStamp; };
  },
  // 測試用:還原被測試污染的狀態(存檔字串)
  restoreState(json){ S = migrate(JSON.parse(json)); save(); render(); }
};
</script>
