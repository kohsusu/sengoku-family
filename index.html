// 武將の去就:主家勢弱・新敗則部將出奔強家;主家滅亡則遺臣四散(亦可能來投玩家)
function simVassalDefections(lines){
  if(!S.lords) return;
  const alive = aiLords();
  const strongest = alive.length ? alive.reduce((a,b)=>lordPower(a)>=lordPower(b)?a:b) : null;
  // ── 寝返り:家老忠貞不移,部將見風轉舵 ──
  for(const key of alive){
    const L = S.lords[key];
    const weakVs = strongest && key !== strongest && lordPower(key) < lordPower(strongest)*0.42;
    const battered = (L.wounds||0) >= 0.3;
    if(!weakVs && !battered) continue;
    if(S.defCd && S.defCd[key] && S.year - S.defCd[key] < 3) continue;   // 一家數年至多走一人
    if(Math.random() > 0.12) continue;
    (S.defCd = S.defCd || {})[key] = S.year;
    const cands = lordRoster(key).filter(v => v.rank !== 'karo');
    if(!cands.length) continue;
    const v = pick1(cands);
    let to = strongest;
    if(S.isDaimyo && S.prestige >= 90 && playerPower() > lordPower(key) && Math.random() < 0.4) to = 'player';
    if(!to || to === key) continue;
    if(to !== 'player' && ((S.extraVassals && S.extraVassals[to]) || []).length >= 3) continue;
    defectVassal(key, v, to);
    if(to === 'player'){
      const cost = 0;
      rosterAdd({name:v.n, role:'客將', kind:'浪人', age:34+ri(Math.random()*14),
        bu:v.bu, nai:v.nai, chi:v.chi, task:'rest',
        merit:0, salary:16+ri(v.bu*0.1), loyalty:55, rank:1, stamina:100, trait:null});
      lines.push(`⚡ ${LORD_META[key].name}家 ${RANK_LABEL[v.rank]||''} ${v.n} 見主家勢衰,慕${S.famName}家之名來投——列為客將!`);
    }else{
      lines.push(`⚡ ${LORD_META[key].name}家 ${RANK_LABEL[v.rank]||''} ${v.n} 出奔,轉仕${LORD_META[to].name}家!——${LORD_META[key].capital}為之大震。`);
    }
  }
  // ── 主家滅亡:遺臣四散(轉仕/來投/歸農) ──
  for(const key in S.lords){
    const L = S.lords[key];
    if(!L || L.alive !== false) continue;
    if(S.scattered && S.scattered[key]) continue;
    (S.scattered = S.scattered || {})[key] = true;
    const men = lordRoster(key);
    if(!men.length) continue;
    let offered = false;
    const fates = [];
    for(const v of men){
      const r = Math.random();
      const dests = aiLords().filter(k => ((S.extraVassals && S.extraVassals[k]) || []).length < 3);
      if(r < 0.45 && dests.length){
        const to = pick1(dests);
        defectVassal(key, v, to);
        fates.push(`${v.n}轉仕${LORD_META[to].name}家`);
      }else if(r < 0.62 && !offered){
        offered = true;
        defectVassal(key, v, 'player');
        const cost = ri((v.bu + v.nai + v.chi) * 0.6);
        queueModal({title:`${LORD_META[key].name}家遺臣來投`,
          body:`主家既亡,${LORD_META[key].name}家${RANK_LABEL[v.rank]||''} ${v.n} 流落至此,願仕${S.famName}家。`+
            String.fromCharCode(10) + String.fromCharCode(10) +
            `武勇 ${v.bu}・內政 ${v.nai}・智謀 ${v.chi}` + String.fromCharCode(10) +
            `支度金 ${cost} 貫、年俸 ${16+ri(v.bu*0.1)} 石。`,
          choices:[
            {label:`收留(${cost}貫)`, sub: activeR().length >= ROSTER_MAX ? '席次已滿——將列部屋住' : '名門遺臣入幕', fn:()=>{
              if(S.money < cost){ log('拿不出支度金,只得目送其遠去。','bad'); return; }
              S.money -= cost;
              rosterAdd({name:v.n, role:'客將', kind:'浪人', age:34+ri(Math.random()*14),
                bu:v.bu, nai:v.nai, chi:v.chi, task:'rest',
                merit:0, salary:16+ri(v.bu*0.1), loyalty:56, rank:1, stamina:100, trait:null});
              log(`${v.n} 入幕${S.famName}家——名門遺臣,自此為我所用。`,'good');
            }},
            {label:'婉拒', sub:'他自會另尋去處', fn:()=>{
              const d2 = aiLords();
              if(d2.length){ defectVassal(key, v, pick1(d2)); }
            }}
          ]});
      }else{
        fates.push(`${v.n}解甲歸田`);
      }
    }
    if(fates.length) lines.push(`${LORD_META[key].name}家遺臣四散:${fates.join('、')}。`);
  }
}
// ══════════ 大名動態戰爭:切り取り(併吞無主眾)+境目相論(非腳本大名戰) ══════════
// 國郡歸屬與鄰接(大名兵鋒所及=自國+鄰國;上杉自越後僅及信濃)
const CLAN_PROV = {mizuno:'mikawa', toda:'mikawa', kira:'mikawa', udono:'mikawa', saigo:'mikawa',
  okudaira:'mikawa', suganuma:'mikawa', honshoji:'mikawa', saji:'owari', sanada:'shinano',
  yamaguchi:'owari', hayashi:'owari', hattori:'owari', ii:'totomi', osawa:'totomi',
  amano:'totomi', matsui:'totomi', murakami:'shinano', ogasawara:'shinano', suwa:'shinano', kiso:'shinano'};
const PROV_ADJ = {mino:['owari','shinano'], owari:['mino','mikawa'], mikawa:['owari','totomi'],
  totomi:['mikawa','suruga'], suruga:['totomi','kai'], kai:['suruga','shinano'],
  shinano:['kai','mino','echigo'], echigo:['shinano']};
function lordProvs(key){
  if(key === 'nagao') return ['echigo'];
  const po = provOwners();
  return Object.keys(po).filter(p => po[p] === key);
}
function lordReach(key){   // 兵鋒所及之國(自國+接壤)
  const own = lordProvs(key), out = new Set(own);
  own.forEach(p => (PROV_ADJ[p]||[]).forEach(q => out.add(q)));
  return out;
}
// 大名切り取り:併吞兵鋒所及的無主眾——前一年風聞預告,玩家可搶先勧誘或討伐
function simLordKiritori(lines){
  if(!S.lords || S.year < 1552 || (S.flags && S.flags.unified)) return;
  // 第二段:去年放話者,今年兵臨城下
  if(S.lordPrey){
    const {lord, id} = S.lordPrey;
    S.lordPrey = null;
    const L = S.lords[lord], f = S.rivals.find(x=>x.id === id);
    if(L && L.alive !== false && !L.submitted && f && f.alive && !f.lord){
      const M = LORD_META[lord].name;
      const pSubmit = clamp(0.42 + (typeof lordAppeal==='function' ? lordAppeal(f, lord)/400 : 0)
                            - (f.persona==='武斷' ? 0.22 : 0) + (f.persona==='保守'||f.persona==='名門' ? 0.1 : 0), 0.15, 0.85);
      if(Math.random() < pSubmit){
        f.lord = lord;
        lines.push(`🏳 ${M}家大軍壓境,${fname(f)}開城獻誓紙——自此為${M}家從屬。`);
      }else{
        const pWin = clamp(0.85 - (f.fort||0)*0.07 - (f.persona==='武斷' ? 0.08 : 0), 0.5, 0.9);
        if(Math.random() < pWin){
          const cut = ri(f.koku*0.4);
          f.koku = Math.max(0, f.koku - cut); L.demesne += cut;
          if(f.koku < 250){
            L.demesne += f.koku; f.koku = 0;
            collapseRival(f, `拒不臣從,為${M}家大軍踏平`, lines);
          }else{
            f.lord = lord;
            lines.push(`⚔ ${fname(f)}據城而抗,終不敵${M}家兵勢——割地 ${cut} 石乞降,淪為從屬。`);
          }
        }else{
          L.wounds = clamp((L.wounds||0) + 0.05, 0, 0.6);
          f.prestige = (f.prestige||0) + 6;
          lines.push(`🔥 ${fname(f)}憑城死守,竟擊退${M}家先鋒!小家之名,一夕傳遍近國。`);
          L.kiriCd = 3;
        }
      }
    }
    return;   // 一年至多一件,天下不至於一夕變色
  }
  // 第一段:擇一家放話(風聞)
  aliveLords().forEach(k => { if(S.lords[k].kiriCd > 0) S.lords[k].kiriCd -= 1; });
  const cands = aliveLords().filter(k => !S.lords[k].submitted && (S.lords[k].wounds||0) < 0.2
                                      && !(S.lords[k].kiriCd > 0));
  if(!cands.length || Math.random() > (S.year >= 1560 ? 0.45 : 0.2)) return;
  const key = pick1(cands);
  const reach = lordReach(key);
  const prey = S.rivals.filter(f => f.alive && !f.lord && f.persona !== '門徒'
                                 && reach.has(CLAN_PROV[f.id]));
  if(!prey.length) return;
  const f = prey.reduce((a,b)=>a.koku<=b.koku?a:b);
  S.lordPrey = {lord:key, id:f.id};
  S.lords[key].kiriCd = 2 + ri(Math.random()*2);
  lines.push(`📯【風聞】${LORD_META[key].name}家評定已決:「${fname(f)}(${f.seat})不奉誰家旗號,來春切り取り!」`+
    (pdist(f) <= NEIGHBOR_R ? `——兵鋒就在鄰境,${S.famName}家若有意,當趕在大軍之前。` : ''));
}
// 境目相論:相鄰而均勢的大名因寸土爆發局地戰(不佔 warPair——腳本大戰照舊,此為其外的私鬥)
function simLordFeuds(lines){
  if(!S.lords || S.year >= 1584 || (S.flags && S.flags.unified)) return;   // 小牧之後惣無事,私戰息止
  if(S.warPair){   // 順帶清理名存實亡的對立(一方已滅則對子作廢)
    const [pa, pb] = S.warPair;
    if(!S.lords[pa] || !S.lords[pb] || S.lords[pa].alive === false || S.lords[pb].alive === false)
      S.warPair = null;
  }
  if(Math.random() > 0.30) return;
  const busy = new Set(S.warPair || []);   // 正打大戰者無暇他顧
  const al = aiLords().filter(k => !S.lords[k].submitted && (S.lords[k].wounds||0) < 0.2 && !busy.has(k));
  const pairs = [];
  for(const a of al) for(const b of al){
    if(a >= b) continue;
    // 兵鋒所及相交即可開戰——無主之國(信濃等)正是諸家必爭的緩衝帶
    const ra = lordReach(a), rb = lordReach(b);
    if(![...ra].some(p => rb.has(p))) continue;
    const r = lordPower(a) / Math.max(1, lordPower(b));
    if(r >= 0.6 && r <= 1.7) pairs.push([a, b]);
  }
  if(!pairs.length) return;
  const [a, b] = pick1(pairs);
  if(S.allegiance === a || S.allegiance === b){
    // 你的主家捲入境目之爭——軍役徵召(走既有機制,勝敗由你的戰功左右)
    const enemy = S.allegiance === a ? b : a;
    lines.push(`⚔【境目相論】${LORD_META[a].name}家與${LORD_META[b].name}家因境目寸土相爭,兵戈已起!`);
    startCampaign(S.allegiance, enemy, '境目の合戰');
  }else{
    const pA = lordPower(a), pB = lordPower(b);
    const w = Math.random() < pA/(pA+pB) ? a : b, l = w === a ? b : a;
    warAftermath(w, l);
    lines.push(`⚔【境目相論】${LORD_META[a].name}家與${LORD_META[b].name}家戰於境上——${LORD_META[w].name}方得勝,奪地百五十石。`);
  }
}
function simLords(lines){
  for(const key of aliveLords()){
    const L = S.lords[key], roster = lordRoster(key);
    if(!roster.length) continue;
    // 新敗之師,息兵為先:傷創過重時全力整補,不開墾不調略(玩家新敗後也會這麼做)
    if((L.wounds||0) >= 0.15){
      L.wounds = Math.max(0, L.wounds - 0.04);   // 全力整補亦不過多募得幾分——兵員不是米,割了明年又長
      L.demesne = ri(L.demesne + roster.reduce((a,v)=>a+v.nai,0) * 0.06);
      if(Math.random() < 0.5) lines.push(`${LORD_META[key].name}家息兵整備,收攏潰卒、四鄉徵募——兵鋒漸復(戰創現 ${ri(L.wounds*100)}%)。`);
      continue;
    }
    let grow = 0, best = null, bestV = 0;
    for(const v of roster){
      const roll = Math.random();
      if(roll < 0.55){                                   // 內政:開墾檢地
        const g = v.nai * 0.28 * (0.7 + Math.random()*0.6) * (L.demesne > 8000 ? 0.4 : 1);
        grow += g;
        if(g > bestV){ bestV = g; best = {v, act:'督導檢地開墾'}; }
      }else if(roll < 0.8){                              // 軍備:兵農整備(亦計入石高基礎)
        const g = v.bu * 0.12 * (0.7 + Math.random()*0.6);
        grow += g;
        if(g > bestV){ bestV = g; best = {v, act:'整備兵農'}; }
      }else{                                             // 調略:拉攏他家國人眾(限兵鋒所及之國——齋藤調略不到田原的戶田)
        const reach = lordReach(key);
        const pool = S.rivals.filter(f=>f.alive && f.lord !== key && f.persona !== '門徒'
                                     && reach.has(CLAN_PROV[f.id]));
        if(pool.length && Math.random() < v.chi/220){
          const tgt = pool[Math.floor(Math.random()*pool.length)];
          const wasPlayers = tgt.lord === 'player';
          if(wasPlayers && playerPower() > lordPower(key)*0.8) continue;   // 你夠強,調略無功
          tgt.lord = key;
          lines.push(`⚡ ${LORD_META[key].name}家 ${v.n} 調略成功,${fname(tgt)}轉投${LORD_META[key].name}家!`+
            (wasPlayers ? `——${S.famName}家失一從屬!` : ''));
        }
      }
    }
    L.demesne = ri(L.demesne + grow);
    if(best && grow >= 20) lines.push(`${LORD_META[key].name}家 ${best.v.n} ${best.act},直轄領 +${ri(grow)} 石(現 ${L.demesne})。`);
    // ── 戰略目標:鎖定最弱敵家的一座城 ──
    const foes = aiLords().filter(k=>k!==key && !S.lords[k].submitted);
    if(foes.length){
      // 現正交兵者優先,否則挑最弱的鄰家
      const atWar = (S.warPair||[]).find(k=>k!==key && foes.includes(k));
      const mark = atWar || foes.reduce((a,b)=>lordPower(a)<=lordPower(b)?a:b);
      const cs = castlesOf(mark);
      const tc = cs.length ? cs.reduce((a,b)=> CASTLES[a].koku <= CASTLES[b].koku ? a : b) : null;
      if(tc && L.target !== tc){
        L.target = tc; L.targetOf = mark;
        if(Math.random() < 0.5) lines.push(`${LORD_META[key].name}家評定:「先取 ${CASTLES[tc].name}」——兵鋒指向${LORD_META[mark].name}家。`);
      }
    }
    // ── 恩賞與懲戒:自家從屬眾的管理 ──
    const vs = S.rivals.filter(f=>f.alive && f.lord===key);
    if(vs.length && Math.random() < 0.3){
      const v = pick1(vs);
      if(Math.random() < 0.7){ v.koku += ri(v.koku*0.04); }        // 加增
      else { v.koku = Math.max(120, v.koku - ri(v.koku*0.05));      // 削封
        lines.push(`${LORD_META[key].name}家以怠慢之罪削${fname(v)}之封。`); }
    }
  }
  // ── 大名間外交:弱者相結以抗最強 ──
  const al = aiLords().filter(k=>!S.lords[k].submitted);
  if(al.length >= 2){
    const top = al.reduce((a,b)=>lordPower(a)>=lordPower(b)?a:b);
    const weak = al.filter(k=>k!==top && lordPower(k) < lordPower(top)*0.7);
    if(weak.length >= 2 && !S.lordAlly && Math.random() < 0.25){
      S.lordAlly = {mem:weak.slice(0,2), vs:top, since:S.year};
      lines.push(`🤝【大名同盟】${S.lordAlly.mem.map(k=>LORD_META[k].name+'家').join('與')}結盟,共抗${LORD_META[top].name}家。`);
    }
  }
  if(S.lordAlly){
    S.lordAlly.mem = S.lordAlly.mem.filter(k=>S.lords[k] && S.lords[k].alive !== false && !S.lords[k].submitted);
    if(S.lordAlly.mem.length < 2 || !S.lords[S.lordAlly.vs] || S.lords[S.lordAlly.vs].alive === false){
      lines.push('大名同盟解消。'); S.lordAlly = null;
    }else{
      S.lordAlly.mem.forEach(k=>{ S.lords[k].demesne += 40; });   // 同盟互助
    }
  }
}
// 敗戰動搖:輸的一方,從屬眾對主家信心(f.ltrust,基準60)下挫;跌破30則可能脫離——慕強者徑投最強家
function lordDefeatShock(key, sev, sink){
  const out = sink || [];
  const vs = S.rivals.filter(f=>f.alive && f.lord === key);
  const M = LORD_META[key] ? LORD_META[key].name : '';
  for(const f of vs){
    f.ltrust = clamp((f.ltrust ?? 60) - ri(8 + sev*28), 0, 100);
    if(f.ltrust < 30 && Math.random() < 0.4){
      f.lord = null; f.ltrust = 60;
      const tag = (DIPLO[f.persona]||{}).tag;
      let went = '';
      if(tag === '慕強' && Math.random() < 0.6){
        const best = aiLords().filter(k2=>k2!==key && !S.lords[k2].submitted && S.lords[k2].alive !== false
                                        && lordReach(k2).has(CLAN_PROV[f.id]))
          .sort((a,b)=>lordPower(b)-lordPower(a))[0];
        if(best){ f.lord = best; went = `,徑改仕最強的${LORD_META[best].name}家`; }
      }
      out.push(`⚡ ${fname(f)}見${M}家兵敗勢衰,離心而去——「跟著敗軍之將,遲早陪葬」${went}!`);
    }else if(f.ltrust < 45 && Math.random() < 0.4){
      out.push(`${fname(f)}對${M}家漸生離心(敗戰之主,眾望動搖)。`);
    }
  }
  if(!sink) out.forEach(l=>log(l, 'bad'));
  return out;
}
function warAftermath(winKey, loseKey){ // 合戰後:直轄領易手、從屬眾加增/戰禍、敗方戰創與討死
  S.lords[winKey].demesne = (S.lords[winKey].demesne||3000) + 150;
  S.lords[loseKey].demesne = Math.max(800, (S.lords[loseKey].demesne||3000) - 150);
  const wv = S.rivals.filter(f=>f.alive && f.lord===winKey);
  const lv = S.rivals.filter(f=>f.alive && f.lord===loseKey);
  if(wv.length){ const f = pick1(wv); f.koku = Math.min(3000, f.koku + ri(f.koku*0.05)); }
  if(lv.length){ const f = pick1(lv); f.koku = Math.max(100, f.koku - ri(f.koku*0.05)); }
  const LL = S.lords[loseKey];
  LL.wounds = clamp((LL.wounds||0) + 0.04, 0, 0.6);
  lordDefeatShock(loseKey, 0.25, null);            // 敗戰動搖:從屬眾信心下挫,甚可能離散
  if(Math.random() < 0.08){                        // 敗軍之將,殿後者歿
    const roster = lordRoster(loseKey).filter(v=>v.rank !== 'karo');
    if(roster.length){
      const v = pick1(roster);
      (S.slain[loseKey] = S.slain[loseKey] || []).push(v.n);
      log(`☠【討死】${LORD_META[loseKey].name}家之將 ${v.n} 殿後力戰,歿於亂軍。`);
    }
  }
}
// ══════════ 地緣:兵馬所及,不過鄰境 ══════════
// 弓箭到不了的地方,刀兵也到不了。爭奪只發生在接壤之家之間。
const NEIGHBOR_R = 150;              // 鄰境半徑(全九家距離 21~273,中位 149)
// 起始區域:各國國人眾的立足點(開局選擇)
const REGIONS = {
  mikawa: {name:'三河', px:290, py:380, tag:'兩強夾縫・古戰場', desc:'今川與織田的角力場。鄰家眾多、事件最密——本作的原點。'},
  owari:  {name:'尾張', px:185, py:332, tag:'織田の膝元', desc:'信長崛起的腹地。鄰接美濃與伊勢灣商路,但天下布武的兵鋒近在咫尺。'},
  totomi: {name:'遠江', px:522, py:342, tag:'今川治下', desc:'駿府的西境。井伊等名門為鄰,今川庇護深厚——但主家一倒,風暴便至。'},
  shinano:{name:'信濃', px:385, py:112, tag:'山國・龍虎の狹間', desc:'武田與上杉爭奪之地。土地貧瘠、強鄰環伺——最艱難的開局。'}
};
const playerPos = () => { const R = REGIONS[S.region] || REGIONS.mikawa; return {x:R.px, y:R.py}; };
const rdist = (a, b) => Math.hypot((a.x||0)-(b.x||0), (a.y||0)-(b.y||0));
const pdist = f => rdist(playerPos(), f);
// 某家的鄰境諸家:半徑內者;若因兼併而四鄰皆盡,則取最近的兩家(免得天下無敵手)
function neighborsOf(f){
  const live = S.rivals.filter(x=>x.alive && x !== f);
  const near = live.filter(x=>rdist(f, x) <= NEIGHBOR_R);
  if(near.length) return near;
  // 四鄰皆已併吞——領地既張,兵鋒自然及於更遠之家
  return live.sort((a,b)=>rdist(f,a)-rdist(f,b)).slice(0, 2);
}
const isNeighbor = (a, b) => neighborsOf(a).includes(b);
// 玩家的鄰境
function myNeighbors(){
  const live = S.rivals.filter(x=>x.alive);
  const near = live.filter(x=>pdist(x) <= NEIGHBOR_R);
  if(near.length) return near;
  return live.sort((a,b)=>pdist(a)-pdist(b)).slice(0, 2);
}
const isMyNeighbor = f => myNeighbors().includes(f);
// 兵鋒所及:自家鄰境,或任一從屬眾的鄰境——從屬之地即我地,兵馬糧道假道而行
function inStrikeRange(f){
  if(isMyNeighbor(f)) return true;
  return myVassals().some(v => v !== f && v.alive && rdist(v, f) <= NEIGHBOR_R);
}
// 取道之家(顯示用):經哪家從屬之境可及此家
function strikeVia(f){
  return myVassals().filter(v => v !== f && v.alive && rdist(v, f) <= NEIGHBOR_R).map(v => fname(v));
}
// 姻親與盟友的與力:血緣與盟約在刀兵臨頭時才見真章(距離越近出兵越多)
// 領地台帳:併吞誰的地,重心就往那邊移(否則打下東三河,紅圈仍釘在岡崎)
function claimSeat(f, share){
  if(!f) return;
  if(!S.holds) S.holds = [];
  if(S.holds.some(h=>h.id === f.id)) return;
  S.holds.push({id:f.id, x:f.x, y:f.y, name:f.seat, w:share || 1});
}
const lordMarr = key => !!(S.lordMarr && S.lordMarr[key]);
function allyAid(){
  return S.rivals.filter(f=>f.alive && (f.marr || f.pact) && f.lord !== 'player')
    .reduce((a,f)=> a + ri(rSol(f) * (pdist(f) <= NEIGHBOR_R ? 0.30 : 0.12)), 0);
}
// 距離的說法(給 UI 用)
function distLabel(f){
  const d = pdist(f);
  return d <= 60 ? '接壤(唇齒相依)' : d <= NEIGHBOR_R ? '鄰境' : d <= 210 ? '隔一國之遙' : '道路不通,兵馬難及';
}
const score = f => f.koku + f.prestige*8;                 // 家格
const playerScore = () => S.kokudaka + S.prestige*8;
const rSol = f => f.sol ?? ri(f.koku*0.08);               // 該家實際兵力(投資練兵者遠超石高之估)
function relLabel(f){
  return f.marr ? '姻親' : f.pact ? '盟友' : f.rel>=30 ? '友好' : f.rel>=-20 ? '中立' : f.rel>=-50 ? '冷淡' : '敵對';
}
function playerRank(){
  return 1 + S.rivals.filter(f=>f.alive && score(f) > playerScore()).length;
}
// 私鬥(壓迫翻臉/境界紛爭武力解決共用)
function privateFight(f){
  addAggression(10);
  const hero = topBu();
  const support = myVassals().filter(x=>x!==f).reduce((a,x)=>a + rSol(x)*0.5, 0);   // 從屬眾與力
  const pp = (S.soldiers + support) * (1 + hero.bu/100) * (S.clanType==='shinobi' ? 1.4 : 1) * (hero.trait==='gouyuu' ? 1.15 : 1);
  if(support > 0) log(`從屬眾派出與力 ${ri(support)} 兵助陣。`);
  const tp = rSol(f) * 1.5;
  const win = Math.random() < pp/(pp+tp);
  f.rel = clamp(f.rel - 40, -100, 100);
  if(f.lord && f.lord !== 'player' && S.lords && S.lords[f.lord]){ // 打了大名的從屬眾,主家震怒
    const hit = S.allegiance === f.lord ? 25 : 15;
    addFavor(S.lords[f.lord], -(hit));
    log(`⚠ ${fname(f)}乃${LORD_META[f.lord].name}家從屬——${LORD_META[f.lord].name}家震怒(好感 -${hit})!`,'bad');
  }
  if(win){
    const take = Math.max(30, ri(f.koku*0.12));
    f.koku -= take; S.kokudaka += take;
    S.soldiers = Math.max(0, S.soldiers - ri(S.soldiers*0.10));
    S.prestige += 4;
    hero.merit = (hero.merit||0) + 10;
    log(`與${fname(f)}私鬥得勝!奪地 ${take} 石(石高 ${S.kokudaka}),威望 +4,${hero.name} 記大功。`,'good');
  }else{
    S.soldiers = Math.max(0, S.soldiers - ri(S.soldiers*0.25));
    S.prestige = Math.max(0, S.prestige - 3);
    log(`與${fname(f)}私鬥落敗…折兵四分之一,威望 -3。`,'bad');
  }
}
// 圍城:每季處理(跨季戰略)
function processSiege(){
  if(!S.siege) return;
  const sg = S.siege;
  const f = S.rivals.find(x=>x.id===sg.id);
  if(!f || !f.alive){ S.siege = null; return; }
  sg.seasons += 1;
  const eat = ri(sg.sent * 1.2);
  S.rice = Math.max(0, S.rice - eat);
  if(S.season === 1) S.warLabor = (S.warLabor||0) + sg.sent;
  const lines = [`圍城第 ${sg.seasons} 季:陣中兵糧消耗 ${eat} 石。`];
  // 城內存糧與突發
  let broke = false, retreat = false;
  const roll = Math.random();
  if(roll < 0.18){
    const lost = ri(sg.sent*0.08);
    U_KEYS.forEach(k=>{ sg.army[k] = Math.max(0, (sg.army[k]||0) - ri((sg.army[k]||0)*0.08)); });
    sg.sent = armyTotal(sg.army);
    lines.push(`⚔ 城兵夜襲我陣!折損約 ${lost} 人。`);
  }else if(roll < 0.28){
    lines.push(`陣中疫病流行,士卒困頓——圍城恐生變。`);
    sg.need += 1;
  }
  if(f.lord && f.lord !== 'player' && S.lords[f.lord] && S.lords[f.lord].alive !== false && Math.random() < 0.22){
    lines.push(`⚠ ${LORD_META[f.lord].name}家援軍將至!再不決斷,將腹背受敵。`);
    sg.relief = true;
  }
  if(sg.seasons >= sg.need) broke = true;
  if(S.rice <= 0){ lines.push(`我軍糧盡,無以為繼……`); retreat = true; }
  const back = ()=>{ U_KEYS.forEach(k=>{ S.army[k] = (S.army[k]||0) + (sg.army[k]||0); }); S.soldiers = armyTotal(S.army); S.siege = null; };
  if(broke){
    lines.push(`🏯 城中糧盡,守將開城乞降——${f.seat}城陷落!`);
    back();
    queueModal({title:`圍城成功——${f.seat}開城`, body:lines.join('\n'), choices:[{label:'受降入城', fn:()=>{
      victoryTerms(f, 0.55, '兵糧攻めに屈し');
    }}]});
    return;
  }
  if(retreat){
    back();
    S.prestige = Math.max(0, S.prestige-3);
    queueModal({title:'圍城中止', body:lines.join('\n')+`\n\n糧盡撤圍,無功而返(威望 -3)。`, choices:[{label:'撤兵', fn:()=>{}}]});
    return;
  }
  queueModal({
    title:`圍城中——${f.seat}城(第 ${sg.seasons}/${sg.need} 季)`,
    body: lines.join('\n') + `\n\n我軍 ${sg.sent}(${armyLabel(sg.army)})在外,存糧 ${ri(S.rice)} 石。\n`+
      (sg.relief ? '⚠ 敵援軍逼近,速決為上!\n' : '') + '\n如何處置?',
    choices:[
      {label:'繼續圍困', sub:`再耗一季(預估尚需 ${Math.max(1, sg.need-sg.seasons)} 季)`, fn:()=>{}},
      {label:'轉為力攻', sub:'即刻強攻城砦——速戰速決,但傷亡大', fn:()=>{
        const army = {...sg.army}, fort = sg.fort;
        S.siege = null;
        startBattle({
          title:`強攻${f.seat}城`, intro:'久圍不下,終於下令總攻擊!', isSiege:true, sent:army,
          rivalId: f.id, intel: f.intel,
          foe:{name:fname(f), army:foeArmyOf(f), morale: 55, fort, general: rivalGeneral(f), special: foeSpecialOf(f)},
          onEnd:(res)=>{
            U_KEYS.forEach(k=>{ S.army[k] = (S.army[k]||0) + 0; });
            S.soldiers = armyTotal(S.army);
            if(res.win){ res.taisho.merit=(res.taisho.merit||0)+18; tryKillRivalMan(f, res, S.army); victoryTerms(f, res.foeLossRatio, '總攻擊により落城'); }
            else { S.prestige = Math.max(0, S.prestige-5); log('強攻失敗,只得撤圍。','bad'); }
            save(); render();
          }
        });
      }},
      {label:'撤圍', sub:'威望 -3', fn:()=>{ back(); S.prestige = Math.max(0,S.prestige-3); log('解圍撤兵,勞而無功(威望 -3)。','bad'); }}
    ]
  });
}

// 興兵的共通代價(關係・主家震怒・農忙)
function warCosts(f, sent){
  addAggression(18);
  f.rel = clamp(f.rel - 60, -100, 100);
  S.rivals.filter(x=>x.alive && x!==f).forEach(x=>{ x.rel = clamp(x.rel-8,-100,100); });
  if(f.lord && f.lord!=='player' && S.lords && S.lords[f.lord]){
    const hit = S.allegiance === f.lord ? 30 : 18;
    addFavor(S.lords[f.lord], -(hit));
    log(`⚠ ${LORD_META[f.lord].name}家震怒(好感 -${hit})!`,'bad');
  }
  if(S.season === 1){ S.warLabor = (S.warLabor||0) + sent; log(`⚠ 農忙興兵,${sent} 名農兵離田——今秋收穫堪憂!`,'bad'); }
  else if(S.season === 2){ const rot = ri(sent*1.5); S.rice = Math.max(0, S.rice-rot); log(`⚠ 收割時節興兵,${rot} 石稻穀爛在田裡。`,'bad'); }
}
// 戰勝國人眾的戰果(依敵損比例決定奪地多寡;殘存過少則併吞)
// 勝者的處置:受降 / 割地 / 根切り(取代原本的自動吞併)
function victoryTerms(f, ratio, ctx){
  const take = ri(f.koku * clamp(0.22 + ratio*0.35, 0.15, 0.55));
  const rest = Math.max(0, f.koku - take);
  const canVassal = f.lord !== 'player';
  const ch = [];
  if(canVassal) ch.push({label:'受其降伏,納為從屬', sub:`保其家名與領地(${f.koku}石),自此歲歲上納、出陣與力;另獻降禮;威望 +8`, fn:()=>{
    f.lord = 'player'; f.rel = clamp(f.rel + 35, -100, 100);
    addOn(f, 30);                                    // 城破而不屠——此恩其家必記
    gainPrestige(8);
    const gift = ri((f.money||0)*0.25 + f.koku*0.06 + 20);
    f.money = Math.max(0, (f.money||0) - ri((f.money||0)*0.25));
    S.money += gift;
    log(`🤝 ${fname(f)}開城降伏,獻上誓紙與降禮 ${gift} 貫——自此為${S.famName}家從屬(保全其領 ${f.koku} 石)。`,'good');
  }});
  ch.push({label:`割地放歸(奪 ${take} 石)`, sub:`取其地而存其家(殘 ${rest} 石);彼此仍為敵鄰`, fn:()=>{
    spoils(f, ratio);
  }});
  if(rest < f.koku * 0.9) ch.push({label:'根切り——滅其家名', sub:`盡取其領 ${f.koku} 石與府庫;但威望 -6、民心 -5、諸家震怖(全體關係 -15)`, fn:()=>{
    S.kokudaka += f.koku;
    S.money += ri((f.money||0)*0.85); S.rice += ri(f.koku*0.45);
    f.money = 0;
    f.koku = 0; f.alive = false;
    S.allies = S.allies.filter(a=>a !== f.name);
    S.prestige = Math.max(0, S.prestige - 6);
    S.minshin = clamp(S.minshin - 5, 0, 100);
    addAggression(25);
    S.rivals.filter(x=>x.alive).forEach(x=>{ x.rel = clamp(x.rel-15,-100,100); });
    claimSeat(f, 1);
    log(`☠【根切り】${fname(f)}闔家不留——盡取其領(石高 ${S.kokudaka})。三河諸家聞之股慄(威望 -6、民心 -5、全體關係 -15)。`,'bad');
  }});
  queueModal({title:`${fname(f)}——降人の處置`,
    body:`${ctx||'城已破'},${fname(f)}遣使乞降。\n\n該家現況:${f.koku} 石・${KIND_LABEL[f.clanKind]||'國人'}眾・${f.seat}\n\n如何處置?`,
    choices: ch});
  pumpModal();
}
function spoils(f, ratio){
  addAggression(12);
  const take = ri(f.koku * clamp(0.22 + ratio*0.35, 0.15, 0.55));
  f.koku -= take; S.kokudaka += take;
  gainPrestige(6);
  // 亂取り・苅田:奪地之外,兵卒收割田上之稻、搬空居館錢箱——戰爭自給
  const lootM = ri(Math.min(f.money||0, (f.money||0)*0.4) + take*0.35 + 20);
  const lootR = ri(take*1.1 + 40);
  f.money = Math.max(0, (f.money||0) - ri((f.money||0)*0.4));
  S.money += lootM; S.rice += lootR;
  log(`⚔ 大破${fname(f)}!奪地 ${take} 石(石高 ${S.kokudaka});亂取り・苅田得錢 ${lootM} 貫、米 ${lootR} 石。`,'good');
  if(f.koku < 200){
    const rest = Math.max(0, f.koku);
    S.kokudaka += rest; S.money += (f.money||0); f.money = 0;
    f.koku = 0; f.alive = false;
    S.allies = S.allies.filter(a=>a !== f.name);
    claimSeat(f, 1);
    gainPrestige(10);
    log(`☠【併吞】${fname(f)}居館陷落,家名斷絕——殘領 ${rest} 石盡入${S.famName}家(威望 +10)。`,'good');
    S.rivals.filter(x=>x.alive).forEach(x=>{ x.rel = clamp(x.rel-10,-100,100); });
    log(`三河諸家聞之震怖,對${S.famName}家愈加戒懼(全體關係 -10)。`,'bad');
  }
}
// 四眾的專屬兵種(AI 專有——玩家為國人眾,以正兵對奇兵)
const SPECIALS = {
  ishibiya:{name:'石火矢隊', s:'礮', desc:'商人重金購入的大筒與放手——齊射時轟擊我陣,雨天啞火'},
  rappa:   {name:'亂波',     s:'忍', desc:'忍眾的夜討專家——不時夜襲我營,其迂迴亦難預測'},
  sohei:   {name:'僧兵',     s:'僧', desc:'狂信之徒,士氣難潰;白刃相接尤悍'},
  houroku: {name:'焙烙隊',   s:'焙', desc:'水軍的火器投擲手——焙烙火玉拋落如雨,兵越密傷越重;雨天無效'}
};
function foeSpecialOf(f){
  const kindMap = {merchant:'ishibiya', shinobi:'rappa', temple:'sohei', suigun:'houroku'};
  const k = kindMap[f.clanKind];
  return k ? {kind:k, n: Math.max(6, ri(rSol(f)*0.16))} : null;
}
function foeArmyOf(f){          // 國人眾的兵種編成(家風為底,隨時代與財力演進)
  const n = Math.max(6, rSol(f));
  const base = f.persona==='武斷' ? {ashigaru:.5,yumi:.15,kiba:.3,teppo:.05}
          : f.persona==='商業' ? {ashigaru:.5,yumi:.2,kiba:.1,teppo:.2}
          : f.clanKind==='suigun' ? {ashigaru:.6,yumi:.3,kiba:.05,teppo:.05}
          : f.clanKind==='temple' ? {ashigaru:.75,yumi:.2,kiba:.05,teppo:0}
          : f.clanKind==='shinobi' ? {ashigaru:.45,yumi:.45,kiba:.05,teppo:.05}
          : {ashigaru:.6,yumi:.25,kiba:.12,teppo:.03};
  // 鐵砲普及:1553 種子島之後逐步、長篠(1575)之後加速;富家與湊口先得砲
  const era = clamp((S.year - 1553) / 42, 0, 1) * (S.year >= 1576 ? 1.45 : 1);
  const wealth = clamp((f.money||0) / 500, 0, 1);
  let shift = clamp(era * (0.08 + 0.10*wealth) * ((f.clanKind==='merchant'||f.clanKind==='suigun') ? 1.5 : 1), 0, 0.28);
  const p = {...base};
  const fromA = Math.min(p.ashigaru - 0.25, shift*0.55), fromY = Math.min(Math.max(0,p.yumi - 0.08), shift*0.45);
  p.ashigaru -= Math.max(0, fromA); p.yumi -= Math.max(0, fromY);
  p.teppo += Math.max(0, fromA) + Math.max(0, fromY);
  const a = {};
  let acc = 0;
  U_KEYS.forEach((k,i)=>{ if(i<3){ a[k]=Math.max(0,ri(n*p[k])); acc+=a[k]; } });
  a.teppo = Math.max(0, n-acc);
  return a;
}
// 出兵討伐:野戰或攻城(四方針)
function conquestWar(f){
  armySync();
  const sentArmy = {}; U_KEYS.forEach(k=>{ sentArmy[k] = ri((S.army[k]||0)*0.8); });
  const sent = armyTotal(sentArmy);
  const supp = myVassals().filter(x=>x!==f).reduce((a,x)=>a + rSol(x)*0.5, 0);
  if(supp > 0) sentArmy.ashigaru += ri(supp);
  // 城級=居城規模(石高)+歷年築城投資——苦心經營城砦的眾,攻起來就該付出代價
  const fortLv = Math.min(5, 1 + Math.floor(f.koku/900) + (f.fort||0));
  const go = (mode)=>{
    if(S.rice < sent){ log('兵糧不足,大軍未能開拔。','bad'); return; }
    S.rice -= sent;
    warCosts(f, sent);
    // 敵之物見:知我騎馬眾多者,野戰會誘我入山地險隘
    const lured = mode !== 'siege' && f.intel && (f.intel.n||0) >= 2 && (f.intel.kibaP||0) >= 0.28 && Math.random() < 0.45;
    startBattle({
      title: mode==='siege' ? `攻${f.seat}城` : `${fname(f)}攻略——野戰`,
      intro: mode==='siege' ? `${fname(f)}閉門不出,只得力攻其城。`
           : lured ? `${fname(f)}且戰且退,誘我軍入山地險隘——彼素知我家騎馬之利,擇地相搏!`
           : `${fname(f)}出城迎戰,兩軍對壘於境上。`,
      isSiege: mode==='siege',
      sent: sentArmy,
      rivalId: f.id, intel: f.intel,
      terrain: mode==='siege' ? 'plain' : lured ? 'mountain' : (Math.random()<0.3 ? 'mountain' : Math.random()<0.5 ? 'river' : 'plain'),
      foe: {name:fname(f), army: foeArmyOf(f), morale: 70 + f.prestige*0.3, fort: mode==='siege' ? fortLv : 0,
            general: rivalGeneral(f), special: foeSpecialOf(f)},
      onEnd:(res)=>{
        S.soldiers = armyTotal(S.army);
        if(res.win){
          res.taisho.merit = (res.taisho.merit||0) + 18;
          tryKillRivalMan(f, res, S.army);
          victoryTerms(f, res.foeLossRatio, mode==='siege' ? '城陷' : '野戰大敗');
        }else{
          S.prestige = Math.max(0, S.prestige - 5);
          S.minshin = clamp(S.minshin - 4, 0, 100);
          log(`討伐失利……(威望 -5、民心 -4)`,'bad');
        }
        save(); render();
      }
    });
  };
  queueModal({
    title:`出兵討伐——${fname(f)}`,
    body:`興兵伐${fname(f)}(${f.seat}・${f.koku}石・居城 ${fortLv} 級)。\n\n`+
      `出陣 ${sent}(${armyLabel(sentArmy)})${supp?`,含從屬與力 ${ri(supp)}`:''}\n兵糧 ${sent} 石\n\n`+
      `⚠ 無故興兵:國人眾側目${f.lord && f.lord!=='player' ? `、其主家${LORD_META[f.lord].name}家震怒` : ''}`,
    choices:[
      {label:'野戰決戰', sub:'誘其出城會戰——五陣定勝負,勝則大掠其地', fn:()=>{ go('field'); }},
      {label:'力攻其城', sub:`強攻城砦(${fortLv} 級守勢加成)——傷亡大,但一戰可下`, fn:()=>{ go('siege'); }},
      {label:'兵糧攻め(圍城)', sub:`圍而不打,2~4 季後守方糧盡自潰;期間我軍在外耗糧、農忙荒廢`, fn:()=>{
        if(S.rice < sent){ log('兵糧不足,無力圍城。','bad'); return; }
        warCosts(f, sent);
        S.siege = {id:f.id, method:'starve', seasons:0, need: 2 + Math.floor(Math.random()*3), sent, army:sentArmy, fort:fortLv};
        U_KEYS.forEach(k=>{ S.army[k] = Math.max(0, (S.army[k]||0) - (sentArmy[k]||0)); });
        S.soldiers = armyTotal(S.army);
        log(`大軍開至${f.seat}城下,四面合圍——兵糧攻め開始(預估 ${S.siege.need} 季)。`,'good');
        save(); render();
      }},
      {label:'調略(策反守將)', sub:`${S.clanType==='shinobi'?'忍眾拿手好戲——':''}花 ${ri(80+f.koku*0.05)} 貫,不戰而下其城`, fn:()=>{
        const cost = ri(80+f.koku*0.05);
        if(S.money < cost){ log('資金不足,調略無從施行。','bad'); return; }
        S.money -= cost;
        const g = gunshi();
        const p = clamp(0.18 + g.chi*0.006 + (S.clanType==='shinobi'?0.25:0) + (f.rel<-40?0.1:0) - fortLv*0.03, 0.05, 0.85);
        if(Math.random() < p){
          spoils(f, 0.5);
          gainPrestige(2);
          log(`${g.name} 密使入城,守將倒戈——不費一兵而下${f.seat}!`,'good');
        }else{
          f.rel = clamp(f.rel-30,-100,100);
          log(`調略事敗,${fname(f)}戒備更嚴(關係 -30,錢 -${cost})。`,'bad');
        }
        save(); render();
      }},
      {label:'按兵不動', fn:()=>{}}
    ]
  });
  pumpModal();
}

// 家族滅亡與瓜分
function collapseRival(f, cause, lines){
  f.alive = false;
  S.allies = S.allies.filter(a => a !== f.name);
  const rest = S.rivals.filter(x=>x.alive);
  const strongest = rest.length ? rest.reduce((a,b)=>score(a)>=score(b)?a:b) : null;
  const toStrong = strongest ? ri(f.koku*0.5) : 0;
  if(strongest) strongest.koku += toStrong;
  lines.push(`☠ ${fname(f)}(${f.seat})${cause},家名斷絕!${strongest?`${fname(strongest)}併吞其大半舊領(+${toStrong} 石)。`:''}`);
  // 遺臣流散:首席家臣淪為浪人,來投(亡家之臣不擇主而事,亂世之常)
  const orphan = bestMan(f, 'bu');
  if(orphan && (orphan.bu >= 55 || orphan.nai >= 55 || orphan.chi >= 55)){
    const ocost = ri((orphan.bu + orphan.nai + orphan.chi) * 0.5);
    queueModal({title:`${fname(f)}遺臣來投`,
      face:{name:orphan.name, age:orphan.age},
      body:`舊主既亡,${fname(f)}之將 ${orphan.name}(${orphan.age}歲)流落至此,願仕${S.famName}家。`+
        `\n\n武勇 ${orphan.bu}・內政 ${orphan.nai}・智謀 ${orphan.chi}`+
        `\n支度金 ${ocost} 貫、年俸 ${14+ri(orphan.bu*0.1)} 石。`,
      choices:[
        {label:`收留(${ocost}貫)`, sub: activeR().length >= ROSTER_MAX ? '席次已滿——將列部屋住' : '入幕為客將', fn:()=>{
          if(S.money < ocost){ log('拿不出支度金,只得目送其遠去。','bad'); return; }
          S.money -= ocost;
          rosterAdd({name:orphan.name, role:'客將', kind:'浪人', age:orphan.age,
            bu:orphan.bu, nai:orphan.nai, chi:orphan.chi, apt:orphan.apt, wapt:orphan.wapt,
            task:'rest', merit:0, salary:14+ri(orphan.bu*0.1), loyalty:58, rank:1, stamina:100, trait:orphan.trait||null});
          log(`${orphan.name} 入幕${S.famName}家——亡家之臣,自此有了新的主君。`,'good');
        }},
        {label:'婉拒', sub:'他自會另尋去處', fn:()=>{
          const other = S.rivals.filter(x=>x.alive && x.men && x.men.length < manCap(x));
          if(other.length){ const t = pick1(other); t.men.push(orphan);
            log(`${orphan.name} 轉而出仕${fname(t)}。`); }
        }}
      ]});
  }
  const take = ri(f.koku*0.25);
  queueModal({
    title:`${fname(f)}滅亡`,
    body:`${fname(f)}${cause},所領無主,鄰家爭相搶佔。\n是否趁亂出兵接收一部分?`,
    choices:[
      {label:'出兵接收', sub:`石高 +${take},但國人眾對你警戒(全體關係 -8)`, fn:()=>{
        S.kokudaka += take;
        S.rivals.filter(x=>x.alive).forEach(x=>{ x.rel = clamp(x.rel-8,-100,100); });
        claimSeat(f, 0.5);
        log(`出兵接收${fname(f)}舊領 ${take} 石(石高 ${S.kokudaka})。`,'good');
      }},
      {label:'不趁人之危', sub:'威望 +2', fn:()=>{ S.prestige += 2; log(`你按兵不動,鄉里稱道${S.famName}家仁義。威望 +2。`); }}
    ]
  });
}
// 歲末:AI 家族模擬(成長/當主歿/私鬥/沒落/番付)
function simRivals(lines){
  // 被動成長已大幅調降——AI 現在主要靠 simRivalActions 的實際投資變強
  const GROWTH = {'武斷':0.016,'商業':0.020,'名門':0.006,'親今川':0.012,'保守':0.008,'中立':0.010,'門徒':0.010,'海賊':0.014};
  for(const f of S.rivals.filter(f=>f.alive)){
    let mult = 0.5 + Math.random();
    if(S.weather && S.weather.f < 0.9){
      mult *= 0.4;
      // 凶作米貴——商人與水軍趁勢囤售,饑年反而是他們的豐年(商人玩家也是這麼玩的)
      if(f.clanKind==='merchant' || f.clanKind==='suigun'){
        const spec = ri(f.koku * (f.clanKind==='merchant' ? 0.075 : 0.045));
        f.money += spec;
        if(spec > 25 && Math.random() < 0.5) lines.push(`${fname(f)}趁凶作米貴囤售射利,獲錢 ${spec} 貫——饑年正是商賈之秋。`);
      }
    }
    const era = S.year >= 1590 ? 1.4 : S.year >= 1570 ? 1.2 : 1;   // 亂世後期兼併加速
    f.koku = Math.min(rivalKokuCap(), Math.max(100, ri(f.koku * (1 + (GROWTH[f.persona]||0.02)*mult*era))));
    if(f.persona==='名門' && Math.random() < 0.5) f.prestige += 1;
    if(Math.random() < 0.06){
      if(Math.random() < 0.12){ collapseRival(f, '當主暴斃且無嗣', lines); continue; }
      f.prestige = Math.max(0, f.prestige - 3);
      lines.push(`${fname(f)}當主歿,其子繼立。`);
    }
  }
  // AI 之間私鬥(小衝突;真正的併吞戰走 simRivalPolitics 的風聞流程)
  // 升級:仇家優先(宿怨≥25先打誰);打到玩家從屬眾→請援事件,玩家可出兵/調停/坐視
  const fighters = S.rivals.filter(f=>f.alive);
  if(fighters.length >= 2 && Math.random() < 0.15){
    const budan = fighters.filter(f=>f.persona==='武斷');
    const agg = (budan.length && Math.random() < 0.6) ? budan[0] : fighters[Math.floor(Math.random()*fighters.length)];
    const targets = neighborsOf(agg).filter(f=> !(f.lord && f.lord === agg.lord)
      && !(agg.allies||[]).includes(f.id) && f.id !== agg.marrTo);           // 盟友姻親不相鬥;且須接壤
    if(targets.length){
      const sworn = targets.filter(f=> rGrudge(agg, f.id) >= 25);            // 有宿怨,先打仇家
      const tgt = sworn.length ? sworn.reduce((a,b)=> rGrudge(agg,a.id) >= rGrudge(agg,b.id) ? a : b)
                : targets[Math.floor(Math.random()*targets.length)];
      const skirmish = (aidTroops)=>{
        const pA = rSol(agg)*(1+(agg.fort||0)*0.1), pB = rSol(tgt)*(1+(tgt.fort||0)*0.28) + (aidTroops||0)*0.8;
        const [w,l] = (Math.random() < pA/(pA+pB)) ? [agg,tgt] : [tgt,agg];
        const take = ri(l.koku*0.08);
        w.koku += take; l.koku -= take;
        w.sol = Math.max(0, w.sol - ri(rSol(w)*0.08)); l.sol = Math.max(0, l.sol - ri(rSol(l)*0.15));
        addGrudge(l, w.id, 22); addGrudge(tgt, agg.id, 10);
        return {w, l, take};
      };
      if(tgt.lord === 'player' && !S.gameOver){
        // 從屬之家遭攻——來使請援(事件)
        queueModal({title:`⚡ 私戰——${fname(agg)}兵犯${fname(tgt)}`,
          body:`${fname(tgt)}來使泥首於庭:

「${fname(agg)}藉境相論之名,聚兵 ${rSol(agg)} 犯我${tgt.seat}!`+
            `${rGrudge(agg,tgt.id)>=25?'兩家宿怨已深,此番必欲甘休。':''}
乞主家發兵相救!」

`+
            `${fname(agg)} 兵 ${rSol(agg)}${agg.fort?`・城砦${agg.fort}級`:''}　${fname(tgt)} 兵 ${rSol(tgt)}${tgt.fort?`・城砦${tgt.fort}級`:''}(我方可援 ${S.soldiers} 兵)`,
          choices:[
            {label:'坐視——各家自掃門前雪', sub:`${fname(tgt)}關係與信心俱挫`, fn:()=>{
              tgt.rel = clamp(tgt.rel-8,-100,100);
              tgt.ltrust = clamp((tgt.ltrust!=null?tgt.ltrust:50)-6, 0, 100);
              const r2 = skirmish(0);
              log(`${fname(agg)}與${fname(tgt)}戰於境上,${fname(r2.w)}得勝,奪地 ${r2.take} 石。${fname(tgt)}寒心(關係 -8)。`, r2.w===tgt?'':'bad');
            }},
            {label:'出兵相助', sub:`合兵擊退來犯——${fname(tgt)}必感此恩(需兵≥30)`, fn:()=>{
              if(S.soldiers < 30){ log('兵備不足,徒呼負負——只得坐視。','bad'); const r0=skirmish(0); return; }
              const aid = ri(S.soldiers*0.6);
              const r2 = skirmish(aid);
              const myLoss = ri(S.soldiers * (r2.w===tgt ? 0.04 : 0.09));
              U_KEYS.forEach(k=>{ S.army[k] = Math.max(0, S.army[k] - ri(myLoss * (S.army[k]||0) / Math.max(1,S.soldiers))); });
              S.soldiers = armyTotal(S.army);
              if(r2.w === tgt){
                tgt.rel = clamp(tgt.rel+10,-100,100);
                tgt.ltrust = clamp((tgt.ltrust!=null?tgt.ltrust:50)+8, 0, 100);
                tgt.on = clamp((tgt.on||0)+12, 0, 100);
                addGrudge(agg, 'player', 18);
                log(`與${fname(tgt)}合兵,大破${fname(agg)}於境上!折兵 ${myLoss},然${fname(tgt)}感恩戴德(關係 +10・恩義 +12)。`,'good');
              }else{
                tgt.rel = clamp(tgt.rel+4,-100,100);
                addGrudge(agg, 'player', 12);
                log(`援軍不及,${fname(tgt)}仍失地 ${r2.take} 石——然共患難之誼已結(關係 +4),我折兵 ${myLoss}。`,'bad');
              }
            }},
            {label:'調停', sub:`以威望折衝樽俎(需威望≥50;成則兩家息兵)`, fn:()=>{
              if(S.prestige < 50){ log('人微言輕,兩家不聽——戰事照舊。','bad'); skirmish(0); return; }
              if(Math.random() < 0.75){
                tgt.rel = clamp(tgt.rel+5,-100,100);
                agg.rel = clamp(agg.rel+3,-100,100);
                S.prestige += 3;
                log(`一紙調停書往復,兩家陣前罷兵——${S.famName}家威望更著(+3)。`,'good');
              }else{
                S.prestige = Math.max(0, S.prestige-2);
                log(`調停不成,${fname(agg)}擲書於地——兵戈依舊(威望 -2)。`,'bad');
                skirmish(0);
              }
            }}
          ]});
      }else{
        const r2 = skirmish(0);
        lines.push(`${fname(agg)}與${fname(tgt)}私鬥,${fname(r2.w)}得勝,奪地 ${r2.take} 石。`);
      }
    }
  }
  // 家中喧嘩:自家從屬眾之間動了刀兵——喧嘩兩成敗是戰國之法度
  if(!S.gameOver && Math.random() < 0.05){
    const mine = myVassals();
    if(mine.length >= 2){
      const a = pick1(mine);
      const bs = mine.filter(x=> x!==a && rdist(a,x) <= NEIGHBOR_R);
      const b = bs.find(x=> rGrudge(a,x.id) >= 15) || (Math.random() < 0.4 ? pick1(bs.length?bs:[null]) : null);
      if(b){
        queueModal({title:`🔥 家中喧嘩——${fname(a)}與${fname(b)}械鬥`,
          body:`${a.seat}與${b.seat}之百姓爭水爭境,兩家遂各聚兵仗,械鬥於野——已有死傷。

`+
            `兩家皆我從屬。主家如何裁斷,眾目睽睽。`,
          choices:[
            {label:'喧嘩兩成敗', sub:'不問曲直,兩家同罰——家法立威(威望 +3,兩家關係小挫)', fn:()=>{
              [a,b].forEach(f=>{ f.koku = Math.max(100, f.koku - ri(f.koku*0.03)); f.rel = clamp(f.rel-4,-100,100); });
              addGrudge(a, b.id, -20); addGrudge(b, a.id, -20);
              S.prestige += 3;
              log(`依戰國法度,喧嘩兩成敗——兩家各罰知行,私怨就此打住。家中肅然(威望 +3)。`,'good');
            }},
            {label:`偏袒${fname(a)}`, sub:`${fname(a)}感恩,${fname(b)}銜恨`, fn:()=>{
              a.rel = clamp(a.rel+8,-100,100);
              b.rel = clamp(b.rel-12,-100,100); addGrudge(b, 'player', 12);
              log(`裁斷偏向${fname(a)}——${fname(b)}表面領命,私下銜恨(關係 -12)。`,'bad');
            }},
            {label:`偏袒${fname(b)}`, sub:`${fname(b)}感恩,${fname(a)}銜恨`, fn:()=>{
              b.rel = clamp(b.rel+8,-100,100);
              a.rel = clamp(a.rel-12,-100,100); addGrudge(a, 'player', 12);
              log(`裁斷偏向${fname(b)}——${fname(a)}表面領命,私下銜恨(關係 -12)。`,'bad');
            }},
            {label:'置之不問', sub:'任其自了——兩家皆疑主家之能', fn:()=>{
              [a,b].forEach(f=>{ f.ltrust = clamp((f.ltrust!=null?f.ltrust:50)-6, 0, 100); });
              addGrudge(a, b.id, 12); addGrudge(b, a.id, 12);
              log(`主家不問,兩家私怨愈深——從屬眾皆疑${S.famName}家御下之能(信心俱降)。`,'bad');
            }}
          ]});
      }
    }
  }
  // 未依附之眾的去就(選邊;三河人親近岡崎的松平/德川)
  if(S.lords && aliveLords().length){
    for(const f of S.rivals.filter(f=>f.alive && !f.lord && f.persona!=='門徒')){
      // 依外交性向擇主:慕名者投名門、慕強者投強兵、重利者投樂市之主——但只投兵鋒能及自家之國的大名
      const cands = aliveLords().filter(k=>k==='player' || lordReach(k).has(CLAN_PROV[f.id]))
        .map(k=>({k, a: lordAppeal(f, k) * (k==='tokugawa' ? 1.25 : 1)}));
      if(S.isDaimyo && playerPower() >= 40)
        cands.push({k:'player', a: playerPower() * (1 + playerAppeal(f)*2.2) * (f.rel > 0 ? 1.2 : 1)});
      let target = cands.length ? cands.reduce((x,y)=>y.a>=x.a?y:x).k : null;
      let p = 0.08;
      if(f.persona === '親今川' && S.lords.imagawa.alive !== false && lordReach('imagawa').has(CLAN_PROV[f.id])){ p = 0.25; target = 'imagawa'; }
      if(target && Math.random() < p){
        f.lord = target;
        lines.push(`${fname(f)}(${f.seat})臣從${LORD_META[target].name}家,${LORD_META[target].name}方國力更盛。`);
      }
    }
    // 寝返り:主家勢衰,樹倒猢猻散(自家從屬眾另行處理)
    for(const f of S.rivals.filter(f=>f.alive && f.lord && f.lord !== 'player')){
      if(S.lords[f.lord] && S.lords[f.lord].alive === false){ f.lord = null; continue; }
      const others = aliveLords().filter(k=>k!==f.lord && lordReach(k).has(CLAN_PROV[f.id]));
      if(!others.length) continue;
      const best = others.reduce((x,y)=>lordAppeal(f,x)>=lordAppeal(f,y)?x:y);
      if(lordAppeal(f, best) > lordAppeal(f, f.lord) * 1.6 && Math.random() < 0.08){
        f.lord = best;
        lines.push(`⚡ ${fname(f)} 見風轉舵,改仕${LORD_META[best].name}家!`);
      }
    }
  }
  // 沒落
  for(const f of S.rivals.filter(f=>f.alive)){
    if(f.koku < 150) collapseRival(f, '家勢衰微難以為繼', lines);
  }
  // 番付
  const rank = playerRank();
  if(rank === 1){
    S.prestige += 3;
    lines.push(`🏆 ${S.famName}家名列三河國人筆頭!威望 +3。`);
  }else{
    lines.push(`三河國人番付:${S.famName}家位居第 ${rank}(共 ${S.rivals.filter(f=>f.alive).length+1} 家)。`);
  }
}

// ---------- 兵種 ----------
const UNITS = {
  ashigaru:{name:'足輕', s:'槍', money:5,  rice:10, atk:1.0, def:1.0, rng:0, mor:1.0, num:1.0,
            hint:'長槍足輕。廉價的主力,槍衾可拒騎馬。'},
  yumi:    {name:'弓兵', s:'弓', money:12, rice:10, atk:0.9, def:0.8, rng:1, mor:0.95, num:0.7,
            hint:'遠戰先制,消耗敵陣;近身則弱。霧中減半。'},
  kiba:    {name:'騎馬', s:'騎', money:28, rice:15, atk:1.6, def:1.15,rng:0, mor:1.25, num:0.45,
            hint:'突擊與追擊之王,士氣高昂;懼槍衾。'},
  teppo:   {name:'鐵砲', s:'砲', money:60, rice:10, atk:1.35,def:0.7, rng:2, mor:0.9, num:0.3,
            hint:'火力冠絕天下,齊射可破任何陣;但雨天啞火、近身無力。'}
};
const U_KEYS = ['ashigaru','yumi','kiba','teppo'];
function counterMul(a, d){                        // a 兵種攻擊 d 兵種的相剋倍率
  if(a==='ashigaru' && d==='kiba') return 1.90;   // 槍衾拒馬(須大於騎馬 1.6 的基礎攻擊,否則相剋形同虛設)
  if(a==='kiba' && (d==='yumi'||d==='teppo')) return 1.45;  // 騎馬蹂躪射手
  if((a==='yumi'||a==='teppo') && d==='ashigaru') return 1.25;
  return 1;
}
function armyTotal(a){ a = a || S.army; return U_KEYS.reduce((s,k)=>s + (a[k]||0), 0); }
function aptSync(){ if(S && S.retainers) S.retainers.forEach(ensureApt); }
function armySync(){                              // 使編成總和 = S.soldiers(等比,餘數歸足輕)
  if(!S.army) S.army = {ashigaru:S.soldiers||0, yumi:0, kiba:0, teppo:0};
  const t = armyTotal(S.army), tgt = Math.max(0, ri(S.soldiers));
  if(t === tgt) return;
  if(t <= 0){ S.army = {ashigaru:tgt, yumi:0, kiba:0, teppo:0}; return; }
  const k = tgt / t;
  let acc = 0;
  for(const key of ['yumi','kiba','teppo']){ S.army[key] = Math.max(0, ri(S.army[key]*k)); acc += S.army[key]; }
  S.army.ashigaru = Math.max(0, tgt - acc);
  if(armyTotal(S.army) !== tgt) S.army.ashigaru = Math.max(0, tgt - (S.army.yumi+S.army.kiba+S.army.teppo));
}
function armyLabel(a){
  a = a || S.army;
  return U_KEYS.filter(k=>(a[k]||0)>0).map(k=>`${UNITS[k].s}${a[k]}`).join('・') || '—';
}
// 部隊戰力(依指令・天候・陣形調整)
// 城守適性:城牆只保護「守得住牆的兵」——狹間裡的鐵砲弓箭是屠殺,城內的騎馬只是下馬步卒
const GARRISON = {teppo:1.90, yumi:1.85, ashigaru:1.15, kiba:0.65};
// 攻城方的專屬指令(城下的節奏與野戰全然不同)
const SIEGE_CMDS = {
  suppress:{name:'鐵砲射掛け', desc:'壓制城頭:守方遠程大減、我方傷亡低;但推進有限'},
  shiyori: {name:'土塁・仕寄', desc:'逼近作業:此陣幾無戰果,但下一陣攀城傷亡減半、強攻更利'},
  assault: {name:'乘り崩し', desc:'全力強攻:推進最大——也血流成河'},
  hiya:    {name:'火矢',     desc:'放火:晴天易成、雨天無效;成則守方士氣大挫,城砦暫失一級之利'}
};
const cmdName = k => (CMDS[k] || SIEGE_CMDS[k] || {name: k === 'contest' ? '爭奪要地' : k}).name;
// side: 'def' = 據城而守者、'atk' = 仰攻者、null = 野戰
function unitWeight(k, cmd, ctx, side){
  const u = UNITS[k];
  let w = u.atk;
  if(cmd==='volley') w = u.rng>0 ? u.atk*(k==='teppo'?2.1:1.6) : u.atk*0.40;
  else if(cmd==='charge') w = u.rng>0 ? u.atk*0.5 : u.atk*1.5;
  else if(cmd==='hold') w = u.atk*0.64;
  else if(cmd==='flank') w = u.rng>0 ? u.atk*0.75 : u.atk*1.2;   // 迂迴是近戰的活;遠程部隊跟不上
  // ── 攻城方的四種寄せ手 ──
  else if(cmd==='suppress') w = u.rng>0 ? u.atk*(k==='teppo'?1.9:1.5) : u.atk*0.30;
  else if(cmd==='shiyori')  w = u.atk*0.25;
  else if(cmd==='assault')  w = u.rng>0 ? u.atk*0.40 : u.atk*1.60;
  else if(cmd==='hiya')     w = u.rng>0 ? u.atk*0.85 : u.atk*0.45;
  if(k==='teppo' && ctx.weather==='rain') w *= 0.15;
  if(u.rng>0 && ctx.weather==='fog') w *= 0.5;
  if(ctx.terrain==='mountain' && k==='kiba') w *= 0.6;
  if(ctx.terrain==='plain' && k==='kiba') w *= 1.1;
  // ① 據城而守:依兵種給守城適性(原本是全軍一律的加成,騎兵守城與弓兵一樣強)
  if(side === 'def') w *= GARRISON[k] || 1;
  // ③ 仰攻:對著石垣與塀放箭,遠不如對野戰陣列
  if(side === 'atk' && u.rng > 0) w *= 0.55;
  return w;
}
function armyStrength(a, cmd, ctx, foeArmy, side){
  let s = 0;
  const foeTot = armyTotal(foeArmy) || 1;
  for(const k of U_KEYS){
    const n = a[k]||0; if(!n) continue;
    let cm = 0;
    for(const d of U_KEYS) cm += (foeArmy[d]||0)/foeTot * counterMul(k, d);
    s += n * unitWeight(k, cmd, ctx, side) * cm;
  }
  return s;
}

const FORMATIONS = {
  gyorin:  {name:'魚鱗', desc:'錐形突破——突擊 +50%、受損 +12%;側背薄弱(敵迂迴傷害倍增)',
            charge:1.50, flankVuln:1.6, dmgTaken:1.12},

            flank:0.32, encircle:true, chargeVuln:1.20},
  hoen:    {name:'方圓', desc:'全周防禦——受損 -32%,但攻擊 -26%(打不死人)',
            dmgTaken:0.68, atkMul:0.74},
  gankou:  {name:'雁行', desc:'梯次射擊——遠戰 +55%;然橫隊薄弱,敵突擊時受損 +25%',
            volley:1.55, chargeVuln:1.25}

  charge:{name:'突擊',      desc:'騎馬・足輕猛攻,傷敵亦自傷'},

function pickWeather(){ const r = Math.random(); return r < 0.62 ? 'clear' : r < 0.85 ? 'rain' : 'fog'; }
// ---------- 俯瞰戰場圖(兵種佈陣模擬) ----------
const U_DOT = {ashigaru:'#3a2f24', yumi:'#44603a', kiba:'#8a5f1e', teppo:'#7a2c1e'};
function formationSlots(form, n){   // 產生 n 個陣位(前=+x 朝敵),依陣形排布
  const s = [], SP = 7;
  if(form === 'gyorin'){            // 魚鱗:錐形突前
    let r = 0;
    while(s.length < n){
      for(let i=0; i<=r && s.length<n; i++) s.push({x:-r*SP*0.9, y:(i-r/2)*SP});
      r++;
    }
  }else if(form === 'kakuyoku'){    // 鶴翼:雙翼前張(翼過長則增列,不溢出)
    let k = 0;
    while(s.length < n){
      if(k < 4){ s.push({x:-12-(k%2)*SP, y:(Math.floor(k/2)-0.5)*SP}); }   // 本陣
      else{
        const w = Math.floor((k-4)/2), side = (k%2) ? 1 : -1;
        const col = Math.floor(w/9), row = w%9;
        s.push({x: Math.min(16, row*1.9) - 4 - col*SP*1.1, y: side*(9 + row*6.2)});
      }
      k++;
    }
  }else if(form === 'hoen'){        // 方圓:同心環
    s.push({x:0, y:0});
    let ring = 1;
    while(s.length < n){
      const cap = 6*ring;
      for(let i=0; i<cap && s.length<n; i++){
        const a = (i/cap)*Math.PI*2;
        s.push({x:Math.cos(a)*ring*SP*1.15, y:Math.sin(a)*ring*SP*1.15});
      }
      ring++;
    }
  }else if(form === 'gankou'){      // 雁行:斜行梯次
    let k = 0;
    while(s.length < n){
      const line = Math.floor(k/6), p = k%6;
      s.push({x:-p*4 - line*SP*1.3, y:(p-2.5)*SP*1.15 + line*3});
      k++;
    }
  }else{                            // 橫陣(預設/敵方)
    let k = 0;
    while(s.length < n){
      const col = Math.floor(k/6);
      s.push({x:-col*SP*1.1, y:((k%6)-2.5)*SP*1.15});
      k++;
    }
  }
  return s;
}
function drawFormation(c, army, form, cx, cy, dir, isFoe){
  const total = armyTotal(army);
  if(total <= 0) return;
  const scale = total > 480 ? 20 : total > 240 ? 10 : 5;   // 一點≈幾人
  const dots = [];
  // 佈陣序:槍前衛→騎兩翼→弓→砲殿後
  for(const k of ['ashigaru','kiba','yumi','teppo']){
    const cnt = Math.max((army[k]||0) > 0 ? 1 : 0, ri((army[k]||0)/scale));
    for(let i=0;i<cnt;i++) dots.push(k);
  }
  const slots = formationSlots(form, dots.length);
  dots.forEach((k, i)=>{
    const p = slots[i] || slots[slots.length-1];
    const x = cx + p.x*dir, y = cy + p.y;
    c.fillStyle = U_DOT[k];
    if(k === 'kiba'){ c.beginPath(); c.moveTo(x,y-3.4); c.lineTo(x+3.2,y+2.6); c.lineTo(x-3.2,y+2.6); c.closePath(); c.fill(); }
    else if(k === 'teppo'){ c.fillRect(x-2.6,y-2.6,5.2,5.2); c.fillStyle='#e8c87a'; c.fillRect(x-1,y-1,2,2); }
    else if(k === 'yumi'){ c.beginPath(); c.arc(x,y,2.6,0,7); c.fill(); }
    else c.fillRect(x-2.4,y-2.4,4.8,4.8);
    if(isFoe){ c.strokeStyle='rgba(140,40,30,.55)'; c.lineWidth=0.8;
      if(k==='yumi'){ c.beginPath(); c.arc(x,y,2.6,0,7); c.stroke(); } else c.strokeRect(x-2.6,y-2.6,5.2,5.2); }
  });
  return scale;
}
function battlefieldImg(){
  if(!BT) return '';
  const W = 460, H = 168;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const terr = BT.ctx.terrain, wx = BT.ctx.weather;
  // 地表
  c.fillStyle = terr==='mountain' ? '#d8cfae' : '#e3dabd';
  c.fillRect(0,0,W,H);
  if(terr === 'river'){    // 隔川對陣
    c.fillStyle = 'rgba(114,156,178,.45)';
    c.beginPath(); c.moveTo(W/2-14,0); c.quadraticCurveTo(W/2+6,H/2,W/2-10,H);
    c.lineTo(W/2+10,H); c.quadraticCurveTo(W/2+26,H/2,W/2+6,0); c.closePath(); c.fill();
  }
  if(terr === 'mountain'){
    c.strokeStyle = 'rgba(80,70,48,.3)'; c.lineWidth = 1.4;
    [[60,26],[380,30],[236,20],[110,150],[350,148]].forEach(p=>{
      c.beginPath(); c.moveTo(p[0]-9,p[1]); c.lineTo(p[0],p[1]-11); c.lineTo(p[0]+9,p[1]); c.stroke(); });
  }else{
    c.strokeStyle = 'rgba(120,110,70,.25)'; c.lineWidth = 1;
    for(let i=0;i<14;i++){ const gx=30+i*31, gy=18+(i*53)%132;
      c.beginPath(); c.moveTo(gx,gy); c.lineTo(gx+5,gy-4); c.stroke(); }
  }
  if(BT.ctx.siege || BT.ctx.defend){   // 城郭(守方側)
    const sx = BT.ctx.defend ? 116 : W-116;
    c.strokeStyle = '#6a5a3e'; c.lineWidth = 2.5;
    c.strokeRect(sx-52, H/2-56, 104, 112);
    c.fillStyle = '#3a2f24';
    c.fillRect(sx-7, H/2-64, 14, 9);
    c.beginPath(); c.moveTo(sx-11,H/2-64); c.lineTo(sx,H/2-74); c.lineTo(sx+11,H/2-64); c.closePath(); c.fill();
  }
  // 戰場要地(P1):渡口/高地/隘口畫在戰場中央,旗色示持有方
  if(BT.feat){
    const FT = BT.feat, fx = W/2, fy = FT.kind==='hill' ? H/2 - 34 : H/2;
    if(FT.kind === 'hill'){                 // 高地:等高線
      c.strokeStyle = 'rgba(120,100,60,.55)'; c.lineWidth = 1.2;
      for(let rr=22; rr>=8; rr-=7){ c.beginPath(); c.ellipse(fx, fy, rr*1.5, rr*0.8, 0, 0, 7); c.stroke(); }
    }else if(FT.kind === 'ford'){           // 渡口:川中淺灘石
      c.fillStyle = 'rgba(216,207,168,.95)';
      c.beginPath(); c.ellipse(fx-2, fy, 13, 8, 0.2, 0, 7); c.fill();
      c.fillStyle = 'rgba(150,140,110,.8)';
      [[-8,-3],[0,2],[8,-2],[3,-6],[-3,5]].forEach(p=>{ c.beginPath(); c.arc(fx+p[0], fy+p[1], 2.2, 0, 7); c.fill(); });
    }else{                                  // 隘口:兩山夾道
      c.fillStyle = 'rgba(100,85,55,.5)';
      c.beginPath(); c.moveTo(fx-26, fy-30); c.lineTo(fx-6, fy-8); c.lineTo(fx-26, fy+8); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(fx+26, fy-8); c.lineTo(fx+6, fy+8); c.lineTo(fx+26, fy+30); c.closePath(); c.fill();
    }
    // 持有旗
    c.strokeStyle = '#4a3a26'; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(fx, fy-6); c.lineTo(fx, fy-26); c.stroke();
    c.fillStyle = FT.holder === 'my' ? '#a63c2e' : FT.holder === 'foe' ? '#5a4a6a' : 'rgba(150,140,120,.7)';
    c.beginPath(); c.moveTo(fx, fy-26); c.lineTo(fx+11, fy-21.5); c.lineTo(fx, fy-17); c.closePath(); c.fill();
    c.fillStyle = 'rgba(58,47,36,.85)';
    c.font = 'bold 10px "Noto Serif TC","PMingLiU",serif';
    c.fillText(FT.name, fx-10, fy+22);
  }
  // 戰歿之痕:兩軍之間的✕,是倒下的人(累積戰損越重,痕越密)
  {
    const fallen = (BT.fallenMy||0) + (BT.fallenFoe||0);
    const marks = Math.min(26, Math.floor(fallen / 8));
    c.strokeStyle = 'rgba(96,80,60,.5)'; c.lineWidth = 1.1;
    for(let i=0; i<marks; i++){
      const mx = W/2 - 44 + ((i*67)%92), my2 = 30 + ((i*41)%(H-56));
      c.beginPath(); c.moveTo(mx-2.6,my2-2.6); c.lineTo(mx+2.6,my2+2.6);
      c.moveTo(mx+2.6,my2-2.6); c.lineTo(mx-2.6,my2+2.6); c.stroke();
    }
  }
  // 兩軍
  const foeForm = BT.foeForm || 'line';
  const scale = drawFormation(c, BT.my, BT.form || 'line', 118, H/2, 1, false);
  drawFormation(c, BT.foe, foeForm, W-118, H/2, -1, true);
  // 指令視覺化:上一陣的號令在戰場上留下形跡
  const lastMy = BT.myCmds && BT.myCmds.length ? BT.myCmds[BT.myCmds.length-1] : null;
  const drawCmd = (cmd, fromX, dir)=>{
    if(!cmd) return;
    if(cmd === 'volley' || cmd === 'suppress'){          // 箭雨・銃聲:拋物線飛向敵陣
      c.strokeStyle = 'rgba(90,70,40,.65)'; c.lineWidth = 1;
      for(let i=0;i<4;i++){
        const y0 = H/2 - 24 + i*16;
        c.beginPath(); c.moveTo(fromX + dir*30, y0);
        c.quadraticCurveTo(fromX + dir*95, y0 - 26, fromX + dir*165, y0 + 4); c.stroke();
        const tx = fromX + dir*165, ty = y0 + 4;
        c.beginPath(); c.moveTo(tx, ty); c.lineTo(tx - dir*5, ty - 3); c.moveTo(tx, ty); c.lineTo(tx - dir*4, ty + 4); c.stroke();
      }
      c.fillStyle = 'rgba(210,205,190,.55)';             // 硝煙
      for(let i=0;i<3;i++){ c.beginPath(); c.arc(fromX + dir*(34+i*7), H/2 - 30 + i*26, 4.5+i, 0, 7); c.fill(); }
    }else if(cmd === 'charge' || cmd === 'assault'){     // 突擊:三道衝鋒軌跡
      c.strokeStyle = 'rgba(140,60,40,.7)'; c.lineWidth = 2;
      for(let i=0;i<3;i++){
        const y0 = H/2 - 22 + i*22, x1 = fromX + dir*118;
        c.beginPath(); c.moveTo(fromX + dir*26, y0); c.lineTo(x1, y0); c.stroke();
        c.beginPath(); c.moveTo(x1, y0); c.lineTo(x1 - dir*8, y0 - 5); c.lineTo(x1 - dir*8, y0 + 5); c.closePath();
        c.fillStyle = 'rgba(140,60,40,.7)'; c.fill();
      }
    }else if(cmd === 'hold'){                            // 固守:陣前盾弧
      c.strokeStyle = 'rgba(70,90,120,.8)'; c.lineWidth = 2.5;
      c.beginPath(); c.arc(fromX + dir*6, H/2, 52, dir>0 ? -0.9 : Math.PI-0.9, dir>0 ? 0.9 : Math.PI+0.9); c.stroke();
    }else if(cmd === 'flank'){                           // 迂迴:繞背虛線
      c.strokeStyle = 'rgba(90,60,110,.75)'; c.lineWidth = 1.6; c.setLineDash([5,4]);
      c.beginPath(); c.moveTo(fromX, H/2 - 46);
      c.quadraticCurveTo(fromX + dir*110, 4, fromX + dir*196, H/2 - 40); c.stroke();
      c.setLineDash([]);
      const tx = fromX + dir*196, ty = H/2 - 40;
      c.fillStyle = 'rgba(90,60,110,.75)';
      c.beginPath(); c.moveTo(tx, ty); c.lineTo(tx - dir*7, ty - 6); c.lineTo(tx - dir*2, ty - 9); c.closePath(); c.fill();
    }else if(cmd === 'hiya'){                            // 火矢:赤紅弧線
      c.strokeStyle = 'rgba(190,90,40,.8)'; c.lineWidth = 1.4;
      for(let i=0;i<3;i++){
        const y0 = H/2 - 18 + i*18;
        c.beginPath(); c.moveTo(fromX + dir*30, y0);
        c.quadraticCurveTo(fromX + dir*95, y0 - 34, fromX + dir*160, y0); c.stroke();
        c.fillStyle = 'rgba(220,120,50,.8)';
        c.beginPath(); c.arc(fromX + dir*160, y0, 2.6, 0, 7); c.fill();
      }
    }
  };
  drawCmd(lastMy, 118, 1);
  drawCmd(BT.lastFoeCmd, W-118, -1);
  // 軍旗
  const flag = (x, isFoe)=>{
    c.strokeStyle = '#4a3a26'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x, H/2-52); c.lineTo(x, H/2-24); c.stroke();
    c.fillStyle = isFoe ? '#8a3a2e' : '#f6efdd';
    c.fillRect(x, H/2-52, 13, 18);
    c.strokeStyle = 'rgba(74,58,38,.6)'; c.lineWidth = 0.8; c.strokeRect(x, H/2-52, 13, 18);
    if(!isFoe){ try{ KAMON[S.kamon||0].draw(c, x+6.5, H/2-43, 5.5, '#7d2f24', '#f6efdd'); }catch(e){} }
  };
  flag(52, false); flag(W-64, true);
  // 士氣條(軍旗之下)與上一陣號令名
  const morBar = (x, mor, isFoe)=>{
    c.fillStyle = 'rgba(58,47,36,.25)'; c.fillRect(x, H/2-18, 40, 4);
    c.fillStyle = mor > 70 ? '#4a7a3a' : mor > 35 ? '#b8862e' : '#a63c2e';
    c.fillRect(x, H/2-18, clamp(mor/140,0,1)*40, 4);
    c.fillStyle = 'rgba(58,47,36,.8)';
    c.font = '9px "Noto Serif TC","PMingLiU",serif';
    const cmd = isFoe ? BT.lastFoeCmd : (BT.myCmds && BT.myCmds[BT.myCmds.length-1]);
    if(cmd) c.fillText(`令:${cmdName(cmd)}`, x, H/2-24);
  };
  morBar(46, BT.myMor, false); morBar(W-92, BT.foeMor, true);
  // 天候
  if(wx === 'rain'){
    c.strokeStyle = 'rgba(110,140,170,.5)'; c.lineWidth = 1;
    for(let i=0;i<46;i++){ const rx=(i*37)%W, ry=(i*61)%H;
      c.beginPath(); c.moveTo(rx,ry); c.lineTo(rx-4,ry+9); c.stroke(); }
  }else if(wx === 'fog'){
    c.fillStyle = 'rgba(240,238,230,.45)';
    for(let i=0;i<5;i++) c.fillRect(0, 12+i*34, W, 14);
  }
  // 圖例
  c.fillStyle = 'rgba(58,47,36,.75)';
  c.font = '10px "Noto Serif TC","PMingLiU",serif';
  c.fillText(`■槍 ●弓 ▲騎 ▣砲　一點≈${scale||5}人`, 8, H-7);
  c.fillText('我軍', 40, 24); c.fillText('敵軍', W-64, 24);
  return `<img class="bfield" src="${cv.toDataURL()}">`;
}
// 戰況 HUD(兵種徽章+士氣條+回合點)
function battleHud(){
  if(!BT) return '';
  const chips = a => U_KEYS.filter(k=>(a[k]||0)>0).map(k=>`<span class="uc uc-${k}">${UNITS[k].s}<b>${a[k]}</b></span>`).join('') || '<span class="uc">—</span>';
  const bar = (v,cls) => `<div class="mbar"><div class="mfill ${cls}" style="width:${clamp(v/140*100,0,100)}%"></div></div>`;
  const pips = Array.from({length:5},(_,i)=>`<span class="pip${i<BT.round?' on':''}"></span>`).join('');
  const wIco = {clear:'☀', rain:'☔', fog:'🌫'}[BT.ctx.weather] || '';
  return battlefieldImg() + `<div class="bhud">
    <div class="bside"><div class="bname">我軍 ${armyTotal(BT.my)}</div>${chips(BT.my)}${bar(BT.myMor,'my')}<div class="bmor">士氣 ${ri(BT.myMor)}</div></div>
    <div class="bmid"><div class="bvs">対</div><div class="bmeta">${wIco}${WEATHERS[BT.ctx.weather]}<br>${TERRAINS[BT.ctx.terrain]}</div><div class="bpips">${pips}</div>${BT.form?`<div class="bform">${FORMATIONS[BT.form].name}</div>`:''}</div>
    <div class="bside foe"><div class="bname">敵軍 ${armyTotal(BT.foe)}</div>${chips(BT.foe)}${BT.special && BT.special.n > 0 ? `<span class="uc" style="background:#5a2a52">${SPECIALS[BT.special.kind].s}<b>${BT.special.n}</b></span>` : ''}${bar(BT.foeMor,'foe')}<div class="bmor">士氣 ${ri(BT.foeMor)}</div></div>
  </div>`;
}
function gunshi(){   // 軍師:智謀最高且未臥病者
  const c = activeR().filter(r=>(r.sick||0)===0);
  return c.length ? c.reduce((a,b)=>a.chi>=b.chi?a:b) : (S.retainers[0] || topBu());
}
function avgLoyalty(){
  const v = activeR().slice(1);
  return v.length ? v.reduce((a,r)=>a+(r.loyalty??70),0)/v.length : 80;
}
function armyLose(a, rate, ctx, foeArmy){   // 依相剋分配損失:被剋者死得多
  const foeTot = armyTotal(foeArmy) || 1;
  let lost = 0;
  for(const k of U_KEYS){
    const n = a[k]||0; if(!n) continue;
    let vuln = 0;
    for(const d of U_KEYS) vuln += (foeArmy[d]||0)/foeTot * counterMul(d, k);
    const l = Math.min(n, ri(n * rate * vuln));
    a[k] = n - l; lost += l;
  }
  return lost;
}
// 開戰士氣:大將武勇為主、士卒忠誠為輔(敵我同一套公式)
function baseMorale(bu, loyal, extra){
  return clamp(52 + (bu||40)*0.45 + (loyal ?? 75)*0.16 + (extra||0), 30, 130);
}
function startBattle(cfg){
  if(BT){   // 同季兩場戰事:後者不可覆寫前者的戰場狀態
    log(`${cfg.title}——然一戰未了,無暇分身,此役暫且擱下。`,'bad');
    return;
  }
  armySync(); aptSync();
  const t = ensureApt(cfg.taisho || taisho()), g = gunshi();
  if(cfg.foe && cfg.foe.general) ensureApt(cfg.foe.general);   // 敵將亦有專精,不再是玩家獨享的加成
  const sent = cfg.sent || {...S.army};
  BT = {
    cfg, taisho:t, gunshi:g,
    my: {...sent}, foe: {...cfg.foe.army},
    myInit: armyTotal(sent), foeInit: armyTotal(cfg.foe.army),
    myMor: baseMorale(t.bu, avgLoyalty(), meiboMor() + (t.trait==='gouyuu'?10:0) + (S.clanType==='temple'?8:0)),
    // 敵方士氣過去是寫死的 80,而我方由武勇/忠誠/威望算出約 98——對等條件下我方幾乎必勝。
    // 改為同一套公式,呼叫端傳入的 morale 只作為該敵的士氣加減(以 80 為基準)。
    foeMor: baseMorale(cfg.foe.general?.bu ?? 55, 75, (cfg.foe.morale ?? 80) - 80),
    ctx: {weather: cfg.weather || pickWeather(), terrain: cfg.terrain || 'plain', siege: !!cfg.isSiege, defend: !!cfg.defendSiege, fort: cfg.foe.fort||0},
    round: 0, form: null, hist: [], shiyori: 0, digs: 0, foeReady: 0, foeDigs: 0,
    myCmds: [], intel: cfg.intel || null,      // 敵之物見:對我軍的了解(③軍事適應)
    feat: null,                                // 戰場要地(渡口/高地/隘口)——P1 戰場特徵卡
    fired: false, assaulted: false, foeAssaulted: false,
    special: cfg.foe.special ? {...cfg.foe.special} : null
  };
  { // 敵方佈陣(依編成推定,整場固定)
    const fa = BT.foe, ft = armyTotal(fa) || 1;
    const rng = ((fa.yumi||0)+(fa.teppo||0))/ft, kb = (fa.kiba||0)/ft;
    BT.foeForm = cfg.isSiege ? 'hoen' : rng > 0.35 ? 'gankou' : kb > 0.25 ? 'gyorin' : 'line';
  }
  { // 戰場要地(P1):野戰的地形不再只是係數——渡口/高地/隘口是可爭奪的實體
    if(!BT.ctx.siege && !BT.ctx.defend){
      const terr = BT.ctx.terrain;
      const spec = terr === 'river'    ? {kind:'ford',   name:'渡口', desc:'扼渡而守,敵須涉水仰攻(敵戰力 -20%)'}
                 : terr === 'mountain' ? {kind:'defile', name:'隘口', desc:'一夫當關——占者受創 -22%'}
                 : (Math.random() < 0.65 ? {kind:'hill', name:'高地', desc:'居高臨下——戰力 +15%、每陣士氣 +3'} : null);
      if(spec) BT.feat = {...spec, holder: Math.random() < 0.45 ? 'foe' : null};   // 守方常先據要地
    }
  }
  queueModal({
    title:`⚔ ${cfg.title}`,
    hud: battleHud(),
    body:`${cfg.intro || ''}\n\n【戰場】${TERRAINS[BT.ctx.terrain]}・${WEATHERS[BT.ctx.weather]}`+
      `${BT.ctx.weather==='rain'?'(鐵砲難以擊發)':BT.ctx.weather==='fog'?'(遠程視界不良)':''}`+
      `${BT.feat ? `\n⚑【要地】${BT.feat.name}——${BT.feat.desc}${BT.feat.holder==='foe'?';敵已先據!':';現無人據守'}` : ''}`+
      `${cfg.isSiege?`\n【攻城】敵城砦 ${BT.ctx.fort} 級——守方大幅有利`:''}`+
      `${cfg.defendSiege?`\n【籠城】我方城砦 ${S.fort||0} 級——據城而守,以寡敵眾`:''}\n\n`+
      `我軍 ${BT.myInit}(${armyLabel(BT.my)})\n`+
      `大將 ${t.name}(武${t.bu}・${aptLabel(t)})　適性補正 ×${aptMul(t, BT.my).toFixed(2)}\n`+
      `軍師 ${g.name}(智${g.chi})\n`+
      (BT.special ? `⚠ 敵中另有【${SPECIALS[BT.special.kind].name}】${BT.special.n} 眾——${SPECIALS[BT.special.kind].desc}` + String.fromCharCode(10) : '')+
      `敵軍 ${BT.foeInit}(${armyLabel(BT.foe)})\n\n請下令布陣:`,
    choices: Object.keys(FORMATIONS).map(k=>({
      label: FORMATIONS[k].name, sub: FORMATIONS[k].desc,
      fn: ()=>{ BT.form = k; battleRound(); }
    }))
  });
  pumpModal();
}
function foeCommand(){
  // 敵軍正在攻我之城:牠也懂得「先壓制・再仕寄・後登城」的次第,不會傻傻硬衝
  if(BT.ctx.defend){
    if(BT.foeDigs === undefined) BT.foeDigs = 0;
    if(BT.foeReady > 0) return 'assault';                       // 仕寄既成,即刻登城
    if(BT.round === 1) return (BT.ctx.weather !== 'rain' && Math.random() < 0.3) ? 'hiya' : 'suppress';
    if(BT.round === 2 && BT.foeDigs < 2){ BT.foeDigs++; return 'shiyori'; }
    return Math.random() < 0.15 ? 'suppress' : 'assault';       // 之後以登城為主
  }
  const f = BT.foe, tot = armyTotal(f) || 1;
  const rng = ((f.yumi||0)+(f.teppo||0))/tot, kb = (f.kiba||0)/tot;
  // ── 戰場要地:敵將也懂先據形勝(無主搶占 40%、奪回我占 22%) ──
  if(BT.feat && !BT.ctx.siege && !BT.ctx.defend && BT.feat.holder !== 'foe'
     && Math.random() < (BT.feat.holder === 'my' ? 0.22 : 0.4)) return 'contest';
  // ── 敵之物見(③):交手數陣的對手研究過你 ──
  const IT = BT.intel;
  BT.adaptedNow = false;
  const CTR = {charge:'hold', volley:'charge', hold:'flank', flank:'charge'};
  if(IT && (IT.n||0) >= 3 && BT.myCmds.length >= 2 && !BT.cfg.isSiege){
    const l2 = BT.myCmds.slice(-2);
    if(l2[0] === l2[1] && Math.random() < 0.6 && CTR[l2[1]]){
      BT.adaptedNow = true; return CTR[l2[1]];   // 一招用老,必遭反制
    }
  }
  // 宿敵(交手五陣以上):看你一招便知下一招
  if(IT && (IT.n||0) >= 4 && BT.myCmds.length >= 1 && !BT.cfg.isSiege){
    const last = BT.myCmds[BT.myCmds.length-1];
    if(Math.random() < 0.45 && CTR[last]){ BT.adaptedNow = true; return CTR[last]; }
  }
  if(IT && (IT.n||0) >= 2 && (IT.kibaP||0) >= 0.28 && BT.round === 1 && !BT.cfg.isSiege){
    BT.adaptedNow = true; return 'hold';   // 素知我多騎馬,首陣結槍衾自守
  }
  if(BT.cfg.isSiege) return Math.random()<0.6 ? 'hold' : 'volley';       // 守城方多固守
  if(rng > 0.35 && BT.ctx.weather === 'clear' && Math.random()<0.7) return 'volley';
  if(kb > 0.25 && Math.random()<0.6) return 'charge';
  if(BT.foeMor < 45) return 'hold';
  return Math.random()<0.5 ? 'charge' : 'hold';
}
function battleRound(){
  if(!BT || !BT.form) return;
  BT.round += 1;
  const F = FORMATIONS[BT.form];
  const c = BT.ctx;
  queueModal({
    title:`${BT.cfg.title} — 第 ${BT.round}/5 陣`,
    hud: battleHud(),
    body:`${c.siege?`敵城 ${c.fort} 級${BT.fired?'(櫓塀已焚,暫失一級)':''}・`:''}${c.defend?`我城 ${S.fort||0} 級・`:''}`+
      (BT.hist.length ? BT.hist[BT.hist.length-1] : (c.siege ? '城下佈陣既定,寄せ手待命。' : '兩軍對峙,殺氣瀰漫。')) +
      (c.siege && BT.shiyori > 0 ? `

⚑ 仕寄已成——此陣「乘り崩し」戰力 +30%、傷亡減半。` : '') +
      (BT.feat ? `

⚑ ${BT.feat.name}:${BT.feat.holder==='my'?`我方扼守(${BT.feat.desc})`:BT.feat.holder==='foe'?`敵方據之!(${BT.feat.desc})`:'無人據守——先到先得'}` : '') +
      `

下令:`,
    // 攻城與野戰是兩種節奏:仰攻者用寄せ手の四手
    choices: Object.keys(c.siege ? SIEGE_CMDS : CMDS).map(k=>{
      const D = (c.siege ? SIEGE_CMDS : CMDS)[k];
      return { label: D.name, sub: D.desc, fn: ()=>{ resolveRound(k); } };
    }).concat(BT.feat && BT.feat.holder !== 'my' ? [{
      label:`⚑ 爭奪${BT.feat.name}`,
      sub:`分兵搶占(無主之地僅費 -8%,奪敵據之地 -20%);得手則${BT.feat.desc}${BT.feat.holder==='foe'?';敵據守中,勝算較低':''}`,
      fn: ()=>{ resolveRound('contest'); }
    }] : [])
  });
  pumpModal();
}
function resolveRound(myCmd){
  if(!BT || !BT.form) return;          // 殘留視窗的按鈕:此戰場已不存在
  const F = FORMATIONS[BT.form], c = BT.ctx, t = BT.taisho, g = BT.gunshi;
  const foeCmd = foeCommand();          // 敵依「至上一陣為止」的觀察下令,不能未卜先知
  BT.myCmds.push(myCmd);
  // 攻守之別:據城者 'def'、仰攻者 'atk'(決定城守適性與遠程減效)
  const mySide  = c.siege ? 'atk' : c.defend ? 'def' : null;
  const foeSide = c.siege ? 'def' : c.defend ? 'atk' : null;
  const fortLv  = c.siege ? c.fort : c.defend ? (S.fort||0) : 0;
  const effFort = Math.max(0, fortLv - (BT.fired ? 1 : 0));    // 火矢燒毀櫓塀,城砦暫失一級之利
  let myS = armyStrength(BT.my, myCmd, c, BT.foe, mySide) * (1 + t.bu/160) * aptMul(t, BT.my);
  const fg = BT.cfg.foe.general;
  let foeS = armyStrength(BT.foe, foeCmd, c, BT.my, foeSide) * (1 + (fg?.bu||40)/160) * (fg ? aptMul(fg, BT.foe) : 1);
  const SP = (BT.special && BT.special.n > 0) ? BT.special : null;
  if(SP && SP.kind === 'sohei' && (foeCmd === 'charge' || foeCmd === 'hold')) foeS *= 1.12;   // 僧兵白刃尤悍
  // 陣形
  if(myCmd==='charge' && F.charge) myS *= F.charge;
  if(myCmd==='volley' && F.volley) myS *= F.volley;
  if(F.atkMul) myS *= F.atkMul;
  // 城砦本身的守勢(兵種適性已在 unitWeight 處理,此處只算工事之利)
  if(c.siege)  foeS *= 1 + effFort*0.19 + 0.28;
  if(c.defend) myS  *= 1 + effFort*0.19 + 0.28;
  if(S.intel > 0) myS *= 1.10;                    // 料敵先機(購得情報)
  // 士氣影響發揮
  myS *= clamp(0.55 + BT.myMor/150, 0.5, 1.3);
  foeS *= clamp(0.55 + BT.foeMor/150, 0.5, 1.3);
  let note = '', morMy = 0, morFoe = 0;
  let atkPenalty = 1, defShelter = 1;
  // ── ② 攀城之血:與戰力無關的額外損耗(渡壕、扛雲梯、破城門本身就要死人) ──
  if(c.siege){  atkPenalty = 1 + 0.13*effFort; defShelter = 0.74; }
  if(c.defend){ defShelter = 1 + 0.13*effFort; atkPenalty = 0.74; }   // 我方籠城:角色對調
  // ── ④ 寄せ手の手(攻城方專屬) ──
  if(c.siege){
    if(myCmd === 'suppress'){
      foeS *= 0.76; atkPenalty *= 0.72; morFoe -= 4;
      note = '鐵砲隊列於竹束之後,連番射掛——城頭一時不敢抬首。';
    }else if(myCmd === 'shiyori'){
      BT.digs = (BT.digs||0) + 1;
      if(BT.digs <= 2){
        atkPenalty *= 0.70; BT.shiyori = 2; morMy += 3;
        note = '士卒冒矢石掘土運柴,仕寄逼近至塀下——今日不戰,明日好攻。';
      }else{
        atkPenalty *= 0.85; morMy -= 8;
        note = '土塁早已築成,再掘無益;兵久暴於城下,軍中怨言漸起。';
      }
    }else if(myCmd === 'assault'){
      BT.assaulted = true;
      const ready = BT.shiyori > 0;
      myS *= ready ? 1.22 : 1.0;
      atkPenalty *= ready ? 0.88 : 1.55;
      morFoe -= 8;
      note = ready ? '仕寄既成,一聲令下蟻附而上——此番攀城,血流得少些。'
                   : '未及逼近便下令乘り崩し,士卒暴露於矢石之下……';
    }else if(myCmd === 'hiya'){
      const p = clamp((c.weather==='rain' ? 0.05 : c.weather==='fog' ? 0.35 : 0.55) + g.chi*0.003, 0.03, 0.85);
      atkPenalty *= 0.7;
      if(Math.random() < p){
        BT.fired = true; morFoe -= 22;
        note = '火矢如雨,櫓與塀燒作一片——城中大亂!(城砦暫失一級之利)';
      }else{
        morMy -= 6;
        note = c.weather==='rain' ? '雨中放火,矢盡而火不起……' : '火矢為城兵撲滅,徒耗箭矢。';
      }
    }
  }
  if(BT.shiyori > 0 && myCmd !== 'shiyori') BT.shiyori -= 1;
  // 敵軍攻我城時的寄せ手(鏡像)
  if(c.defend){
    if(foeCmd === 'suppress'){ myS *= 0.76; defShelter *= 0.72; }
    else if(foeCmd === 'shiyori'){ defShelter *= 0.70; BT.foeReady = 2; }
    else if(foeCmd === 'assault'){
      BT.foeAssaulted = true;
      const fr = BT.foeReady > 0;
      foeS *= fr ? 1.22 : 1.0;
      defShelter *= fr ? 0.88 : 1.55;
      morMy -= 8;
    }else if(foeCmd === 'hiya'){
      const fp = clamp((c.weather==='rain' ? 0.05 : c.weather==='fog' ? 0.35 : 0.55) + (fg?.chi ?? 50)*0.003, 0.03, 0.85);
      defShelter *= 0.7;
      if(Math.random() < fp){ BT.fired = true; morMy -= 22; note = note || '敵之火矢燒著櫓塀,城中一片焦煙!'; }
      else morFoe -= 6;
    }
    if(BT.foeReady > 0 && foeCmd !== 'shiyori') BT.foeReady -= 1;
  }
  // 迂迴判定
  if(myCmd==='flank'){
    const p = clamp(0.12 + g.chi*0.0075 + (F.flank||0) + (c.terrain==='mountain'?0.12:0) - (c.siege?0.15:0), 0.05, 0.9);
    if(Math.random() < p){ myS *= 1.35; morFoe -= 16; note = `${g.name} 引兵迂迴,突入敵軍側背!敵陣大亂。`; }
    else { foeS *= 1.40; morMy -= 15; note = `迂迴之計為敵所察,半途遭邀擊,陣列大亂……`; }
  }
  // 敵軍的迂迴也該有勝算與戰果(此前敵方下迂迴等於什麼都沒做,是玩家的隱形加成)
  if(foeCmd==='flank'){
    const fp = clamp(0.12 + (fg?.chi ?? 50)*0.0075 + (SP && SP.kind==='rappa' ? 0.15 : 0) + (c.terrain==='mountain'?0.12:0) - (c.defend?0.15:0), 0.05, 0.9);
    if(Math.random() < fp){ foeS *= 1.35; morMy -= 16; note = note || `敵軍迂迴繞出,直薄我側背!`; }
    else { myS *= 1.40; morFoe -= 15; note = note || `敵之迂迴為我所料,半途擊之。`; }
  }
  if(foeCmd==='flank' && F.flankVuln) myS /= F.flankVuln;
  if(foeCmd==='charge' && F.chargeVuln) myS /= F.chargeVuln;
  // ── 戰場要地(P1):爭奪判定與持有之利 ──
  BT._defileMy = false; BT._defileFoe = false;
  if(BT.feat){
    const FT = BT.feat;
    if(myCmd === 'contest'){
      const defd = FT.holder === 'foe';
      myS *= defd ? 0.80 : 0.92;   // 取無主之地=輕騎疾進;奪敵據之地=強襲
      const p = clamp((defd ? 0.55 : 0.85) + (BT.myMor - BT.foeMor)/250 + ((t.bu - (BT.cfg.foe.general?.bu ?? 55))/300)
                      - (foeCmd === 'contest' ? 0.12 : 0), 0.15, 0.95);
      if(Math.random() < p){
        FT.holder = 'my'; morFoe -= (defd ? 9 : 5); morMy += 5;
        note = `${t.name} 麾下疾進,${defd?'血戰逐敵,':''}搶下${FT.name}!` + (FT.kind==='ford' ? '敵欲渡而不得。' : FT.kind==='hill' ? '旗立高處,全軍振奮。' : '隘口既扼,敵進退維谷。');
      }else{
        morMy -= 2;
        note = `搶奪${FT.name}未果${defd ? '——敵據險而守,矢石如雨' : ''},徒耗士卒。`;
        if(foeCmd === 'contest' && FT.holder === null && Math.random() < 0.6){
          FT.holder = 'foe'; note += `敵反倒先我一步據之!`;
        }
      }
    }else if(foeCmd === 'contest'){
      const defd = FT.holder === 'my';
      foeS *= defd ? 0.80 : 0.92;
      const fp = clamp((defd ? 0.42 : 0.66) - (BT.myMor - BT.foeMor)/250, 0.12, 0.9);
      if(Math.random() < fp){ FT.holder = 'foe'; morMy -= (defd ? 6 : 4); note = note || `敵軍分兵疾進,奪下${FT.name}!`; }
      else { morFoe -= 3; note = note || `敵搶${FT.name},為我所拒。`; }
    }
    // 持有之利(當陣即生效;要地的真價值在士氣——敵望要地而不得,氣沮日甚)
    if(FT.holder === 'my'){
      if(FT.kind === 'ford'){ foeS *= 0.85; morMy += 2; morFoe -= 3; }
      else if(FT.kind === 'hill'){ myS *= 1.15; morMy += 3; morFoe -= 2; }
      else if(FT.kind === 'defile'){ BT._defileMy = true; morMy += 2; morFoe -= 2; }
    }else if(FT.holder === 'foe'){
      if(FT.kind === 'ford'){ myS *= 0.85; morFoe += 2; morMy -= 3; }
      else if(FT.kind === 'hill'){ foeS *= 1.15; morFoe += 3; morMy -= 2; }
      else if(FT.kind === 'defile'){ BT._defileFoe = true; morFoe += 2; morMy -= 2; }
    }
  }
  // ── 敵之物見的反制之利:有備而來的應手,比臨機應變狠得多 ──
  if(BT.adaptedNow){
    if(foeCmd==='hold' && myCmd==='charge'){
      myS *= 0.55; morMy -= 8;
      note = note || '敵早結槍衾以待——我軍突騎撞上槍林,人馬俱裂!';
    }else if(foeCmd==='charge' && myCmd==='volley'){
      foeS *= 1.20; morMy -= 3;
      note = note || '敵趁我齊射裝填之隙,猛撲而至!';
    }else if(foeCmd==='flank' && myCmd==='hold'){
      foeS *= 1.12;
      note = note || '我軍固守不動,敵遊兵繞出側背,箭石如雨。';
    }
  }
  // 損失(固守的減傷與士氣回復,敵我同享)
  const tot = myS + foeS || 1;
  const myRate = clamp(foeS/tot * 0.26 * (F.dmgTaken||1) * (myCmd==='hold' ? 0.78 : 1) * atkPenalty * (BT._defileMy ? 0.78 : 1), 0.015, 0.5);
  const foeRate = clamp(myS/tot * 0.26 * (foeCmd==='hold' ? 0.78 : 1) * defShelter * (BT._defileFoe ? 0.78 : 1), 0.015, 0.5);
  let myLost = armyLose(BT.my, myRate, c, BT.foe);
  const foeLost = armyLose(BT.foe, foeRate, c, BT.my);
  // ── 專屬兵種の奇兵(商人石火矢・水軍焙烙・忍眾亂波) ──
  let spNote = '';
  if(SP){
    const wet = c.weather === 'rain';
    let ex = 0;
    if(SP.kind === 'ishibiya' && foeCmd === 'volley' && !wet){
      ex = ri(SP.n * 0.10); morMy -= 3; spNote = '石火矢轟然,鐵丸直貫我陣';
    }else if(SP.kind === 'houroku' && !wet){
      ex = ri(SP.n * 0.07 * (armyTotal(BT.my) > armyTotal(BT.foe) ? 1.25 : 1));
      if(ex > 0){ morMy -= 2; spNote = '焙烙火玉拋落,烈焰驚亂隊列'; }
    }else if(SP.kind === 'rappa' && Math.random() < 0.25){
      ex = ri(SP.n * 0.09); morMy -= 5; spNote = '亂波乘夜襲我營帳';
    }
    if(ex > 0){
      const exLost = armyLose(BT.my, clamp(ex / Math.max(1, armyTotal(BT.my)), 0, 0.2), c, BT.foe);
      myLost += exLost;
      spNote = `【${SPECIALS[SP.kind].name}】${spNote}(我損 ${exLost})`;
    }else spNote = '';
    SP.n = Math.max(0, ri(SP.n * (1 - foeRate)));   // 特殊隊與本隊同受損耗
  }
  // 士氣
  morMy -= myRate*100*1.4; morFoe -= foeRate*100*1.4;
  if(myCmd==='hold') morMy += 7;
  if(foeCmd==='hold') morFoe += 7;
  if(myCmd==='charge' && foeLost > myLost) morFoe -= 6;
  if(foeCmd==='charge' && myLost > foeLost) morMy -= 6;
  { // 寡不敵眾:兵力比直接壓士氣;但據城者見圍兵再多也不慌,折扣之
    const rr = armyTotal(BT.my) / Math.max(1, armyTotal(BT.foe));
    const push = clamp((rr - 1) * 7, -14, 14);
    morFoe -= push * (c.siege ? 0.35 : 1);
    morMy  += Math.min(0, push) * 0.9 * (c.defend ? 0.35 : 1);
  }
  if(F.encircle && armyTotal(BT.my) > armyTotal(BT.foe)) morFoe -= 5;
  BT.myMor = clamp(BT.myMor + morMy, 0, 140);
  BT.foeMor = clamp(BT.foeMor + morFoe, 0, 140);
  if(SP && SP.kind === 'sohei' && armyTotal(BT.foe) > BT.foeInit * 0.18 && BT.foeMor < 26)
    BT.foeMor = 26;   // 僧兵狂信:兵未潰盡,志不可奪
  // 戰場記憶:指令與屍痕留給俯瞰圖
  BT.lastFoeCmd = foeCmd;
  BT.fallenMy = (BT.fallenMy||0) + myLost;
  BT.fallenFoe = (BT.fallenFoe||0) + foeLost;
  // 武者働き:占上風的回合,隨行武者有機會揚名
  let deed = '';
  if(foeLost > myLost*1.3 && foeLost >= 3 && Math.random() < 0.35){
    const pool = activeR().filter(x=>x !== BT.taisho && x !== BT.gunshi && (x.sick||0)===0);
    if(pool.length){
      const hero = pick1(pool);
      hero.merit = (hero.merit||0) + 1;
      deed = pick1([`${hero.name}一番槍,突入敵陣!`, `${hero.name}斬將奪旗,軍中喝采!`,
                    `${hero.name}拚死斷後,全隊無恙。`, `${hero.name}奮迅當先,取首級而還!`]) + '(功勳 +1)';
    }
  }
  BT.hist.push(`第${BT.round}陣:我軍${cmdName(myCmd)}、敵軍${cmdName(foeCmd)} → 我損 ${myLost}、敵損 ${foeLost}。${note}${spNote ? ' ' + spNote + '。' : ''}${deed ? ' ⚔' + deed : ''}`);
  // 勝負判定
  const myBroke = BT.myMor <= 0 || armyTotal(BT.my) <= 0;
  const foeBroke = BT.foeMor <= 0 || armyTotal(BT.foe) <= 0;
  if(myBroke || foeBroke || BT.round >= 5){
    // 未分崩潰者,以「殘存戰力 × 士氣」定勝負(原本除以初始兵力,人越少分母越小反而佔便宜)
    let win = foeBroke && !myBroke ? true : myBroke && !foeBroke ? false
      : (BT.myMor * armyTotal(BT.my) >= BT.foeMor * armyTotal(BT.foe));
    // 圍而不攻,城終不下:未曾登城者不得以「保存實力」取勝
    if(win && c.siege && !foeBroke && !BT.assaulted) win = false;
    if(!win && c.defend && !myBroke && !BT.foeAssaulted) win = true;
    endBattle(win, myBroke, foeBroke);
  }else battleRound();
}
function endBattle(win, myBroke, foeBroke){
  if(!BT) return;
  const t = BT.taisho;
  // 追擊:騎馬多者戰果加倍
  let pursuit = '';
  if(win && foeBroke){
    const kb = (BT.my.kiba||0)/(armyTotal(BT.my)||1);
    if(kb > 0.15){ armyLose(BT.foe, 0.35, BT.ctx, BT.my); pursuit = `\n騎馬隊窮追不捨,潰兵死傷枕藉!(戰果加成)`; }
  }
  // 敗走減損
  if(!win && myBroke){ pursuit += `\n我軍崩潰,幸而及時脫離戰場。`; }
  const myRemain = armyTotal(BT.my);
  const myLost = Math.max(0, BT.myInit - myRemain);
  const foeLossRatio = 1 - armyTotal(BT.foe)/Math.max(1, BT.foeInit);
  // 回填我軍
  const notSent = {};
  for(const k of U_KEYS) notSent[k] = Math.max(0, (S.army[k]||0) - ((BT.cfg.sent||S.army)[k]||0));
  for(const k of U_KEYS) S.army[k] = (notSent[k]||0) + (BT.my[k]||0);
  S.soldiers = armyTotal(S.army);
  t.stamina = clamp((t.stamina??100) - 22, 0, 100);
  const drill = battleTraining(win, foeLossRatio);
  const res = {win, myLost, myRemain, foeLossRatio, taisho:t, rounds:BT.round, broke:{my:myBroke, foe:foeBroke}};
  const cfg = BT.cfg;
  // ── 敵之物見(③):每交手一陣,該家對我軍編成的了解便深一層 ──
  if(cfg.rivalId){
    const rf = S.rivals.find(x=>x.id === cfg.rivalId);
    if(rf && rf.alive){
      const it = rf.intel = rf.intel || {n:0, teppoP:0, kibaP:0};
      const sa = cfg.sent || S.army, st2 = armyTotal(sa) || 1;
      it.teppoP = +(((it.teppoP*it.n) + (sa.teppo||0)/st2) / (it.n+1)).toFixed(2);
      it.kibaP  = +(((it.kibaP*it.n)  + (sa.kiba||0)/st2)  / (it.n+1)).toFixed(2);
      it.n = Math.min(6, it.n + 1);
      delete it.fake;                          // 真刀真槍過一場,流言不攻自破
    }
  }
  queueModal({
    title: win ? `【勝】${cfg.title}` : `【敗】${cfg.title}`,
    hud: battleHud(),
    body: BT.hist.join('\n') + `\n\n──────\n`+
      (win ? (foeBroke ? '敵軍崩潰,四散奔逃!' : '兩軍相持,我方略佔上風,敵軍先退。')
           : (myBroke ? '我軍士氣崩潰,陣線瓦解……' : '力有未逮,只得收兵。')) + pursuit +
      `\n\n我軍折損 ${myLost}(殘存 ${myRemain}:${armyLabel(BT.my)})\n敵軍損失約 ${ri(foeLossRatio*100)}%`+
      (drill ? `\n\n──── 陣立ち ────\n${drill}` : ''),
    choices:[{label:'收兵', fn:()=>{ const cb = cfg.onEnd; BT = null; if(cb) cb(res); }}]
  });
  pumpModal();
}
// 參戰者的實戰歷練:大將・軍師・供廻り二名,依戰事烈度成長並累積兵種經驗
function battleTraining(win, foeLossRatio){
  const t = BT.taisho, g = BT.gunshi, army = BT.my;
  // 烈度:打得越久、殺傷越重、獲勝者所得越多;敗戰亦是良師,但折半有餘
  const heat = clamp(0.55 + foeLossRatio*0.8 + BT.round*0.07 + (win?0.25:0), 0.5, 2.0);
  const out = [], opened = [];
  const push = (r, txt) => { if(txt) out.push(`${r.name}${txt}`); };

  push(t, grow(t, 'bu', 1.15*heat));
  push(t, grow(t, 'chi', 0.45*heat));
  t.merit = (t.merit||0) + 2;
  opened.push(...addAptExp(t, army, 36*heat));

  if(g && g !== t){
    push(g, grow(g, 'chi', 1.0*heat));
    push(g, grow(g, 'bu', 0.3*heat));
    g.stamina = clamp((g.stamina??100) - 14, 0, 100);
    g.merit = (g.merit||0) + 2;
    opened.push(...addAptExp(g, army, 16*heat));
  }
  // 供廻り:隨行的年輕武者,經驗較薄但人人有份
  const pool = activeR().filter(r => r !== t && r !== g && (r.sick||0) === 0 && (r.stamina??100) > 25);
  const kin = [];
  for(let i=0; i<2 && pool.length; i++) kin.push(pool.splice(ri(Math.random()*(pool.length-1)), 1)[0]);
  for(const r of kin){
    ensureApt(r);
    push(r, grow(r, 'bu', 0.6*heat));
    r.stamina = clamp((r.stamina??100) - 12, 0, 100);
    r.merit = (r.merit||0) + 1;
    opened.push(...addAptExp(r, army, 12*heat));
  }
  const roster = `大將 ${t.name}${g&&g!==t?`・軍師 ${g.name}`:''}${kin.length?`・供廻り ${kin.map(r=>r.name).join('、')}`:''}`;
  opened.forEach(l => log(`⚔ ${l}`, 'good'));
  return `${roster}\n${out.length ? out.join('\n') : '此戰未見顯著長進。'}`+
         (opened.length ? `\n${opened.map(l=>'⚔ '+l).join('\n')}` : '');
}

const ROSTER_MAX = 12;

const spareR  = () => S.retainers.filter(r => r.spare);
function rosterAdd(r){                       // 新人入列;滿員則暫列部屋住
  if(activeR().length >= ROSTER_MAX) r.spare = true;
  S.retainers.push(r);
  return r;

function rosterPromote(lines){               // 出缺時,部屋住依才幹遞補
  while(activeR().length < ROSTER_MAX){
    const cands = spareR();
    if(!cands.length) break;
    const c = cands.reduce((a,b)=> (b.bu+b.nai+b.chi) > (a.bu+a.nai+a.chi) ? b : a);
    c.spare = false;
    if(lines) lines.push(`${c.name} 自部屋住列席家中,受命任事。`);
  }
}
